\",\"B형 간염 등 국가예방접종 일정 확인\",\"산모 산후 검진\"]},{\"months\":[2,3],\"label\":\"2~3개월\",\"development\":\"웃기 시작해요. 목을 가누기 시작하고, 자기 손을 발견해서 한참 들여다보기도 해요.\",\"feeding\":\"수유 간격이 조금씩 길어져요. 먹는 양이 날마다 들쭉날쭉한 시기라 하루치로 봐도 괜찮아요.\",\"sleep\":\"밤잠이 조금씩 길어져요. 낮에는 밝게, 밤에는 어둡게 지내면 리듬이 잡히는 데 도움이 돼요.\",\"parenting\":\"아이가 웃을 때 같이 웃어주세요. 주고받는 그 반응이 이 시기의 배움이에요.\",\"checklist\":[\"2개월 영유아 건강검진\",\"예방접종\",\"엎드려 놀기(터미타임) 짧게 시작\"]},{\"months\":[4,5],\"label\":\"4~5개월\",\"development\":\"뒤집기를 시도해요. 손에 잡히는 건 뭐든 입으로 가져가요.\",\"feeding\":\"이유식 시작 시기를 상담할 때예요. 보통 4~6개월 사이에 시작해요.\",\"sleep\":\"밤에 자주 깨는 시기가 오기도 해요. 발달이 한 단계 넘어갈 때 잠이 함께 흔들려요.\",\"parenting\":\"아이가 내는 소리를 그대로 따라 해보세요. 그게 대화의 시작이에요.\",\"checklist\":[\"이유식 시작 상담\",\"떨어질 수 있는 곳 주의\",\"4개월 검진\"]},{\"months\":[6,8],\"label\":\"6~8개월\",\"development\":\"혼자 앉아요. 낯가림이 시작되고, 이름을 부르면 돌아봐요.\",\"feeding\":\"이유식이 자리를 잡아요. 새 재료는 하나씩 주고 3일쯤 반응을 봐요.\",\"sleep\":\"분리 불안 때문에 밤에 깨는 일이 늘 수 있어요.\",\"parenting\":\"낯가림이 시작되면 서운하실 수 있어요. 애착이 자라고 있다는 신호이기도 해요. \\\"까꿍\\\" 놀이를 해보세요. 사라져도 다시 온다는 걸 배우는 시기예요.\",\"checklist\":[\"6개월 검진\",\"알레르기 반응 관찰\",\"이가 나기 시작\"]},{\"months\":[9,11],\"label\":\"9~11개월\",\"development\":\"기어 다니고 붙잡고 서요. 손가락으로 작은 것을 집어요.\",\"feeding\":\"손으로 집어 먹는 음식을 줘보세요. 스스로 먹으려는 시도가 시작돼요.\",\"sleep\":\"낮잠이 하루 두 번으로 줄어요.\",\"parenting\":\"위험한 곳을 미리 막아두면 \\\"안 돼\\\"라고 할 일이 줄어요. 말리는 횟수보다 환경을 바꾸는 쪽이 서로 편해요.\",\"checklist\":[\"9개월 검진\",\"집 안 안전 점검\",\"콘센트·모서리 보호\"]},{\"months\":[12,17],\"label\":\"12~17개월\",\"development\":\"걷기 시작해요. 첫 낱말이 나오고, 원하는 것을 손가락으로 가리켜요.\",\"feeding\":\"가족 식탁에 함께 앉아요. 먹는 양의 기복이 커지는 시기예요.\",\"sleep\":\"낮잠이 한 번으로 줄어드는 과도기예요.\",\"parenting\":\"아이가 가리키는 것에 이름을 붙여 말해주세요. 말이 늘어나는 통로가 거기예요.\",\"checklist\":[\"돌 검진\",\"MMR 등 예방접종\",\"치과 첫 방문\"]},{\"months\":[18,23],\"label\":\"18~23개월\",\"development\":\"낱말이 빠르게 늘고 \\\"싫어\\\"가 시작돼요. 자기 뜻이 분명해지는 때예요.\",\"feeding\":\"편식이 나타나요. 강요하지 않고 계속 내어놓다 보면 어느 날 먹기도 해요.\",\"sleep\":\"잠자리 저항이 생겨요. 매일 같은 순서로 잠자리 의식을 두면 도움이 돼요.\",\"parenting\":\"떼쓰기가 시작되면 나만 이런가 싶어지죠. 이 시기엔 누구나 겪어요. 상황 연습을 미리 해두면 그 순간에 덜 흔들려요.\",\"checklist\":[\"18개월 검진\",\"발달선별검사\",\"안전사고 주의 — 활동 범위가 넓어짐\"]},{\"months\":[24,35],\"label\":\"24~35개월\",\"development\":\"두세 낱말을 이어 말해요. 또래에게 관심을 보이지만 아직 같이 놀지는 못해요.\",\"feeding\":\"스스로 먹으려고 해요. 흘리는 건 각오하시는 게 마음 편해요.\",\"sleep\":\"밤 기저귀를 떼기 전 단계예요. 서두르지 않아도 괜찮아요.\",\"parenting\":\"선택지를 두 개만 주면 실랑이가 줄어요. \\\"이거 할래, 저거 할래?\\\"\",\"checklist\":[\"30개월 검진\",\"배변 훈련 시작 여부 판단\",\"어린이집 적응\"]},{\"months\":[36,47],\"label\":\"만 3세\",\"development\":\"문장으로 말하고 \\\"왜?\\\"가 시작돼요. 규칙이 있는 놀이를 하고, 또래와 잠깐씩 함께 놀아요. 가위질처럼 손끝을 쓰는 일이 늘어나요.\",\"feeding\":\"가족과 같은 것을 먹어요. 자라는 속도가 느려지면서 먹는 양이 줄어드는데, 그래서 편식이 심해진 것처럼 보이는 시기예요.\",\"sleep\":\"낮잠이 사라지는 아이가 늘어요. 낮잠이 빠지면 밤 취침 시각을 앞당기는 쪽이 수월해요.\",\"parenting\":\"\\\"왜?\\\"가 하루에 몇십 번씩 오면 지치실 거예요. 매번 답하지 않아도 되고, 되물어도 돼요. 설명은 짧게, 아이 말은 끝까지 들어주세요.\",\"checklist\":[\"42개월 영유아 건강검진\",\"어린이집·유치원 적응\",\"손 씻기 습관\",\"낮잠이 빠졌다면 취침 시각 조정\"]},{\"months\":[48,59],\"label\":\"만 4세\",\"development\":\"이야기를 지어내고 상상 속 친구가 생기기도 해요. 또래와 역할을 나눠 놀지만, 지는 것은 아직 크게 힘들어해요.\",\"feeding\":\"스스로 덜어 먹을 수 있어요. 먹는 시간이 길어지는 시기라 시간을 정해 두는 집이 많아요.\",\"sleep\":\"대부분 낮잠 없이 지내요. 밤에 무서움이나 악몽이 늘어나기도 해요.\",\"parenting\":\"지는 놀이를 일부러 해보세요. 감정을 다루는 연습이 놀이 안에서 돼요.\",\"checklist\":[\"54개월 영유아 건강검진\",\"시력·청력 확인\",\"치과 정기 검진\",\"또래 관계 관찰\"]},{\"months\":[60,71],\"label\":\"만 5세\",\"development\":\"글자에 관심이 생겨요. 친구 관계가 좁고 깊어지면서 편 가르기나 따돌림이 나타나기도 해요.\",\"feeding\":\"밖에서 먹는 일이 늘어요. 간식이 식사를 밀어내지 않게 시간을 정해 두면 좋아요.\",\"sleep\":\"취학을 앞두고 기상 시각이 당겨져요. 일어나는 시각보다 잠드는 시각을 먼저 당기는 쪽이 수월해요.\",\"parenting\":\"하루에 있었던 일을 아이가 먼저 꺼낼 때까지 기다려보세요. 질문을 늘리는 것보다 나아요.\",\"checklist\":[\"66개월 영유아 건강검진\",\"취학 전 기상·취침 시각 맞추기\",\"스스로 챙기는 물건 하나 정하기\"]},{\"months\":[72,95],\"label\":\"만 6~7세 (초등 저학년)\",\"development\":\"읽고 쓰기가 자리를 잡아요. 규칙과 공정함에 민감해져서 \\\"불공평해\\\"라는 말이 늘어요.\",\"feeding\":\"급식으로 하루 한 끼를 밖에서 먹어요. 집에서는 아침 챙기기가 과제가 되죠.\",\"sleep\":\"학교 시각에 맞추느라 잠이 부족해지기 쉬워요. 이 나이대에는 하루 9~12시간을 권해요.\",\"parenting\":\"학교에서 뭐 했냐고 물으면 \\\"몰라\\\"만 돌아오죠. 캐묻는 대신 부모의 하루를 먼저 말해보세요. 대답이 아니라 대화가 돼요.\",\"checklist\":[\"초등학교 입학 준비\",\"취학 전후 예방접종 확인\",\"시력 검사 — 칠판이 안 보이는 것을 아이가 먼저 말하는 경우는 드물어요\",\"화면 사용 규칙 정하기\"]},{\"months\":[96,131],\"label\":\"만 8~10세\",\"development\":\"관심사가 뚜렷해지고, 잘하는 것과 못하는 것을 스스로 견주기 시작해요. 또래의 평가가 부쩍 커져요.\",\"feeding\":\"스스로 고르는 일이 늘어요. 집에 무엇을 사 두는지가 곧 무엇을 먹는지가 돼요.\",\"sleep\":\"화면이 취침 시각을 밀어내요. 기기를 잠자리 밖에 두는 규칙은 이 시기에 만들어 두면 나중이 수월해요.\",\"parenting\":\"결과보다 어떻게 했는지를 말해주세요. 비교는 이미 아이가 하고 있어요.\",\"checklist\":[\"초등학교 건강검진(학교 실시)\",\"빠른 아이는 2차 성징이 시작될 수 있음\",\"용돈 규칙 정하기\",\"온라인에서 만나는 사람에 대해 이야기하기\"]},{\"months\":[132,167],\"label\":\"만 11~13세\",\"development\":\"몸이 빠르게 변하고 그 속도가 아이마다 크게 달라요. 부모의 말보다 또래의 말이 커지는 시기예요.\",\"feeding\":\"먹는 양이 갑자기 늘거나 줄어요. 겉모습에 대해 무심코 한 말을 아이가 오래 기억해요.\",\"sleep\":\"생체 리듬이 뒤로 밀려 늦게 자고 늦게 일어나요. 게을러진 게 아니라 이 시기에 흔한 변화예요.\",\"parenting\":\"방문을 닫기 시작하면 밀려난 기분이 드시죠. 거부가 아니라 자기 자리를 만드는 중이에요. 매일 같은 자리에 함께 있는 시간 하나만 지켜보세요.\",\"checklist\":[\"중학교 입학 준비\",\"2차 성징에 대해 미리 이야기하기\",\"휴대폰 사용 규칙 다시 정하기\",\"학교 상담 창구 확인해 두기\"]},{\"months\":[168,999],\"label\":\"만 14세 이상\",\"development\":\"자기 생각이 분명해지고 부모와 다른 결론에 닿아요. 대화가 진로와 성적으로만 좁아지기 쉬운 시기예요.\",\"feeding\":\"끼니를 거르거나 밤에 몰아 먹는 일이 늘어요. 매 끼니를 챙기기보다 주에 몇 번 같이 먹을지를 정해 두는 쪽이 나아요.\",\"sleep\":\"잠이 부족한 상태가 길게 이어지기 쉬워요. 주말에 몰아 자는 것으로는 메워지지 않아요.\",\"parenting\":\"조언을 줄이고 듣는 시간을 늘려보세요. 물어봐 주기를 기다리는 쪽이 결국 빨라요.\",\"checklist\":[\"중·고등학교 건강검진\",\"정신건강 상담 창구를 미리 알아 두기\",\"진로 이야기는 성적과 분리해서 꺼내기\",\"스스로를 해치는 말이 보이면 전문기관에 연락\"]}]}}],null],null],null]},[null,[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"past\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/ff97be679d525c30.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"ko\",\"ch
