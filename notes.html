ge-c8a6296489ef6890.js\"],\"default\"]\n5:I[4707,[],\"\"]\n6:I[6423,[],\"\"]\n7:I[7212,[\"185\",\"static/chunks/app/layout-6338cd704d26ae5c.js\"],\"default\"]\n9:I[1060,[],\"\"]\na:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"lVM3bWPC_Il9MfLUuOqiQ\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"notes\"],\"initialTree\":[\"\",{\"children\":[\"notes\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"notes\",{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"pregnancy\":[{\"id\":\"n-nausea\",\"term\":\"입덧\",\"also\":\"임신오조 · 구역질\",\"whenTalked\":\"초기에 가장 많이 이야기되고, 시기가 지나면서 달라지는 사람이 많아요.\",\"what\":\"이걸 언제까지 견뎌야 하나 싶으시죠. 속이 울렁거리고 먹는 것이 어려워지는 것을 통틀어 부르는 말이에요. 냄새에 예민해지거나 늘 먹던 음식이 갑자기 싫어지기도 해요. 정도는 사람마다 크게 다르고, 물조차 넘기기 어렵고 체중이 줄어드는 경우는 \\\"임신오조\\\"라는 다른 이름으로 따로 이야기해요. 참고 견디는 것 말고 다른 방법이 있는 영역이라, 힘들면 힘들다고 말씀하셔도 돼요.\",\"howChecked\":\"얼마나 먹고 마실 수 있는지, 체중과 소변 상태가 어떤지를 진료에서 함께 봐요. 수분이 얼마나 빠졌는지는 피검사와 소변검사로 보고, 약을 쓸지와 어떤 약을 쓸지는 담당 의료진이 정해요.\",\"notAtHome\":\"\\\"이 정도면 심한 편인가\\\"를 스스로 가늠할 방법은 없어요. 남들이 쓴 글과 견주어 참을 만한지 재지 마세요. 먹은 것이 없는데도 계속 토하거나, 소변이 눈에 띄게 줄거나, 서 있을 때 핑 도는 느낌이 있으면 그건 견디는 문제가 아니에요.\",\"ask\":[\"지금 먹고 마시는 정도를 말씀드리면, 어디서부터 연락해야 하나요?\",\"쓸 수 있는 약이 있나요? 어떤 점을 보고 정하시나요?\",\"체중이 줄고 있는데 다음 진료를 앞당겨야 할까요?\",\"입덧 때문에 못 챙기는 영양제는 어떻게 할까요?\"],\"callNow\":\"하루 종일 물도 넘기지 못할 때, 소변이 거의 나오지 않을 때, 어지러워 서 있기 어려울 때, 토한 것에 피가 섞일 때는 기다리지 말고 연락하세요.\"},{\"id\":\"n-ectopic\",\"term\":\"자궁외임신\",\"also\":\"자궁 밖 임신 · 착상 위치\",\"whenTalked\":\"초기 초음파에서 아기집이 자궁 안에 보이는지 확인할 때 이야기돼요.\",\"what\":\"이 말을 듣고 나오면 머릿속이 하얘지죠. 무슨 말인지부터 아셔야 다음을 정할 수 있어요. 수정된 배아가 자궁 안이 아닌 곳에 자리 잡은 경우를 가리키는 말이에요. 나팔관 쪽이 가장 많이 이야기돼요. 임신 반응은 똑같이 나오기 때문에 반응만으로는 알 수 없고, 초음파로 자궁 안에 아기집이 보이는지를 봐요. 아주 이른 시기에는 \\\"아직 안 보이는 것\\\"과 구별이 어려워 며칠 뒤 다시 보는 일이 흔해요. 누구의 잘못으로 생기는 일이 아니에요.\",\"howChecked\":\"초음파로 위치를 보고, 임신 호르몬 수치의 변화를 시간 간격을 두고 함께 봐요. 한 번의 값이 아니라 흐름을 보는 것이라 며칠 뒤 다시 오라는 말을 듣게 돼요. 이후 절차는 담당 의료진이 정해요.\",\"notAtHome\":\"임신 반응 검사로는 위치를 알 수 없어요. 두 줄이 진하게 나왔다는 것으로 자궁 안에 있다고 볼 수 없고, 배가 아프지 않다고 해서 아닌 것으로 둘 수도 없어요. 위치는 초음파로만 보여요.\",\"ask\":[\"지금 초음파에서 무엇이 보이고 무엇이 아직 안 보이나요?\",\"다시 확인하러 언제 와야 하나요?\",\"그때까지 어떤 느낌이 있으면 바로 와야 하나요?\",\"제 수치의 흐름은 어떻게 보고 계신가요?\"],\"callNow\":\"한쪽 아랫배가 갑자기 심하게 아플 때, 어깨 끝이 결리듯 아플 때, 식은땀이 나며 어지럽거나 정신이 아득할 때, 출혈이 있을 때는 바로 응급실로 가세요. 시간을 다투는 상황이에요.\"},{\"id\":\"n-early-loss\",\"term\":\"초기 유산\",\"also\":\"계류유산 · 자연유산\",\"whenTalked\":\"초기 초음파에서 이야기되는 경우가 많아요.\",\"point\":\"대부분이 처음부터 정해진 이유로 일어나고, 본인이 한 일이나 하지 않은 일 때문이 아니에요.\",\"what\":\"임신 초기에 임신이 이어지지 못하는 경우를 가리키는 말이에요. 무거운 것을 들어서, 신경을 써서, 늦게 알아서 그렇게 되는 것이 아니에요. 그럼에도 스스로를 탓하게 되는 일이 매우 흔해요.\",\"howChecked\":\"초음파와 피 검사로 확인하며, 한 번에 정해지지 않아 며칠 뒤 다시 보는 경우가 많아요. 그 뒤의 절차는 몸 상태와 시기에 따라 여러 가지가 있고 담당 의료진과 함께 정해요.\",\"notAtHome\":\"출혈이 있다고 해서 그렇게 되는 것도 아니고, 아무 증상이 없다고 해서 아닌 것도 아니에요. 집에서는 알 수 없어요 — 검색해서 남의 경우와 견주는 것이 가장 오래 힘든 길이에요.\",\"ask\":[\"지금 어떤 상태로 보고 계신가요? 다시 확인은 언제 하나요?\",\"제가 선택할 수 있는 방법에는 무엇이 있나요?\",\"몸이 회복되는 데 얼마나 걸리나요?\",\"다음 임신을 생각한다면 언제 이야기하면 되나요?\"],\"callNow\":\"출혈이 많거나 어지럽고 열이 나면 바로 연락하세요. 마음이 오래 가라앉아 있을 때도 혼자 두지 마세요 — 정신건강상담 1577-0199.\"},{\"id\":\"n-subchorionic\",\"term\":\"융모막하혈종\",\"also\":\"자궁 안에 피가 고였다 · 착상혈종\",\"whenTalked\":\"초기 초음파에서 이야기되는 경우가 많아요.\",\"what\":\"검색해 보고 놀라서 오셨을 거예요. 아기집 주변에 피가 고인 자리가 보이는 것을 가리키는 말이에요. 검색하면 유산과 함께 나오는 글이 많아 놀라기 쉽지만, 이 말 자체는 \\\"지금 초음파에 이런 것이 보인다\\\"는 관찰이지 앞으로 어떻게 된다는 뜻이 아니에요. 갈색 출혈이 비치는 경우도 있고 아무 느낌이 없는 경우도 있어요.\",\"howChecked\":\"초음파로 위치와 크기를 보고, 시기를 두고 다시 보며 달라지는지를 봐요. 활동을 어느 정도로 할지, 쉬어야 할지는 위치와 경과를 보고 담당 의료진이 말해 줘요.\",\"notAtHome\":\"출혈의 양이나 색으로 지금 어떤 상태인지 가늠할 수 없어요. 피가 비치지 않아도 안에 있을 수 있고, 갈색이라고 해서 지나간 것이라고 볼 수도 없어요. 줄고 있는지는 초음파로만 보여요.\",\"ask\":[\"지금 보이는 것을 어떻게 보고 계신가요?\",\"언제 다시 확인하나요?\",\"일이나 운동, 무거운 것 드는 일은 어떻게 할까요?\",\"어떤 출혈이면 기다리지 말고 연락해야 하나요?\"],\"callNow\":\"생리보다 많은 양의 붉은 피가 나올 때, 덩어리가 나올 때, 배가 아프면서 출혈이 있을 때는 바로 연락하세요.\"},{\"id\":\"n-bleeding\",\"term\":\"임신 중 출혈\",\"also\":\"하혈 · 착상혈\",\"whenTalked\":\"어느 시기에나 있을 수 있고, 시기마다 이야기되는 내용이 달라요.\",\"point\":\"흔하다는 것과 그냥 두어도 된다는 것은 다른 말이에요.\",\"what\":\"임신 중 출혈은 원인이 여러 가지이고, 같은 양이라도 시기와 상황에 따라 다르게 봐요. 초기의 소량 출혈은 흔하다고 알려져 있어요.\",\"howChecked\":\"병원에서 초음파와 진찰로 확인해요. 무엇 때문인지는 밖에서 보이는 색이나 양으로 갈리지 않아요.\",\"notAtHome\":\"색이 옅으니 괜찮다거나 양이 적으니 두고 보자는 판단을 집에서 하지 마세요. 이 앱도 그 판단을 하지 않아요. 인터넷에서 남의 경험과 견주는 것이 가장 늦어지는 길이에요.\",\"ask\":[\"제 경우 어떤 출혈이면 바로 연락해야 하나요?\",\"야간에는 어디로 가면 되나요?\",\"갈 때 무엇을 챙기면 도움이 되나요?\"],\"callNow\":\"출혈이 있으면 양과 색에 관계없이 담당 의료기관에 연락해 확인하세요.\"},{\"id\":\"n-due-date\",\"term\":\"예정일 · 주수가 바뀌었다\",\"also\":\"분만예정일 · 주수 재설정\",\"whenTalked\":\"초기 초음파에서 정해지고, 그 뒤로는 잘 바꾸지 않아요.\",\"what\":\"마지막 생리일로 세던 주수를, 초기 초음파에서 잰 아이의 크기로 다시 맞추는 일이 있어요. 그래서 처음 알던 주수와 병원이 부르는 주수가 다를 수 있어요. 예정일은 \\\"그날 태어난다\\\"는 날이 아니라 앞으로의 검사 시기를 잡는 기준점이에요. 실제로 그날에 맞춰 태어나는 경우가 오히려 드물어요.\",\"howChecked\":\"초기 초음파의 크기를 기준으로 정해요. 한 번 정한 예정일은 후기에 아이가 크거나 작게 보인다고 해서 다시 바꾸지 않는 것이 보통이에요 — 기준이 흔들리면 검사 시기도 함께 흔들리기 때문이에요.\",\"notAtHome\":\"인터넷 계산기에 마지막 생리일을 넣어 나온 날과 병원의 날이 다를 수 있어요. 그때 기준이 되는 것은 병원의 기록이에요. 어느 쪽이 맞는지 집에서 따질 일이 아니라 진료 때 한 번 확인하면 돼요.\",\"ask\":[\"제 예정일은 무엇을 기준으로 정한 건가요?\",\"앞으로 검사 시기는 이 날짜로 잡히나요?\",\"예정일이 지나면 어떻게 하게 되나요?\",\"회사에 낼 서류에는 어느 날짜를 쓰면 되나요?\"]},{\"id\":\"n-supplements\",\"term\":\"엽산 · 철분 · 영양제\",\"also\":\"임산부 비타민 · 비타민D\",\"whenTalked\":\"초기부터 이야기되고, 시기에 따라 챙기라는 것이 달라져요.\",\"what\":\"임신 시기마다 더 필요해지는 영양소가 있어 보충을 권하는 것을 말해요. 엽산은 이른 시기에, 철분은 대개 중기를 넘기며 이야기돼요. 사람마다 검사 결과와 먹는 상태가 달라 권하는 것도 달라져요.\",\"howChecked\":\"피검사 결과와 지금 먹고 있는 것을 함께 보고 정해요. 종류와 양은 담당 의료진이 정하며, 여러 제품을 같이 먹으면 같은 성분이 겹치는 일이 있어 먹고 있는 것을 전부 말씀해 주세요.\",\"notAtHome\":\"\\\"많이 먹으면 더 좋다\\\"가 통하지 않는 영역이에요. 성분에 따라 지나치게 먹으면 오히려 곤란해지는 것이 있어 용량을 스스로 올리지 마세요. 지금 부족한지 아닌지는 피검사로 보는 것이지 몸의 느낌으로 알 수 없어요.\",\"ask\":[\"지금 제 검사 결과로 볼 때 무엇을 챙기면 될까요?\",\"제가 먹고 있는 이 제품들을 같이 먹어도 되나요?\",\"철분을 먹고 속이 불편한데 어떻게 할까요?\",\"언제까지 먹나요?\"]},{\"id\":\"n-medication\",\"term\":\"임신 중에 약을 먹어도 되나요\",\"also\":\"감기약 · 해열제 · 원래 먹던 약\",\"whenTalked\":\"임신인 줄 모르고 먹은 약 때문에 초기에 많이 이야기되고, 아플 때마다 다시 이야기돼요.\",\"what\":\"이미 먹은 약이 있으면 그것부터 마음에 걸리죠. 임신 중의 약은 \\\"되는 약 / 안 되는 약\\\"으로 딱 나뉘지 않고, 어떤 시기에 얼마나, 무엇 때문에 먹는지를 함께 놓고 봐요. 원래 먹던 약이 있다면 임신했다고 스스로 끊는 쪽이 더 곤란해지는 경우가 많아요 — 끊어서 생기는 일까지 같이 봐야 하기 때문이에요.\",\"howChecked\":\"약 이름과 먹은 시기, 먹은 양을 가지고 봐요. 포장이나 처방전을 가져가면 이야기가 빨라져요. 다른 과에서 처방받을 때는 임신 중이라는 것을 먼저 말하세요.\",\"notAtHome\":\"인터넷에 도는 \\\"임신 중 안전한 약\\\" 목록으로 스스로 정하지 마세요. 같은 이름의 약에도 성분이 여럿 섞인 것이 있고, 시기에 따라 이야기가 달라져요. 이미 먹은 약을 두고 혼자 최악을 검색하는 것보다 이름을 적어 가서 물어보는 편이 빨라요.\",\"ask\":[\"임신인 줄 모르고 이 약을 먹었는데 어떻게 보시나요?\",\"열이 나거나 아플 때 먹어도 되는 약을 미리 알려주실 수 있나요?\",\"원래 먹던 이 약은 계속 먹나요, 바꾸나요?\",\"다른 병원에 갈 때 뭐라고 말하면 되나요?\"]},{\"id\":\"n-fever\",\"term\":\"임신 중에 열이 나거나 감기에 걸렸어요\",\"also\":\"발열 · 감기 · 독감 · 코로나\",\"whenTalked\":\"환절기와 겨울에 많이 이야기되고, 첫 진료 때 미리 안내받기도 해요.\",\"point\":\"열은 그 자체로 봐야 하는 신호예요. 감기니까 지나가겠지 하고 두는 시간이 가장 아까워요.\",\"what\":\"아플 때 제일 먼저 걸리는 건 \\\"약을 못 먹으니 참아야 하나\\\"예요. 그런데 임신 중에는 열 자체를 오래 두지 않는 쪽으로 이야기해요. 원인이 감기든 다른 것이든, 열이 이어지는 상태는 따로 보는 것이 있어요. 임신 중에는 면역이 달라져서 같은 감염도 더 오래가거나 무겁게 지나가는 경우가 있고, 그래서 참는 것이 미덕이 아닌 영역이에요.\",\"howChecked\":\"언제부터 몇 도까지 올랐는지, 다른 증상이 무엇인지를 함께 봐요. 필요하면 검사로 무엇 때문인지 가려요. 쓸 수 있는 해열제와 약은 임신 중에도 따로 있어서, 참지 말고 담당 의료진에게 물어보세요.\",\"notAtHome\":\"감기인지 독감인지 다른 것인지 증상만으로 가려낼 수 없어요. 해열제를 먹고 열이 내렸다고 해서 지나간 것으로 볼 수도 없어요. 인터넷에서 \\\"임신 중 먹어도 되는 감기약\\\" 목록을 찾아 스스로 정하지 마세요 — 같은 이름의 약에도 성분이 여럿 섞인 것이 있어요.\",\"ask\":[\"지금 열이 이 정도인데 언제부터 연락해야 하나요?\",\"집에 두고 먹어도 되는 해열제를 미리 알려주실 수 있나요?\",\"독감이나 코로나 검사를 받아야 할까요?\",\"아이에게 영향이 있는지는 무엇으로 보나요?\"],\"callNow\":\"열이 하루 넘게 이어질 때, 숨이 차거나 가슴이 아플 때, 물을 넘기기 어려울 때, 열과 함께 배가 뭉치거나 태동이 평소와 다를 때는 기다리지 말고 연락하세요.\"},{\"id\":\"n-caffeine\",\"term\":\"커피 · 술 · 조심하라는 음식\",\"also\":\"카페인 · 회 · 익히지 않은 음식 · 건강식품\",\"whenTalked\":\"초기부터 계속 이야기돼요.\",\"what\":\"한 잔 마시고 나서 하루 종일 신경 쓰이셨을 거예요. 임신 중에는 하루에 들어오는 카페인의 총량, 익히지 않은 음식, 술, 성분을 알기 어려운 건강식품 같은 것을 두고 이야기가 나와요. 술은 \\\"이만큼은 된다\\\"고 정해 둘 수 있는 양이 없다는 쪽으로 이야기하고, 카페인은 커피만이 아니라 차와 초콜릿, 일부 음료에도 들어 있어 합쳐서 봐요.\",\"howChecked\":\"생활에서 실제로 무엇을 얼마나 먹는지를 진료에서 이야기하고 조정해요. 한약이나 건강식품은 성분을 알아야 이야기할 수 있어, 먹고 있는 것의 이름과 성분표를 가져가면 좋아요.\",\"notAtHome\":\"이미 먹은 것을 두고 집에서 셈해 봐야 답이 나오지 않아요. \\\"한 잔 마셨는데 큰일 났나\\\"를 검색으로 재지 말고 다음 진료 때 사실대로 말하세요. 숨기면 봐 줄 수 있는 사람이 못 보게 돼요.\",\"ask\":[\"제가 마시는 이 정도의 커피는 어떻게 보시나요?\",\"먹지 않는 편이 나은 음식이 따로 있나요?\",\"이 건강식품의 성분표를 가져왔는데 봐 주시겠어요?\",\"임신인 줄 모르던 때에 마신 술은 어떻게 보시나요?\"]},{\"id\":\"n-imaging-dental\",\"term\":\"엑스레이 · 치과 진료\",\"also\":\"방사선 · CT · 스케일링 · 국소마취\",\"whenTalked\":\"임신인 줄 모르고 찍은 뒤에 많이 이야기되고, 잇몸이 붓는 중기에 다시 이야기돼요.\",\"what\":\"검사에서 쓰는 방사선의 양은 검사 종류와 부위마다 크게 달라요. 치과 촬영처럼 부위가 좁고 배에서 먼 검사와, 배를 직접 찍는 검사는 같은 이야기가 아니에요. 치과는 임신 중이라고 미루기만 하는 곳도 아니에요 — 임신 중에는 잇몸이 잘 붓고 피가 나는 일이 흔해, 오히려 시기를 잡아 다녀오라는 말을 듣기도 해요.\",\"howChecked\":\"어떤 검사를 어느 부위에 몇 번 했는지를 가지고 봐요. 치과에서는 임신 중이라고 먼저 말하면 촬영 방법과 마취, 약 처방을 그에 맞춰 정해요.\",\"notAtHome\":\"내가 얼마나 받았는지는 집에서 알 수 없고, 검사 이름만으로 스스로 셈할 수도 없어요. 이미 찍은 것을 검색하며 최악을 읽는 대신, 검사 이름과 날짜를 적어 가서 물어보세요.\",\"ask\":[\"임신인 줄 모르고 이 검사를 받았는데 어떻게 보시나요?\",\"치과에 가려는데 지금 시기에 받아도 되나요?\",\"치과에 뭐라고 말하고 가면 되나요?\",\"앞으로 꼭 찍어야 할 검사가 생기면 어떻게 하나요?\"]},{\"id\":\"n-nt\",\"term\":\"목덜미 투명대(NT)\",\"also\":\"엔티 · 1차 기형아 검사\",\"whenTalked\":\"초기에서 중기로 넘어가는 무렵의 정해진 시기에만 볼 수 있어요.\",\"what\":\"초음파로 아이 목덜미의 두께를 재는 거예요. 이 값 하나로 무엇이 정해지는 것이 아니라, 피검사와 나이, 이후의 검사와 함께 놓고 \\\"더 볼지\\\"를 이야기하는 재료예요. 잴 수 있는 시기가 정해져 있어 그 주에 맞춰 예약을 잡아요.\",\"howChecked\":\"정해진 시기에 초음파로 재고, 대개 같은 시기의 피검사와 묶어서 봐요. 결과를 어떻게 읽는지와 다음에 무엇을 할지는 담당 의료진이 말해 줘요.\",\"notAtHome\":\"초음파 사진에 적힌 값을 인터넷의 기준과 견주지 마세요. 재는 자세와 시기에 따라 달라지고, 그 값을 어떻게 읽을지는 다른 결과와 함께 보아야 정해져요. 사진만 들고 집에서 정할 수 있는 것이 아니에요.\",\"ask\":[\"오늘 잰 것을 어떻게 보고 계신가요?\",\"이 결과에 따라 다음에 어떤 검사를 이야기하게 되나요?\",\"다음 검사는 언제까지 정해야 하나요?\",\"결과를 기다리는 동안 제가 알아 둘 것이 있나요?\"]},{\"id\":\"n-screening\",\"term\":\"기형아 검사 · 니프티\",\"also\":\"통합검사 · 쿼드검사 · NIPT · 선별검사\",\"whenTalked\":\"초기와 중기의 정해진 시기에 안내받아요.\",\"what\":\"결과를 기다리는 며칠이 제일 길어요. 여기서 말하는 검사들은 가려내는 검사(선별)이지 확정하는 검사가 아니에요. 결과는 \\\"있다 / 없다\\\"가 아니라 \\\"가능성이 어느 쪽으로 보인다\\\"로 나와요. 그래서 높게 나와도 그것으로 정해지는 것이 아니고, 낮게 나와도 모든 것을 본 것이 아니에요. 어떤 검사를 받을지는 선택이며, 보는 항목과 시기, 비용이 검사마다 달라요.\",\"howChecked\":\"피를 뽑아서 봐요. 검사 종류에 따라 보는 항목과 시기가 다르고, 결과에 따라 확정을 위한 다른 검사를 이야기하게 돼요. 무엇을 받을지는 담당 의료진과 상의해 정해요.\",\"notAtHome\":\"결과지의 숫자를 인터넷의 사례와 견주지 마세요. 같은 값이라도 검사 종류와 나이에 따라 다르게 읽혀요. 그리고 이 검사들은 앞으로 아이가 어떻게 자랄지를 말해 주지 않아요.\",\"ask\":[\"제 경우에 어떤 검사를 권하시나요? 이유도 알려주세요.\",\"이 검사는 무엇을 보고 무엇을 보지 않나요?\",\"결과가 높게 나오면 다음에 무엇을 하게 되나요?\",\"언제까지 정해야 하나요? 비용은 어떻게 되나요?\"]},{\"id\":\"n-invasive-test\",\"term\":\"양수검사 · 융모막검사\",\"also\":\"침습 검사 · 확진 검사\",\"whenTalked\":\"선별 검사에서 더 볼 것이 있다고 안내받았을 때 이야기돼요.\",\"what\":\"바늘로 양수나 태반의 일부를 얻어 아이의 염색체를 직접 보는 검사예요. 앞서 하는 선별 검사가 '가능성'을 보는 것이라면 이쪽은 '확인'에 가까워요. 대신 바늘을 쓰기 때문에 따르는 위험이 있어, 받을지 말지가 선택으로 남아요.\",\"howChecked\":\"초음파를 보면서 시행하고, 결과가 나오기까지 시간이 걸려요. 언제 어느 검사를 할 수 있는지는 주차에 따라 다르며 담당 의료진이 정해요.\",\"notAtHome\":\"선별 검사 결과를 인터넷의 사례와 견주어 받을지 말지 정하지 마세요. 같은 숫자라도 나이와 조건에 따라 의미가 달라지고, 그 설명은 진료실에서 들어야 해요.\",\"ask\":[\"이 검사로 알 수 있는 것과 알 수 없는 것은 무엇인가요?\",\"따르는 위험은 어느 정도로 보시나요?\",\"결과는 언제 어떻게 나오나요?\",\"받지 않기로 하면 다음에 무엇을 하게 되나요?\"]},{\"id\":\"n-anomaly-scan\",\"term\":\"정밀초음파\",\"also\":\"2차 기형아 초음파 · 입체초음파\",\"whenTalked\":\"중기의 정해진 시기에 예약해서 봐요.\",\"what\":\"아이의 몸을 부위별로 순서를 정해 시간을 들여 보는 초음파예요. 심장, 뇌, 척추, 콩팥, 팔다리 같은 곳을 차례로 봐요. 다만 초음파로 볼 수 있는 것에는 한계가 있어 이 검사를 했다고 모든 것을 본 것은 아니에요. 아이의 자세나 양수 때문에 못 보고 넘어가는 부위가 생기면 다시 오라고 해요.\",\"howChecked\":\"정해진 시기에 시간을 길게 잡아 초음파로 봐요. 다 못 본 부위가 있으면 날을 다시 잡아요. 보이는 것에 대한 판단은 담당 의료진이 해요.\",\"notAtHome\":\"받아 온 사진으로는 무엇을 보고 무엇을 못 봤는지 알 수 없어요. 사진에 적힌 영어 약자를 검색해 뜻을 맞춰 보는 일이 흔한데, 그것은 재는 항목의 이름일 뿐 결과가 아니에요.\",\"ask\":[\"오늘 다 본 부위와 아직 못 본 부위가 있나요?\",\"다시 봐야 하는 것이 있나요? 언제 오면 되나요?\",\"이 검사로는 알 수 없는 것이 무엇인가요?\",\"결과는 언제 어떻게 알려 주시나요?\"]},{\"id\":\"n-soft-marker\",\"term\":\"초음파에서 뭔가 보인다고 들었다\",\"also\":\"소프트마커 · 경계 소견 · 추적 관찰\",\"whenTalked\":\"정밀초음파를 비롯한 중기·후기 초음파에서 이야기돼요.\",\"what\":\"뭔가 보인다는 말만 듣고 나오면 그날 하루가 통째로 흔들리죠. 초음파를 보다 보면 \\\"지금 당장 무엇이라 말하기는 어렵지만 눈에 띄는 것\\\"이 나올 때가 있어요. 콩팥이 조금 늘어나 보인다거나 심장에 밝은 점이 보인다는 말이 그래요. 이런 말의 상당수는 시간이 지나며 달라지고, 그래서 \\\"다시 보자\\\"로 이어져요. 이름이 붙었다고 해서 무엇이 정해진 것은 아니에요.\",\"howChecked\":\"시기를 두고 다시 초음파로 봐요. 다른 검사 결과와 함께 놓고 보며, 필요하면 다른 과에 같이 봐 달라고 해요.\",\"notAtHome\":\"들은 말을 그대로 검색하면 가장 드물고 무거운 경우부터 나와요. 그 글들은 지금 이 아이의 초음파를 보고 쓴 것이 아니에요. 다시 볼 때까지 집에서 할 수 있는 확인은 없어요.\",\"ask\":[\"오늘 보신 것을 지금은 어느 정도로 보고 계신가요?\",\"언제 다시 보나요? 그 사이에 제가 할 일이 있나요?\",\"이것과 함께 볼 다른 검사가 있나요?\",\"다른 곳에서 한 번 더 보는 것이 도움이 될까요?\"]},{\"id\":\"n-antibody\",\"term\":\"항체가 없다\",\"also\":\"풍진 항체 · 감염 검사\",\"whenTalked\":\"초기 피 검사에서 여러 항목을 한 번에 봐요.\",\"what\":\"예전에 앓았거나 접종을 해서 몸이 기억하고 있는지를 보는 검사예요. 항체가 없다는 말은 지금 무슨 일이 생겼다는 뜻이 아니라 '기억이 없어 조심할 것이 있다'는 뜻으로 쓰여요. 항목에 따라 임신 중에는 접종하지 않고 출산 뒤로 미루는 것이 있어요.\",\"howChecked\":\"초기 피 검사로 봐요. 항목마다 그 뒤에 무엇을 할지가 다르고, 그 판단은 담당 의료진이 해요.\",\"notAtHome\":\"몸의 느낌으로는 알 수 없어요. 어릴 때 접종했는지 기억나지 않아도 검사로 보므로, 기억을 더듬어 스스로 결론 내리지 마세요.\",\"ask\":[\"어떤 항목에서 항체가 없다고 나왔나요?\",\"그러면 임신 중에 제가 조심할 것이 무엇인가요?\",\"접종은 언제 하게 되나요?\",\"가족 중에 같이 확인할 사람이 있나요?\"]},{\"id\":\"n-rh\",\"term\":\"혈액형이 Rh 음성\",\"also\":\"Rh 부적합 · 항체 주사\",\"whenTalked\":\"초기 혈액형 검사에서 알게 돼요.\",\"what\":\"혈액형에는 ABO 말고 Rh라는 구분이 함께 있어요. 임신한 사람이 Rh 음성이고 아이가 양성인 경우, 몸이 아이의 피를 낯설게 여겨 항체를 만들 수 있어요. 이 항체는 이번 임신보다 다음 임신에서 문제가 되는 경우가 많아, 미리 다루는 것이 이 이야기의 핵심이에요.\",\"howChecked\":\"초기 혈액형 검사와 항체 검사로 봐요. 정해진 시기에 맞는 주사와, 출산 뒤 아이의 혈액형을 확인한 다음의 절차가 함께 안내돼요.\",\"notAtHome\":\"몸으로 느껴지는 것이 전혀 없어요. 이전 임신이나 출혈이 있었던 일이 관련될 수 있으므로, 기억나는 것은 숨기지 말고 그대로 말하는 것이 중요해요.\",\"ask\":[\"제 항체 검사 결과는 어떤가요?\",\"주사는 언제 맞게 되나요?\",\"출혈이나 넘어지는 일이 있으면 어떻게 해야 하나요?\",\"출산 뒤에 추가로 하는 것이 있나요?\"],\"callNow\":\"출혈이 있거나 배를 부딪히는 일이 있으면 바로 연락하세요 — 시기에 관계없이 확인이 필요한 경우가 있어요.\"},{\"id\":\"n-thyroid\",\"term\":\"갑상선 수치\",\"also\":\"갑상선 기능 검사\",\"whenTalked\":\"초기 피 검사에서 함께 보거나, 이전에 갑상선 이야기를 들은 적이 있으면 더 자주 봐요.\",\"what\":\"임신을 하면 갑상선이 하는 일의 양이 달라져 수치가 전과 다르게 나와요. 그래서 임신 중에는 따로 잡은 기준으로 보고, 시기에 따라서도 다르게 봐요. 이전에 약을 먹고 있었다면 임신 중에 조정이 필요한 경우가 있어요.\",\"howChecked\":\"피 검사로 봐요. 한 번 본 뒤 시기를 두고 다시 보는 경우가 많으며, 어떻게 볼지는 담당 의료진이 정해요.\",\"notAtHome\":\"피곤하거나 추위를 타거나 가슴이 두근거리는 것은 임신 중에 흔한 일이라 그것으로 가려낼 수 없어요. 이전 검사지의 수치를 임신 중의 결과와 그대로 견주지 마세요 — 기준이 달라져 있어요.\",\"ask\":[\"제 결과를 지금 어떻게 보고 계신가요?\",\"다음에 언제 다시 보나요?\",\"먹던 약이 있다면 그대로 먹으면 되나요?\",\"요오드가 든 것을 먹는 데 주의할 것이 있나요?\"]},{\"id\":\"n-anemia\",\"term\":\"빈혈\",\"also\":\"철분 수치\",\"whenTalked\":\"초기와 후기 피 검사에서 함께 봐요.\",\"what\":\"임신을 하면 몸속의 피가 늘어나는데 그 늘어나는 방식 때문에 수치가 낮게 나오는 일이 흔해요. 그래서 임신 중의 기준은 임신 전과 따로 보고, 어느 정도부터 어떻게 할지는 담당 의료진이 정해요.\",\"howChecked\":\"피 검사로 봐요. 철분제를 언제부터 어떻게 먹을지도 그 결과를 보고 정해요.\",\"notAtHome\":\"어지럽거나 쉽게 지치는 것은 임신 중에 흔한 일이라 그것으로 가려낼 수 없어요. 철분제를 스스로 판단해 늘리거나 끊지 마세요 — 다른 것과 함께 먹을 때 흡수가 달라지는 것이 있어 담당 의료진에게 확인해야 해요.\",\"ask\":[\"제 결과를 어떻게 보고 계신가요?\",\"철분제는 언제 어떻게 먹으면 되나요?\",\"같이 먹으면 안 되는 것이 있나요?\",\"속이 불편하면 어떻게 하나요?\"]},{\"id\":\"n-gdm\",\"term\":\"임신성 당뇨\",\"also\":\"임당 · 당부하검사\",\"whenTalked\":\"대개 중기에서 후기로 넘어갈 무렵 검사를 안내받아요.\",\"what\":\"임신 중에 혈당이 조절되는 방식이 달라지는 것을 가리키는 말이에요. 임신하면 태반에서 나오는 호르몬 때문에 인슐린이 평소만큼 듣지 않게 되는데, 그 정도가 사람마다 달라요. 임신 전의 식습관 때문이라고 단정할 수 없는 영역이에요.\",\"howChecked\":\"정해진 시기에 당부하검사를 해요. 마시는 액체를 먹고 시간을 두고 피를 뽑는 방식이며, 판단 기준과 다음 절차는 담당 의료진이 정해요.\",\"notAtHome\":\"몸의 느낌으로는 알 수 없어요. 목이 마르거나 피곤한 것은 임신 중에 흔한 일이라 그것으로 가려낼 수 없어요. 집에서 잰 값을 인터넷의 기준과 견주지 마세요 — 임신 중의 기준은 따로 있고, 그것을 보는 사람은 담당 의료진이에요.\",\"ask\":[\"검사는 언제 받나요? 그날 준비할 것이 있나요?\",\"결과는 어떻게 알려 주시나요?\",\"결과에 따라 다음에 무엇을 하게 되나요?\",\"지금 식사에서 바꿔야 할 것이 있나요?\"]},{\"id\":\"n-gbs\",\"term\":\"GBS 검사\",\"also\":\"B군 연쇄상구균 · 분비물 배양검사\",\"whenTalked\":\"후기의 정해진 시기에 안내받아요.\",\"what\":\"출산 때 아이에게 옮겨갈 수 있는 균이 몸에 있는지를 미리 보는 검사예요. 이 균은 있어도 본인은 아무 느낌이 없는 경우가 대부분이라 증상으로 아는 것이 아니라 검사로 봐요. 있다고 나오는 것은 위생과 상관이 없으며, 출산 때 어떻게 할지를 미리 정해 두려고 보는 거예요.\",\"howChecked\":\"면봉으로 분비물을 묻혀 배양해요. 결과가 나오기까지 며칠 걸리고, 결과는 출산 계획에 함께 기록해 둬요.\",\"notAtHome\":\"느낌으로는 알 수 없고, 씻는 것으로 달라지는 문제도 아니에요. 검사 전에 씻는 방식을 바꾸면 결과가 달라질 수 있어 안내받은 대로만 하세요.\",\"ask\":[\"검사 전에 준비하거나 피할 것이 있나요?\",\"있다고 나오면 출산 때 어떻게 하게 되나요?\",\"결과는 어디에 기록되나요? 다른 병원에서 낳게 되면 어떻게 알리나요?\",\"진통이 먼저 오면 어떻게 하나요?\"]},{\"id\":\"n-previa\",\"term\":\"전치태반\",\"also\":\"태반이 낮다 · 하방 태반\",\"whenTalked\":\"중기 초음파에서 처음 이야기되는 경우가 많고, 후기에 다시 확인해요.\",\"what\":\"태반이 자궁 입구 쪽에 낮게 자리 잡은 상태를 가리키는 말이에요. 얼마나 가까운지, 입구를 덮고 있는지에 따라 부르는 이름이 나뉘어요. 태반이 어디에 자리를 잡는지는 임신 초기에 정해지고 본인이 한 일과는 관계가 없어요.\",\"howChecked\":\"초음파로 봐요. 중기에 낮게 보이던 태반이 자궁이 커지면서 위쪽으로 멀어져 후기에는 다르게 보이는 경우가 흔해, 한 번 들었다고 끝나는 이야기가 아니라 다시 확인해요.\",\"notAtHome\":\"태반의 위치는 배를 만져 보거나 몸의 느낌으로는 알 수 없어요. 초음파로만 보여요. 아프지 않아도 그 자리에 있을 수 있고, 반대로 배가 뭉친다고 해서 이것 때문이라고 할 수도 없어요.\",\"ask\":[\"지금은 어느 정도로 보고 계신가요?\",\"언제 다시 확인하나요?\",\"그때까지 피해야 할 활동이 있나요?\",\"출혈이 있으면 어디로 연락하면 되나요? 야간에는요?\"],\"callNow\":\"아프지 않더라도 출혈이 있으면 기다리지 말고 바로 연락하세요.\"},{\"id\":\"n-placenta-grade\",\"term\":\"태반이 늙었다 · 석회화\",\"also\":\"태반 성숙도 · 태반 등급\",\"whenTalked\":\"후기 초음파에서 이야기돼요.\",\"what\":\"초음파에서 태반이 보이는 모양을 단계로 나누어 부르는 말이에요. \\\"늙었다\\\"는 표현 때문에 놀라기 쉽지만, 이 단계는 임신이 진행되면서 달라지는 것이기도 해요. 단계 그 자체보다 아이가 자라는 흐름과 양수, 태동을 함께 놓고 보는 것이 보통이에요.\",\"howChecked\":\"초음파로 봐요. 아이의 성장 흐름과 양수를 같이 보고, 더 자주 볼지는 담당 의료진이 정해요.\",\"notAtHome\":\"초음파 사진에 적힌 단계를 인터넷의 주수별 표와 견주지 마세요. 보는 사람과 기계에 따라서도 달라지는 것이라 그것 하나로 무엇을 정하지 않아요.\",\"ask\":[\"지금 보이는 것을 어떻게 보고 계신가요?\",\"아이가 자라는 흐름은 어떤가요?\",\"앞으로 얼마나 자주 확인하나요?\",\"제가 눈여겨봐야 할 신호가 있나요?\"]},{\"id\":\"n-abruption\",\"term\":\"태반조기박리\",\"also\":\"태반이 떨어진다\",\"whenTalked\":\"흔하지는 않지만 응급으로 다뤄지는 상황이라 이름을 알아 두시면 좋아요.\",\"point\":\"미리 알아차릴 방법이 마땅치 않고 갑자기 생겨요.\",\"what\":\"아이가 나오기 전에 태반이 자궁벽에서 떨어지기 시작하는 상황을 가리키는 말이에요. 그래서 이 항목은 무엇을 조심하라는 이야기가 아니라, 어떤 신호일 때 망설이지 말라는 이야기예요.\",\"howChecked\":\"병원에서 초음파와 진통 여부, 상태를 함께 보고 판단해요. 시간이 중요한 상황이라 스스로 확인하려 하지 않고 바로 가는 것이 맞아요.\",\"notAtHome\":\"집에서 확인할 방법이 없어요. 출혈이 겉으로 보이지 않는 경우도 있어, 피가 안 보인다고 해서 아닌 것으로 두면 안 돼요.\",\"ask\":[\"제 경우에 특별히 살펴야 할 것이 있나요?\",\"야간·주말에 갈 수 있는 곳은 어디인가요?\",\"가는 길에 준비해야 할 것이 있나요?\"],\"callNow\":\"배가 갑자기 심하게 아프거나 단단하게 굳어 풀리지 않을 때, 출혈이 있을 때, 태동이 평소와 뚜렷하게 다를 때 — 기다리지 말고 바로 응급실로 연락하세요.\"},{\"id\":\"n-amniotic\",\"term\":\"양수가 많다 / 적다\",\"also\":\"양수과다 · 양수과소\",\"whenTalked\":\"중기 이후 초음파를 볼 때마다 함께 봐요.\",\"what\":\"아이를 둘러싼 물의 양에 대한 이야기예요. 양수는 아이가 움직일 자리를 만들고 온도를 유지하며 폐가 자라는 데 쓰여요. 임신이 진행되면서 늘었다가 막바지에 줄어드는 흐름이 있어, 어느 시점에 본 값인지가 함께 이야기돼요.\",\"howChecked\":\"초음파로 봐요. 한 번의 값보다 여러 번 본 흐름을 함께 보고, 아이의 크기나 움직임 같은 다른 것과 같이 놓고 판단해요. 그 판단은 담당 의료진이 해요.\",\"notAtHome\":\"배 둘레나 몸무게로는 알 수 없어요. 물이 새는 느낌이 있어도 그것이 양수인지 아닌지는 스스로 가려낼 수 없어요 — 그 판별은 병원에서 해요.\",\"ask\":[\"지금 어느 쪽으로 보고 계신가요?\",\"다음에 언제 다시 보나요?\",\"그 사이에 제가 살펴야 할 것이 있나요?\",\"물이 새는 느낌이 들면 어떻게 하면 되나요?\"],\"callNow\":\"맑은 물 같은 것이 흐르거나 속옷이 젖는 일이 있으면 바로 연락하세요.\"},{\"id\":\"n-growth\",\"term\":\"아이가 작다 / 크다\",\"also\":\"태아 성장 · 추정 체중\",\"whenTalked\":\"중기 이후 초음파를 볼 때마다 나오는 이야기예요.\",\"point\":\"어림값이고 오차가 있어요.\",\"what\":\"초음파로 잰 머리·배·다리뼈의 크기로 아이의 무게를 어림잡은 값에 대한 이야기예요. 한 번의 값보다 여러 번 잰 것이 어떤 흐름으로 가는지를 함께 봐요.\",\"howChecked\":\"초음파로 재고, 이전에 잰 것과 나란히 놓고 봐요. 그 흐름을 어떻게 볼지는 담당 의료진이 정해요.\",\"notAtHome\":\"배가 부른 정도나 본인의 몸무게 변화로는 알 수 없어요. 초음파 추정치를 인터넷의 표와 견주는 것은 오차 때문에 어긋나기 쉬워요 — 그 값을 보는 사람은 담당 의료진이에요.\",\"ask\":[\"지금 흐름을 어떻게 보고 계신가요?\",\"다음에 언제 다시 재나요?\",\"제가 먹는 것으로 달라지는 부분이 있나요?\",\"이 값의 오차는 어느 정도로 보면 되나요?\"]},{\"id\":\"n-cord\",\"term\":\"탯줄이 목에 감겼다\",\"also\":\"제대 · 목감김\",\"whenTalked\":\"후기 초음파에서 이야기되는 경우가 많아요.\",\"what\":\"초음파에서 탯줄이 아이 목 주변을 지나는 것으로 보일 때 하는 말이에요. 아이는 계속 움직이기 때문에 어느 날 보인 것이 다음에는 안 보이기도 하고 그 반대이기도 해요. 이 말을 들었다고 분만 방법이 그 자리에서 정해지는 것은 아니에요.\",\"howChecked\":\"초음파로 보고 후기에 다시 확인해요. 분만 방법과 관련된 이야기는 아이의 자세와 상태, 태동을 함께 놓고 담당 의료진이 해요.\",\"notAtHome\":\"태동이 세거나 약한 것으로 탯줄의 상태를 알 수는 없어요. 인터넷에는 \\\"목감김이면 이렇게 하라\\\"는 자세가 돌아다니지만, 그것으로 탯줄의 위치가 달라진다는 이야기가 아니에요.\",\"ask\":[\"지금은 어떻게 보이나요? 다시 확인하는 시기는 언제인가요?\",\"이것 때문에 분만 방법이 달라지나요?\",\"제가 조심할 것이 있나요?\",\"태동이 평소와 다르면 어떻게 하나요?\"]},{\"id\":\"n-breech\",\"term\":\"역아\",\"also\":\"둔위 · 거꾸로 있다\",\"whenTalked\":\"후기 초음파에서 이야기돼요.\",\"what\":\"아이가 머리를 아래로 두지 않고 엉덩이나 발을 아래로 두고 있는 자세를 가리키는 말이에요. 임신 중기까지는 아이가 자주 자세를 바꾸기 때문에 그때 들은 말과 후기의 자세는 다른 경우가 많아요.\",\"howChecked\":\"초음파로 봐요. 후기에 다시 확인하고, 자세에 따라 분만 방법에 대한 이야기가 함께 나와요. 그 판단은 담당 의료진이 해요.\",\"notAtHome\":\"발로 차는 위치로 짐작하는 이야기가 많지만 그것으로 자세를 알 수는 없어요. 인터넷에 도는 자세 바꾸기 동작은 상황에 따라 권하지 않는 경우가 있어, 하기 전에 담당 의료진에게 물어보세요.\",\"ask\":[\"지금 자세를 어떻게 보고 계신가요?\",\"언제 다시 확인하나요?\",\"제가 해볼 만한 것이 있나요? 하면 안 되는 것은요?\",\"이 자세면 분만 방법은 어떻게 이야기되나요?\"]},{\"id\":\"n-twins\",\"term\":\"쌍둥이\",\"also\":\"다태임신 · 이란성 · 일란성\",\"whenTalked\":\"초기 초음파에서 알게 되는 경우가 많아요.\",\"what\":\"아이가 둘 이상인 임신을 가리켜요. 태반과 양막을 따로 쓰는지 나눠 쓰는지에 따라 부르는 이름이 나뉘고, 그 구분에 따라 검진 간격과 보는 항목이 달라져요. 한 명일 때와 같은 일정으로 가지 않는 것은 그래서예요.\",\"howChecked\":\"초음파로 확인하며, 태반과 막을 어떻게 쓰고 있는지는 이른 시기에 더 잘 보여요. 검진 간격과 분만 시기에 대한 계획은 담당 의료진이 정해요.\",\"notAtHome\":\"배가 부른 정도나 입덧의 세기로는 알 수 없어요. 어느 유형인지도 초음파로만 구분되며, 집에서 짐작할 수 있는 것이 아니에요.\",\"ask\":[\"태반과 막은 어떻게 쓰고 있다고 보시나요?\",\"검진 간격이 어떻게 되나요?\",\"제가 줄이거나 조심할 활동이 있나요?\",\"분만 시기와 방법은 언제쯤 이야기하게 되나요?\"],\"callNow\":\"배가 규칙적으로 아프거나 뭉치는 것, 출혈, 물 같은 것이 흐르는 것이 있으면 바로 연락하세요.\"},{\"id\":\"n-movement\",\"term\":\"태동이 줄었다\",\"also\":\"아이 움직임 · 태동검사\",\"whenTalked\":\"중기 이후 계속 이야기되고, 후기에는 진료 때마다 물어봐요.\",\"point\":\"평소와 다르게 줄었다고 느껴지는 것은 미루면 안 되는 신호예요.\",\"what\":\"아이의 움직임을 말해요. 아이마다 움직이는 방식과 시간대가 달라 남과 견줄 수 있는 것이 아니고, 대신 \\\"평소의 이 아이\\\"와 견주라고 이야기해요. 많은 사람이 기분 탓인가 싶어 하루를 넘기는데, 그 하루를 넘기지 않는 것이 이 항목에서 가장 중요한 이야기예요.\",\"howChecked\":\"병원에서 아이의 심장 소리와 움직임을 함께 기록해 봐요. 초음파로 양수와 움직임을 같이 보기도 해요. 무엇을 언제 볼지는 담당 의료진이 정해요.\",\"notAtHome\":\"집에서 세는 방법을 안내받았다면 그대로 하되, 그 숫자로 지금 상태를 가려낼 수는 없어요. 인터넷의 기준과 견주며 \\\"아직 괜찮은 편\\\"이라고 스스로 정리하지 마세요. 단 것을 먹거나 찬 것을 마시고 다시 세어 보라는 이야기가 도는데, 그렇게 시간을 보내는 것이 늦어지는 가장 흔한 이유예요.\",\"ask\":[\"제 아이의 평소 태동을 어떻게 기록해 두면 될까요?\",\"줄었다고 느껴지면 몇 시에든 연락해도 되나요? 어디로 하나요?\",\"밤이나 주말에는 어디로 가야 하나요?\",\"확인하러 가면 무엇을 하게 되나요?\"],\"callNow\":\"평소와 달리 태동이 줄었거나 느껴지지 않으면 시간을 두고 지켜보지 말고 지금 연락하세요. 밤이든 주말이든 마찬가지예요. 가서 확인하고 아무 일 아니어도 그것이 맞는 순서예요.\"},{\"id\":\"n-fibroid\",\"term\":\"자궁근종\",\"also\":\"혹이 있다 · 근종\",\"whenTalked\":\"초음파에서 우연히 보이는 경우가 많고, 임신 전부터 알고 있던 경우도 있어요.\",\"what\":\"자궁의 근육층에 생기는 덩어리를 가리키는 말이에요. 임신 전에도 흔하고, 임신 중에는 호르몬 변화로 크기가 달라지기도 해요. 어디에 얼마나 있는지와 태반이 어디에 자리 잡았는지에 따라 이야기가 크게 달라져요.\",\"howChecked\":\"초음파로 위치와 크기를 보고, 임신이 진행되는 동안 어떻게 달라지는지를 함께 봐요. 분만 방법에 영향을 주는지도 그 자리에서 이야기돼요.\",\"notAtHome\":\"만져서 알 수 있는 것이 아니고, 배가 아프다고 해서 이것 때문이라고 할 수도 없어요. 인터넷에서 다른 사람의 경우와 견주는 것은 위치와 크기가 저마다 달라 맞지 않아요.\",\"ask\":[\"위치가 어디쯤이고, 지금 어떻게 보고 계신가요?\",\"임신이 진행되면서 어떻게 달라질 수 있나요?\",\"분만 방법에 영향을 주나요?\",\"배가 아플 때 어느 정도면 연락해야 하나요?\"]},{\"id\":\"n-preeclampsia\",\"term\":\"임신중독증\",\"also\":\"전자간증 · 임신성 고혈압\",\"whenTalked\":\"중기 이후 매 검진에서 혈압과 소변을 보는 이유가 여기에 있어요.\",\"what\":\"임신 중에 혈압이 오르고 다른 장기에도 영향이 나타나는 상태를 가리키는 말이에요. 임신 중 검진에서 매번 혈압을 재고 소변을 받는 것은 이것을 일찍 알아차리기 위해서예요. 이름 때문에 '중독'과 관련 있다고 오해하기 쉽지만 그런 뜻이 아니에요.\",\"howChecked\":\"검진 때 혈압을 재고 소변 검사를 하며, 필요하면 피 검사를 함께 봐요. 여러 번 잰 것을 놓고 보기 때문에 검진을 거르지 않는 것이 이 이야기에서 가장 큰 부분이에요.\",\"notAtHome\":\"집에서 잰 혈압 한 번으로는 알 수 없어요. 붓는 것은 임신 중에 흔해서 그것만으로 가려낼 수 없고, 반대로 붓지 않아도 있을 수 있어요.\",\"ask\":[\"제 혈압은 지금 어떻게 보고 계신가요?\",\"집에서 혈압을 재는 것이 도움이 될까요? 잰다면 언제 재나요?\",\"다음 검진은 언제인가요?\",\"어떤 증상이 있으면 바로 연락해야 하나요?\"],\"callNow\":\"심한 두통, 눈이 흐려지거나 번쩍이는 느낌, 손발과 얼굴이 갑자기 붓는 것, 명치나 오른쪽 윗배가 아픈 것 — 이 중 하나라도 있으면 바로 연락하세요.\"},{\"id\":\"n-cervical-insufficiency\",\"term\":\"자궁경부무력증\",\"also\":\"자궁 입구가 약하다 · 자궁경부 봉합\",\"whenTalked\":\"이전 임신에서 겪은 일이 있으면 초기부터, 그렇지 않으면 중기 초음파에서 이야기돼요.\",\"point\":\"아프지 않게 진행되는 것이 이 이야기의 핵심이에요.\",\"what\":\"진통이나 아픔 없이 자궁 입구가 이른 시기에 열리는 경향을 가리키는 말이에요. 그래서 본인이 알아차리기 어렵고, 이전 임신에서 겪은 일이 있으면 이번에는 미리 보는 경우가 많아요. 이름에 '무력'이 들어가 본인의 잘못처럼 들리지만 그런 뜻이 아니에요.\",\"howChecked\":\"초음파로 자궁 입구를 봐요. 한 번 보고 끝나지 않고 시기를 두고 여러 번 보며, 이전 임신의 경과를 함께 놓고 판단해요. 실을 걸어 묶어 두는 방법을 쓸지, 다른 방법으로 갈지는 담당 의료진이 정해요.\",\"notAtHome\":\"아프지 않으므로 몸의 느낌으로는 알 수 없어요. 배가 안 아프니 아닌 것으로 두면 안 되고, 반대로 배가 뭉친다고 해서 이것 때문이라고 할 수도 없어요. 자궁 입구의 상태는 초음파로만 보여요.\",\"ask\":[\"이전 임신 경과를 보시고 지금 어떻게 판단하시나요?\",\"얼마나 자주 다시 확인하나요?\",\"지금 줄이거나 피해야 할 활동이 있나요?\",\"어떤 느낌이 있으면 기다리지 말고 연락해야 하나요?\"],\"callNow\":\"아래가 묵직하게 눌리는 느낌, 분비물이 갑자기 늘거나 달라진 것, 출혈, 물 같은 것이 흐르는 것 — 아프지 않더라도 바로 연락하세요.\"},{\"id\":\"n-preterm\",\"term\":\"조기진통\",\"also\":\"자궁경부가 짧다 · 조산 위험\",\"whenTalked\":\"중기 이후, 배가 자주 뭉친다고 이야기했을 때 함께 나와요.\",\"what\":\"아직 이른데 싶어서 겁이 나시죠. 예정일보다 이른 시기에 진통이 시작되거나, 자궁 입구가 미리 열릴 조짐이 보이는 상황을 가리키는 말이에요. 배가 뭉치는 것은 임신 중에 흔하지만, 규칙적으로 반복되는 것은 다르게 봐요.\",\"howChecked\":\"초음파로 자궁 입구를 보고, 필요하면 진통이 있는지 기계로 함께 봐요. 지금 어느 단계인지와 무엇을 할지는 담당 의료진이 정해요.\",\"notAtHome\":\"배가 뭉치는 것이 어떤 종류인지 스스로 가려낼 수 없어요. 자궁 입구의 상태는 몸의 느낌으로 알 수 없고 초음파로만 보여요.\",\"ask\":[\"제 배가 뭉치는 것을 어떻게 보고 계신가요?\",\"어떤 뭉침이면 연락해야 하나요?\",\"지금 줄여야 할 활동이 있나요?\",\"야간이나 주말에는 어디로 연락하나요?\"],\"callNow\":\"배가 규칙적으로 아프거나 뭉치는 것이 반복되면, 출혈이나 물 같은 것이 흐르면 바로 연락하세요.\"},{\"id\":\"n-pprom\",\"term\":\"조기양막파수\",\"also\":\"양수가 먼저 터졌다 · 조기 파수\",\"whenTalked\":\"진통이 시작되기 전에 양수가 새는 경우를 가리켜, 어느 시기에나 이야기될 수 있어요.\",\"what\":\"아이를 감싸고 있는 막이 진통이 시작되기 전에 터져 양수가 새는 것을 가리키는 말이에요. 몇 주차에 일어났는지에 따라 부르는 이름과 그다음에 하는 일이 크게 달라져요. 막이 터지면 바깥과 이어지는 길이 생기므로 시간이 중요한 상황으로 다뤄요.\",\"howChecked\":\"병원에서 확인해요. 새어 나온 것이 양수인지 가려내는 검사가 있고, 초음파로 남은 양과 아이의 상태를 함께 봐요. 기다릴지 분만으로 갈지는 주차와 상태를 보고 담당 의료진이 정해요.\",\"notAtHome\":\"소변인지 분비물인지 양수인지 스스로 가려낼 수 없어요. 색이나 냄새로 판단하지 마세요 — 그 판별은 병원에서 해요. 확인하겠다고 안에 무엇을 넣거나 목욕을 하지 말고, 그대로 연락하는 것이 맞아요.\",\"ask\":[\"물 같은 것이 흐르면 어디로 연락하나요? 야간에는요?\",\"갈 때 무엇을 하지 말아야 하나요?\",\"가는 데 시간이 걸리면 그동안 무엇을 하면 되나요?\",\"제 주차에서는 어떤 절차가 이어지나요?\"],\"callNow\":\"맑은 물 같은 것이 흐르거나 속옷이 젖는 일이 있으면 양이 적더라도 바로 연락하세요. 확인하려고 기다리지 마세요.\"},{\"id\":\"n-contractions\",\"term\":\"배가 뭉친다\",\"also\":\"가진통 · 브랙스톤힉스 · 자궁수축\",\"whenTalked\":\"중기 이후부터 계속 이야기돼요.\",\"what\":\"배가 단단해졌다 풀리는 느낌을 말해요. 임신 중에는 규칙 없이 오는 뭉침이 있고 이것을 가진통이라 부르기도 해요. 진통과 가진통을 가르는 이야기는 간격이 규칙적인지, 쉬면 잦아드는지, 점점 세지는지 같은 것으로 하지만, 집에서 딱 잘라 가르기는 어려워요. 특히 첫아이일 때 어려워요.\",\"howChecked\":\"병원에서 자궁수축을 기록해 보고, 자궁 입구의 상태를 함께 봐요. 주수에 따라 보는 것이 달라져요.\",\"notAtHome\":\"뭉치는 횟수를 세어 인터넷의 기준과 견주지 마세요. 같은 횟수라도 주수와 지금까지의 경과에 따라 다르게 봐요. 특히 이른 주수에서 규칙적으로 오는 뭉침은 \\\"가진통이겠지\\\"로 넘길 자리가 아니에요.\",\"ask\":[\"제 주수에서 어느 정도의 뭉침이면 연락해야 하나요?\",\"뭉칠 때 제가 해볼 것이 있나요?\",\"일하는 중에 자주 뭉치는데 어떻게 할까요?\",\"밤에 연락하려면 어디로 하나요?\"],\"callNow\":\"규칙적으로 반복되면서 점점 세지는 뭉침, 쉬어도 잦아들지 않는 뭉침, 뭉침과 함께 오는 출혈이나 물 같은 것이 흐르는 느낌, 아래가 눌리는 느낌이 있으면 바로 연락하세요.\"},{\"id\":\"n-internal-exam\",\"term\":\"내진 · 자궁문이 열렸다\",\"also\":\"자궁경부 개대 · 소실 · 골반 진찰\",\"whenTalked\":\"후기와 진통이 시작될 무렵에 이야기돼요.\",\"what\":\"자궁 입구가 얼마나 열리고 얇아졌는지, 아이 머리가 얼마나 내려왔는지를 손으로 보는 진찰이에요. \\\"몇 센티 열렸다\\\"는 말을 여기서 듣게 돼요. 이 값은 시간에 따라 달라지고, 한 번의 값보다 변해 가는 흐름을 봐요. 조금 열려 있다고 곧 낳는다는 뜻도, 아직 안 열렸다고 멀었다는 뜻도 아니에요.\",\"howChecked\":\"진찰로 봐요. 진통 중에는 시간 간격을 두고 다시 보며 진행을 확인해요.\",\"notAtHome\":\"집에서 스스로 확인하려고 하지 마세요. 안에 무엇을 넣어 보는 일은 하면 안 돼요. 들은 값을 인터넷의 표와 견주어 언제 낳을지 셈하는 것도 맞지 않아요.\",\"ask\":[\"오늘 보신 것을 어떻게 설명해 주시겠어요?\",\"다음에는 언제 다시 보나요?\",\"이 상태에서 제가 조심할 것이 있나요?\",\"어떤 느낌이 오면 병원으로 와야 하나요?\"]},{\"id\":\"n-labor-signs\",\"term\":\"이슬이 비쳤다\",\"also\":\"점액마개 · 혈성 이슬 · 진통 시작\",\"whenTalked\":\"후기와 출산이 가까울 무렵에 이야기돼요.\",\"what\":\"자궁 입구를 막고 있던 끈끈한 분비물이 빠져나오는 것을 이슬이라고 불러요. 피가 조금 섞여 분홍이나 갈색으로 보이기도 해요. 이것이 보였다고 곧바로 진통이 시작되는 것은 아니고 사람마다 며칠 차이가 나요. 반대로 이슬 없이 진통이 먼저 오기도 해요.\",\"howChecked\":\"언제 무엇이 어떻게 나왔는지를 이야기하면 그것과 진찰을 함께 놓고 봐요. 병원마다 언제 오라고 하는 기준이 달라 다니는 곳의 안내를 따르는 것이 맞아요.\",\"notAtHome\":\"나온 것이 이슬인지, 양수인지, 늘어난 분비물인지 색과 양으로 가려낼 수 없어요. 물처럼 흐르는 느낌이면 확인하겠다고 씻거나 안에 무엇을 넣지 말고 그대로 연락하세요.\",\"ask\":[\"언제 병원으로 오면 되나요? 우리 병원의 기준을 알려주세요.\",\"밤에는 어디로 연락하나요?\",\"진통 간격을 어떻게 재서 알려드리면 되나요?\",\"올 때 무엇을 챙겨 오면 되나요?\"],\"callNow\":\"붉은 피가 생리처럼 나올 때, 물 같은 것이 흐를 때, 아이의 움직임이 평소와 다를 때는 진통이 없어도 바로 연락하세요.\"},{\"id\":\"n-induction\",\"term\":\"유도분만\",\"also\":\"촉진 · 유도\",\"whenTalked\":\"예정일이 가까워지거나 지났을 때, 또는 먼저 낳는 것이 낫다고 의료진이 볼 때 이야기돼요.\",\"what\":\"진통이 저절로 오기를 기다리지 않고 시작되도록 돕는 방법을 통틀어 가리키는 말이에요. 방법이 여러 가지이고, 자궁 입구의 상태에 따라 무엇부터 하는지가 달라져요. 하루 안에 끝나지 않는 경우도 있어 일정을 넉넉히 잡으라고 안내받는 일이 많아요.\",\"howChecked\":\"지금까지의 경과와 자궁 입구의 상태, 아이의 상태를 함께 보고 담당 의료진이 정해요.\",\"notAtHome\":\"집에서 진통을 유도한다는 방법들이 많이 돌지만, 지금 내 상태에서 해도 되는지는 사람마다 달라요. 무엇이든 하기 전에 먼저 물어보세요.\",\"ask\":[\"왜 지금 하는 것이 낫다고 보시나요?\",\"어떤 방법으로 시작하나요?\",\"시간이 얼마나 걸릴 수 있나요?\",\"잘 진행되지 않으면 그다음은 어떻게 되나요?\"]},{\"id\":\"n-csection\",\"term\":\"제왕절개 이야기가 나왔다\",\"also\":\"수술 분만 · 브이백(VBAC)\",\"whenTalked\":\"후기에 아이의 자세와 태반 위치, 이전 출산 경험을 놓고 이야기돼요.\",\"what\":\"배를 열어 아이를 낳는 방법이에요. 미리 날을 잡는 경우도 있고 진통 중에 방법이 바뀌는 경우도 있어요. 이전에 제왕절개로 낳은 사람이 다음에 자연분만을 시도하는 것을 브이백이라고 부르는데, 가능한지는 이전 수술 방법과 지금 상태에 따라 다르고 병원마다 이야기가 달라요. 어느 쪽이 낫다고 잘라 말할 수 있는 것이 아니라, 각자의 상황에서 무엇을 우선할지 담당 의료진과 정하는 일이에요.\",\"howChecked\":\"아이 자세, 태반 위치, 자라는 흐름, 이전 출산 경험, 지금의 몸 상태를 함께 놓고 정해요. 진통 중에 상황이 달라지면 방법이 바뀔 수 있어요.\",\"notAtHome\":\"후기 초음파의 몸무게 어림으로 낳는 방법을 스스로 정할 수 없어요. 인터넷의 경험담은 그 사람의 상황에서 나온 이야기라 그대로 옮겨 올 수 없어요.\",\"ask\":[\"제 경우 지금 어떤 방법을 생각하고 계신가요? 이유도 알려주세요.\",\"브이백을 원하는데 우리 병원에서 가능한가요?\",\"수술을 하게 되면 회복은 어떻게 되나요? 다음 임신에는 어떤 이야기가 따라오나요?\",\"진통 중에 방법이 바뀌는 것은 어떤 경우인가요?\"]},{\"id\":\"n-epidural\",\"term\":\"무통분만\",\"also\":\"경막외마취 · 무통주사\",\"whenTalked\":\"후기 상담과 진통 중에 이야기돼요.\",\"what\":\"진통의 통증을 줄이기 위해 등에 가는 관을 넣어 약을 넣는 방법이에요. 넣는 시기, 가능한 상황, 병원 사정(마취과가 언제 있는지)에 따라 실제로 받을 수 있는지가 달라져요. 하기로 했다가 상황에 따라 못 하게 되는 경우도 있어 미리 물어 두시면 좋아요.\",\"howChecked\":\"피검사 결과와 몸 상태, 진행 정도를 보고 마취과와 함께 정해요. 미리 동의서를 쓰는 병원이 많아요.\",\"notAtHome\":\"얼마나 아플지, 나에게 잘 들을지는 미리 알 수 없어요. 인터넷의 후기는 사람과 병원이 모두 달라 그대로 옮겨 올 수 없어요.\",\"ask\":[\"우리 병원에서는 언제부터 넣을 수 있나요? 밤이나 주말에도 가능한가요?\",\"저에게 못 하게 되는 경우가 있나요?\",\"미리 해 둘 검사나 서류가 있나요?\",\"비용은 어떻게 되나요?\"]},{\"id\":\"n-itch\",\"term\":\"몸이 가렵다\",\"also\":\"임신 소양증 · 담즙정체\",\"whenTalked\":\"중기 이후, 특히 후기에 이야기돼요.\",\"what\":\"가려운 걸로 병원에 말해도 되나 싶으시죠. 배가 늘어나며 가려운 일은 임신 중에 흔해요. 다만 후기에 손바닥과 발바닥이 유난히 가렵고, 밤에 심해지고, 눈에 보이는 발진 없이 그러는 경우는 따로 보는 것이 있어요. 간에서 나오는 담즙이 잘 흐르지 않는 경우로, 이건 피검사로 봐요. \\\"가려운 게 뭐 대수인가\\\"로 넘기지 말고 진료 때 말씀해 주세요.\",\"howChecked\":\"가려운 자리와 시간대, 발진이 있는지를 보고 필요하면 피검사로 간 수치와 담즙산을 봐요. 이후 절차는 담당 의료진이 정해요.\",\"notAtHome\":\"보습제를 발라 나아지는지로 어떤 가려움인지 가려낼 수 없어요. 발진이 없다고 가벼운 것도 아니에요. 무엇 때문인지는 피검사로 보는 거예요.\",\"ask\":[\"손바닥과 발바닥이 밤에 가려운데 검사가 필요할까요?\",\"지금 시기에 발라도 되는 것이 있나요?\",\"검사한다면 결과는 언제 나오나요?\",\"가려움이 심해지면 언제 연락하나요?\"],\"callNow\":\"손바닥과 발바닥이 밤마다 심하게 가려울 때, 소변 색이 진해지거나 눈 흰자가 노랗게 보일 때, 가려움과 함께 아이의 움직임이 달라졌을 때는 다음 진료를 기다리지 말고 연락하세요.\"},{\"id\":\"n-edema\",\"term\":\"많이 부었다\",\"also\":\"부종 · 손발 저림 · 손목터널\",\"whenTalked\":\"후기에 많이 이야기돼요.\",\"what\":\"임신 중에는 몸에 물이 늘어 손발이 붓는 일이 흔해요. 손이 부으면서 저리거나 아침에 손가락이 뻣뻣한 것도 자주 듣는 이야기예요. 다만 붓기가 갑자기 심해지거나 얼굴과 눈 주위까지 붓는 것은 다른 이야기와 함께 봐야 해서, 임신중독증 항목과 이어져요.\",\"howChecked\":\"혈압과 소변검사를 함께 봐요. 붓기만 따로 보지 않고 다른 것과 같이 놓고 보는 것이 보통이에요.\",\"notAtHome\":\"붓기의 정도로 지금 어떤 상태인지 가려낼 수 없어요. 반지가 들어가는지로 재는 것도 아니에요. 혈압과 소변은 병원에서 봐요.\",\"ask\":[\"지금 붓기를 어떻게 보고 계신가요? 혈압은 어떤가요?\",\"손이 저려 밤에 깨는데 해볼 것이 있나요?\",\"붓기가 어떻게 달라지면 연락해야 하나요?\",\"오래 서 있는 일을 하는데 조정할 것이 있을까요?\"],\"callNow\":\"하루아침에 얼굴이나 눈 주위가 부을 때, 한쪽 종아리만 붓고 아프거나 붉어질 때, 붓기와 함께 두통·눈이 침침함·명치 통증이 있을 때는 바로 연락하세요.\"},{\"id\":\"n-pelvic-pain\",\"term\":\"허리와 골반이 아프다\",\"also\":\"치골통 · 골반통 · 좌골신경통\",\"whenTalked\":\"중기 이후 흔하게 이야기돼요.\",\"what\":\"아픈 걸 임신이니까 당연한 걸로 여기고 참는 분이 많아요. 몸의 무게 중심이 달라지고 관절을 잡아 주는 인대가 느슨해지면서 허리와 골반, 치골 부위가 아픈 일이 흔해요. 돌아누울 때나 계단에서 유난히 아픈 것도 자주 들어요. 흔하다고 해서 참아야 하는 것은 아니고, 자세와 보조도구, 운동으로 이야기해 볼 수 있는 영역이에요.\",\"howChecked\":\"언제 어떤 자세에서 아픈지를 이야기하고 필요하면 재활 쪽에 함께 봐 달라고 해요. 골반 벨트 같은 것을 쓸지도 여기서 정해요.\",\"notAtHome\":\"아픈 자리만으로 원인을 가려낼 수 없어요. 인터넷의 스트레칭 영상에는 임신 중에 권하지 않는 동작이 섞여 있어 하기 전에 한번 물어봐 주세요.\",\"ask\":[\"제 통증에 도움이 될 자세나 동작이 있나요?\",\"골반 벨트를 써도 되나요? 어떤 것을 고르나요?\",\"아플 때 먹어도 되는 약이 있나요?\",\"일하는 자세에서 바꿀 것이 있을까요?\"],\"callNow\":\"허리 통증이 규칙적으로 왔다 갔다 할 때, 열이 나면서 옆구리가 아플 때, 다리에 힘이 빠지거나 소변을 참기 어려울 때는 연락하세요.\"},{\"id\":\"n-heartburn\",\"term\":\"속이 쓰리고 신물이 올라온다\",\"also\":\"역류 · 소화불량 · 명치 통증\",\"whenTalked\":\"중기 이후, 특히 후기에 많이 이야기돼요.\",\"what\":\"커진 자궁이 위를 밀어 올리고 호르몬 때문에 위와 식도 사이가 느슨해져 신물이 올라오는 일이 흔해요. 눕기만 하면 심해지는 것도 자주 듣는 이야기예요. 다만 후기에 명치가 아픈 것은 다른 이야기와 겹칠 때가 있어, 소화 문제로만 두지 말고 말하세요.\",\"howChecked\":\"언제 어떻게 아픈지를 이야기하고, 후기라면 혈압과 함께 봐요. 쓸 수 있는 약이 있는지도 진료에서 정해요.\",\"notAtHome\":\"명치가 아픈 것이 소화 때문인지 다른 것 때문인지 스스로 가려낼 수 없어요. 소화제를 먹고 나아지는지로 재는 것도 맞지 않아요.\",\"ask\":[\"지금 시기에 먹어도 되는 약이 있나요?\",\"식사나 자세에서 바꿀 것이 있을까요?\",\"명치가 아플 때는 언제 연락해야 하나요?\",\"밤에 심한데 어떻게 자면 될까요?\"],\"callNow\":\"명치나 오른쪽 갈비뼈 아래가 조이듯 아플 때, 그와 함께 두통이나 눈이 침침한 느낌이 있을 때, 토가 멈추지 않을 때는 바로 연락하세요.\"},{\"id\":\"n-constipation\",\"term\":\"변비와 치질\",\"also\":\"배변 · 항문 통증 · 철분제\",\"whenTalked\":\"어느 시기에나 이야기되고, 철분을 먹기 시작하면 더 이야기돼요.\",\"what\":\"말하기 민망해서 넘기기 쉬운 이야기예요. 장이 움직이는 속도가 느려지고 철분제의 영향도 있어 변비가 잘 생겨요. 그러다 치질로 이어지는 일도 흔해요. 임신 중에 쓸 수 있는 방법이 따로 있어, 말하면 달라지는 영역이에요.\",\"howChecked\":\"지금 먹는 것과 철분제, 배변 상태를 함께 보고 정해요. 임신 중에 써도 되는 약과 아닌 약이 나뉘어 있어 처방으로 받으시는 쪽을 권해요.\",\"notAtHome\":\"약국에서 임의로 고른 변비약이나 관장약을 쓰지 마세요. 임신 중에 권하지 않는 성분이 있어요. 비친 피가 치질에서 온 것인지 다른 곳에서 온 것인지도 집에서 가려낼 수 없어요.\",\"ask\":[\"지금 쓸 수 있는 변비약이 있나요?\",\"철분제를 바꾸거나 먹는 시간을 조정할 수 있나요?\",\"치질이 아픈데 앉는 자세나 좌욕은 어떻게 할까요?\",\"피가 비쳤는데 어디서 나온 것인지 봐 주시겠어요?\"]},{\"id\":\"n-legs\",\"term\":\"다리에 쥐가 난다 · 핏줄이 비친다\",\"also\":\"종아리 경련 · 하지정맥류\",\"whenTalked\":\"중기 이후, 특히 밤에 이야기돼요.\",\"what\":\"밤에 종아리에 쥐가 나거나 다리에 핏줄이 도드라지고 무거운 느낌이 드는 일이 흔해요. 서 있는 시간이 길수록 더해요. 다만 한쪽 다리만 붓고 아픈 것은 다른 이야기라 따로 봐요.\",\"howChecked\":\"양쪽이 같은지 다른지, 붓기와 색이 어떤지를 보고 정해요. 필요하면 다리 혈관을 보는 검사를 해요.\",\"notAtHome\":\"한쪽만 아픈 것이 그냥 쥐인지 다른 것인지 집에서 가려낼 수 없어요. 주무르거나 파스를 붙여 보고 나아지는지로 재지 마세요.\",\"ask\":[\"밤에 쥐가 나는데 해볼 것이 있나요?\",\"압박 스타킹을 신어도 되나요? 어떤 것을 고르나요?\",\"오래 서 있는 일을 하는데 어떻게 할까요?\",\"어떨 때 바로 와야 하나요?\"],\"callNow\":\"한쪽 종아리만 붓고 아프거나 붉고 뜨거울 때, 갑자기 숨이 차거나 가슴이 아플 때는 바로 연락하세요.\"},{\"id\":\"n-infection\",\"term\":\"질염 · 방광염\",\"also\":\"분비물 · 소변 볼 때 아픔 · 세균뇨\",\"whenTalked\":\"어느 시기에나 이야기되고, 정기 소변검사에서 나오기도 해요.\",\"what\":\"임신 중에는 분비물이 늘고 몸의 상태가 달라져 질염이나 방광염이 잘 생겨요. 임신 중의 방광염은 그대로 두면 위쪽으로 올라가는 일이 있어 미루지 않으시는 쪽을 권해요. 아무 느낌이 없는데 소변검사에서 균이 나오는 경우도 있어 검사로 봐요.\",\"howChecked\":\"소변검사와 분비물 검사로 봐요. 임신 중에 쓸 수 있는 약이 따로 있어 처방으로 받아요.\",\"notAtHome\":\"분비물의 색과 냄새로 무엇인지 가려낼 수 없고, 양수가 새는 것과 헷갈리는 경우도 있어요. 예전에 처방받아 둔 약이나 약국에서 산 질정을 임의로 쓰지 마세요.\",\"ask\":[\"지금 증상으로 어떤 검사를 하면 될까요?\",\"임신 중에 써도 되는 약으로 처방해 주실 수 있나요?\",\"약을 다 쓰고 다시 확인해야 하나요?\",\"다시 생기지 않게 제가 할 수 있는 것이 있나요?\"],\"callNow\":\"열이 나면서 옆구리나 등이 아플 때, 소변에 피가 섞일 때, 배가 뭉치면서 아플 때는 바로 연락하세요.\"},{\"id\":\"n-weight\",\"term\":\"체중이 너무 늘었다 / 안 늘었다\",\"also\":\"임신 중 체중 증가\",\"whenTalked\":\"진료 때마다 재고 이야기돼요.\",\"what\":\"진료 때마다 체중계 앞에서 마음이 무거우시죠. 임신 중 체중이 얼마나 느는 것이 알맞은지는 임신 전의 몸 상태에 따라 사람마다 달라요. 한 번 잰 값보다 시간에 따른 흐름을 봐요. 짧은 사이에 확 늘거나 줄 때는 이유를 함께 보는데, 갑자기 느는 것은 붓기와 같이 놓고 보기도 해요.\",\"howChecked\":\"진료 때 재는 값을 이어서 봐요. 먹는 상태와 붓기, 혈압을 같이 놓고 봐요.\",\"notAtHome\":\"인터넷의 주수별 체중 표와 견주지 마세요. 시작점이 사람마다 달라 같은 표로 볼 수 있는 것이 아니에요. 살이 찐다고 스스로 굶는 것은 임신 중에 하면 안 되는 일이에요.\",\"ask\":[\"제 경우 지금 흐름을 어떻게 보고 계신가요?\",\"식사에서 바꿀 것이 있을까요?\",\"체중이 늘지 않는데 어떻게 보시나요?\",\"운동은 어느 정도로 하면 될까요?\"]},{\"id\":\"n-activity\",\"term\":\"운동 · 여행 · 비행기\",\"also\":\"임신 중 활동 · 장거리 이동\",\"whenTalked\":\"초기부터 계속 이야기되고, 후기에 다시 이야기돼요.\",\"what\":\"임신 중이라고 가만히 있어야 하는 것은 아니고, 대개는 하던 활동을 이어 가되 강도와 종류를 조정해요. 다만 지금까지의 경과에 따라 활동을 줄이라는 말을 따로 듣는 경우가 있어요. 비행기는 항공사마다 주수에 따른 규정과 필요한 서류가 있어 미리 확인해야 해요.\",\"howChecked\":\"지금까지의 경과와 하려는 활동의 종류를 놓고 정해요. 여행이라면 가는 곳과 기간, 그곳에서 갈 수 있는 병원까지 함께 이야기해 두시면 좋아요.\",\"notAtHome\":\"\\\"이 정도는 해도 되겠지\\\"를 스스로 정하지 마세요. 같은 운동도 지금까지의 경과에 따라 달리 이야기해요. 여행 중에 생긴 일을 검색으로 넘기는 것이 가장 곤란한 경우예요.\",\"ask\":[\"제 경우 지금 해도 되는 운동과 피할 운동을 알려주세요.\",\"여행을 가려는데 시기와 기간을 어떻게 잡으면 될까요?\",\"비행기를 타려면 서류가 필요한가요? 언제까지 가능한가요?\",\"여행지에서 무슨 일이 생기면 어떻게 하나요? 소견서를 받을 수 있나요?\"]},{\"id\":\"n-sleep\",\"term\":\"왼쪽으로 자라고 들었다\",\"also\":\"수면 자세 · 옆으로 눕기\",\"whenTalked\":\"중기 이후에 이야기돼요.\",\"what\":\"후기에 똑바로 누우면 커진 자궁이 몸 가운데를 지나는 큰 혈관을 눌러 어지럽거나 답답해질 수 있어 옆으로 눕기를 권하는 이야기가 나와요. 왼쪽이라는 말이 많이 돌지만 옆으로 눕는 것이 중심이고, 자다가 자세가 바뀌었다고 스스로를 탓할 일은 아니에요. 깨어 보니 똑바로 누워 있었다면 다시 옆으로 돌아누우면 돼요.\",\"howChecked\":\"누웠을 때 어지럽거나 숨이 답답한 느낌이 있는지를 진료에서 이야기해요. 베개를 어떻게 쓸지 같은 것도 함께 이야기할 수 있어요.\",\"notAtHome\":\"자는 동안 어떤 자세였는지는 스스로 알 수 없고, 그것으로 아이의 상태를 셈할 수도 없어요. 밤새 자세를 지켰는지로 자책하는 대신, 낮에 태동이 평소와 같은지를 봐 주세요.\",\"ask\":[\"똑바로 누우면 답답한데 어떻게 하면 될까요?\",\"옆으로 자려면 베개를 어떻게 쓰면 될까요?\",\"코를 심하게 곤다는 말을 듣는데 확인할 것이 있나요?\",\"밤에 잠을 잘 못 자는데 방법이 있을까요?\"]},{\"id\":\"n-intimacy\",\"term\":\"부부관계를 해도 되나요\",\"also\":\"성생활 · 관계 뒤 출혈\",\"whenTalked\":\"물어보기 어려워 넘기는 경우가 많지만, 어느 시기에나 물어도 되는 이야기예요.\",\"what\":\"괜히 물어봐도 되나 싶으시죠. 임신 중 부부관계는 지금까지의 경과에 따라 이야기가 달라져요. 전치태반이나 조기진통처럼 따로 이야기가 있는 경우에는 하지 말라는 말을 듣게 되고, 그런 이야기가 없다면 다르게 이야기해요. 관계 뒤에 배가 뭉치거나 소량의 출혈이 비치는 경우가 있는데, 그대로 두지 말고 말하세요.\",\"howChecked\":\"지금까지의 경과와 태반 위치, 자궁 입구의 상태를 놓고 담당 의료진이 말해 줘요. 물어보기 민망하면 다른 질문 사이에 끼워서 물어도 돼요.\",\"notAtHome\":\"인터넷의 답으로 정할 수 있는 것이 아니에요. 같은 주수라도 사람마다 이야기가 달라요.\",\"ask\":[\"제 경우 지금 시기에 해도 되나요?\",\"하지 말아야 하는 때가 따로 있나요?\",\"관계 뒤에 배가 뭉치거나 피가 비치면 어떻게 하나요?\",\"출산 뒤에는 언제부터 다시 해도 되나요?\"]},{\"id\":\"n-vaccine-preg\",\"term\":\"임신 중 예방접종\",\"also\":\"독감 · 백일해 접종\",\"whenTalked\":\"시기가 정해진 것이 있어 검진에서 안내받아요.\",\"what\":\"임신 중에 맞도록 권고되는 접종이 있고, 미루었다가 출산 뒤에 맞는 것도 있어요. 지금 맞는 것 가운데는 태어난 아이를 위한 것도 있어요 — 아이가 스스로 접종을 받기 전까지 기댈 것을 미리 넘겨 주는 방식이에요. 함께 사는 가족에게도 권고되는 항목이 있어요.\",\"howChecked\":\"권고 시기와 항목은 검진에서 안내받아요. 이전 접종 기록이 있으면 그것을 보고 정해요.\",\"notAtHome\":\"무엇을 맞을 수 있고 무엇은 미뤄야 하는지는 항목마다 달라요. 인터넷에서 본 것으로 미루거나 앞당기지 마세요.\",\"ask\":[\"지금 시기에 맞을 수 있는 것이 무엇인가요?\",\"언제 맞는 것이 좋은가요?\",\"같이 사는 가족도 맞아야 하나요?\",\"출산 뒤로 미루는 것이 있나요?\"]},{\"id\":\"n-antenatal-mood\",\"term\":\"산전 우울 · 불안\",\"also\":\"임신 중 우울감\",\"whenTalked\":\"어느 시기에나 나타날 수 있고, 검진에서 설문으로 물어보기도 해요.\",\"what\":\"기쁘기만 해야 할 것 같은데 그렇지 않아서 더 힘드시죠. 임신 중에 기분이 오래 가라앉거나 불안이 일상을 막는 상태를 가리키는 말이에요. 산후에만 오는 것으로 알려져 있지만 임신 중에도 드물지 않아요. 호르몬 변화, 잠의 부족, 생활의 변화가 겹치는 시기라 '원래 그런 것'으로 넘어가기 쉬운데, 그렇게 넘기다 오래가는 경우가 많아요.\",\"howChecked\":\"검진에서 설문으로 묻거나, 본인이 말한 것을 바탕으로 이야기가 시작돼요. 어떻게 도울지는 정신건강 쪽과 함께 정하는 경우가 많아요.\",\"notAtHome\":\"인터넷의 자가 설문으로 스스로 결론 내리지 마세요. 며칠의 기분과 이어지는 상태는 다르고, 그 구분은 이야기를 나눠야 나와요.\",\"ask\":[\"이런 기분이 이어지는데 어디에 이야기하면 되나요?\",\"임신 중에 받을 수 있는 도움에는 무엇이 있나요?\",\"먹고 있는 약이 있다면 어떻게 하나요?\",\"가족이 함께 들어야 할 것이 있나요?\"],\"callNow\":\"스스로를 해치는 생각이 들면 혼자 두지 마세요. 자살예방상담 109, 정신건강상담 1577-0199로 지금 연락할 수 있어요.\"}],\"baby\":[{\"id\":\"b-jaundice\",\"term\":\"황달이 있다고 해요\",\"also\":\"신생아 황달 · 빌리루빈 · 빛을 쬐어 주는 것\",\"whenTalked\":\"태어난 지 며칠 안에 가장 많이 이야기되고, 퇴원할 때 다시 확인하기도 해요.\",\"point\":\"몸이 노랗게 보이는 정도만으로는 집에서 가늠할 수 없어요. 조명과 피부색에 따라 달라 보여요.\",\"what\":\"피부와 눈의 흰자가 노랗게 보이는 것을 말해요. 태어난 지 며칠 사이에 나타나는 경우가 많고, 언제 시작했는지와 얼마나 빨리 짙어지는지에 따라 보는 방식이 달라져요. 몇 주 뒤에 나타나거나 오래 이어지는 경우는 또 다르게 봐요.\",\"howChecked\":\"피 검사나 피부에 대는 기계로 값을 보고, 태어난 지 며칠째인지와 함께 놓고 판단해요. 수유가 잘 되고 있는지, 대소변이 어떤지도 같이 봐요.\",\"notAtHome\":\"밝기가 다른 곳에서 보면 같은 아이도 달라 보여요. 사진으로도 정확하지 않아요. 햇볕을 쬐게 하라는 옛말이 도는데, 그걸로 대신할 수 있는 것이 아니고 오히려 아이가 힘들어져요.\",\"ask\":[\"지금 수치를 어떻게 보고 계신가요?\",\"언제 다시 확인해야 하나요?\",\"집에서는 무엇을 보고 연락드리면 되나요?\",\"수유는 지금처럼 계속하면 되나요?\"],\"callNow\":\"잘 먹지 못하거나, 축 늘어져 깨우기 어렵거나, 노란 기가 빠르게 짙어지거나, 대변 색이 옅어지면 바로 연락하세요.\"},{\"id\":\"b-growth-curve\",\"term\":\"성장 곡선 이야기를 들었어요\",\"also\":\"키·몸무게 그래프 · 성장 도표\",\"whenTalked\":\"영유아 검진 때마다 나오고, 잘 먹지 않는다고 걱정할 때도 이야기돼요.\",\"point\":\"한 번의 점이 아니라 여러 번의 흐름을 봐요. 지난번과 이번을 이어 보는 것이 그 곡선의 뜻이에요.\",\"what\":\"같은 개월수의 아이들이 어디쯤에 있는지를 그려 놓은 그래프 위에 우리 아이를 얹어 보는 거예요. 한 점이 어디에 찍혔는지보다 그 점들이 이어지는 방향과 속도를 함께 봐요. 태어날 때의 상태와 그동안 아팠던 일도 같이 놓고 읽어요.\",\"howChecked\":\"정해진 방법으로 키와 몸무게, 머리 둘레를 재서 그래프에 표시하고, 지난 기록과 이어 봐요. 재는 자세와 옷차림에 따라 값이 달라져서 병원에서 같은 방법으로 재요.\",\"notAtHome\":\"집 체중계와 병원 저울은 다르게 나오고, 옷을 입은 채로 재면 또 달라요. 집에서 잰 값을 그래프에 얹어 보면 없는 걱정이 생기거나 있는 변화를 놓쳐요. 다른 집 아이와 견주는 것으로는 아무것도 알 수 없어요.\",\"ask\":[\"지난번과 견주면 어떻게 보고 계신가요?\",\"지금 흐름에서 특별히 볼 것이 있나요?\",\"다음에는 언제 다시 재나요?\",\"먹는 것과 관련해서 바꿀 것이 있을까요?\"]},{\"id\":\"b-torticollis\",\"term\":\"목이 한쪽으로 기울어 있대요\",\"also\":\"사경 · 목 근육 · 손으로 하는 재활 이야기\",\"whenTalked\":\"생후 몇 달 안에 이야기되는 경우가 많고, 한쪽으로만 보려고 한다고 걱정할 때 나와요.\",\"point\":\"일찍 이야기가 시작되면 할 수 있는 것이 많아요. 미루는 것이 가장 손해예요.\",\"what\":\"머리가 한쪽으로 기울거나 한쪽으로만 고개를 돌리려는 모습을 두고 하는 말이에요. 목 근육 쪽에서 오는 경우도 있고 자세 습관에서 오는 경우도 있어서, 어느 쪽인지에 따라 하는 일이 달라져요.\",\"howChecked\":\"고개를 어느 쪽으로 얼마나 돌릴 수 있는지 직접 보고, 필요하면 초음파 같은 검사를 함께 봐요. 얼굴이나 머리 모양이 함께 달라졌는지도 봐요.\",\"notAtHome\":\"누워 있는 방향과 안는 자세 때문에 그렇게 보이는 것인지, 다른 이유가 있는지는 만져 보고 움직여 봐야 알 수 있어요. 집에서 억지로 고개를 돌려 두는 것은 하지 마세요.\",\"ask\":[\"어느 쪽으로 얼마나 기울어 있다고 보시나요?\",\"집에서 안거나 눕히는 자세를 어떻게 바꿔 볼까요?\",\"따로 봐야 하는 곳이 있을까요?\",\"언제 다시 확인하면 되나요?\"]},{\"id\":\"b-hip\",\"term\":\"고관절을 한번 보자고 해요\",\"also\":\"발달성 고관절 이형성증 · 엉덩관절 초음파\",\"whenTalked\":\"신생아 진찰과 영유아 검진에서 나오고, 다리 주름이 다르다거나 벌어지는 정도가 다르다고 할 때 이야기돼요.\",\"point\":\"일찍 볼수록 할 수 있는 것이 많아요. 걷기 시작한 뒤에 알게 되면 이야기가 달라져요.\",\"what\":\"엉덩이 관절이 제자리에 잘 자리 잡고 있는지를 보는 이야기예요. 태어날 때의 자세나 가족력과 관련이 있기도 해서, 그런 것이 있으면 미리 보자고 하기도 해요.\",\"howChecked\":\"다리를 벌리고 움직여 보면서 살피고, 필요하면 초음파나 엑스레이로 확인해요. 개월수에 따라 보는 방법이 달라져요.\",\"notAtHome\":\"다리 주름이 다른 아이는 흔하고, 그것만으로는 알 수 없어요. 반대로 겉으로 아무 표시가 없어도 확인이 필요한 경우가 있어요. 집에서 다리를 벌려 보는 것으로는 가늠할 수 없어요.\",\"ask\":[\"지금 무엇을 보고 이 이야기를 하시나요?\",\"검사를 받아야 하나요, 지켜봐도 되나요?\",\"안거나 업을 때 자세를 어떻게 하면 좋을까요?\",\"다시 볼 때는 언제가 좋을까요?\"]},{\"id\":\"b-febrile-seizure\",\"term\":\"열성 경련 이야기를 들었어요\",\"also\":\"열경련 · 열 나면서 경기\",\"whenTalked\":\"열이 오르는 병을 앓을 때 이야기되고, 한 번 겪은 뒤에 다시 물어보게 돼요.\",\"point\":\"경련하는 동안 입에 무엇을 넣거나 팔다리를 붙잡지 마세요. 옆으로 뉘어 두고 시각을 보세요.\",\"what\":\"열이 오르는 중에 몸이 뻣뻣해지거나 떨리고 반응이 없어지는 일을 말해요. 어린 나이에 열이 오를 때 나타나는 경우가 있고, 얼마나 오래갔는지와 어떤 모습이었는지를 중요하게 봐요.\",\"howChecked\":\"어떤 모습이었는지, 얼마나 이어졌는지, 그 뒤에 어떻게 회복했는지를 듣고 봐요. 열의 원인을 찾는 검사를 함께 하기도 해요.\",\"notAtHome\":\"무엇 때문에 그런 것인지, 다시 그럴지는 집에서 알 수 없어요. 해열제를 미리 먹인다고 해서 막을 수 있는 것도 아니에요. 겪은 뒤에는 반드시 진료를 받고, 그때의 모습을 기억나는 대로 말하세요.\",\"ask\":[\"그때 모습을 말씀드리면 어떻게 보시나요?\",\"다음에 또 그러면 무엇을 어떻게 해야 하나요?\",\"열이 날 때 집에서 무엇을 챙기면 되나요?\",\"이번 일로 따로 봐야 할 것이 있나요?\"],\"callNow\":\"경련이 길게 이어지거나, 여러 번 반복되거나, 끝난 뒤에도 깨어나지 못하거나, 숨쉬기 힘들어하면 즉시 119에 연락하세요.\"},{\"id\":\"b-bronchiolitis\",\"term\":\"세기관지염이래요\",\"also\":\"모세기관지염 · RSV · 숨소리가 쌕쌕\",\"whenTalked\":\"가을과 겨울에 많이 이야기되고, 감기인 줄 알았는데 숨소리가 달라졌을 때 나와요.\",\"point\":\"이 병은 숨 쉬는 모습을 보는 것이 가장 중요해요. 기침 소리보다 갈비뼈 사이가 들어가는지, 숨이 가쁜지를 보세요.\",\"what\":\"숨길의 가느다란 부분에 생기는 염증을 말해요. 어린아이에게 많고, 기침과 함께 숨소리가 쌕쌕거리거나 숨이 가빠지기도 해요. 며칠에 걸쳐 심해졌다가 나아지는 흐름을 보이는 경우가 많아요.\",\"howChecked\":\"숨소리를 듣고 숨 쉬는 모습을 보고, 산소가 어떤지 확인하기도 해요. 필요하면 검사를 더 하기도 해요.\",\"notAtHome\":\"가래 소리와 숨이 힘든 것은 집에서 구분하기 어려워요. 열이 없어도 숨이 힘들 수 있고, 밤에 갑자기 나빠지기도 해요. 아이가 어릴수록 더 빨리 달라져요.\",\"ask\":[\"지금 숨 쉬는 모습을 어떻게 보고 계신가요?\",\"집에서 무엇을 보고 있어야 하나요?\",\"언제 다시 와야 하나요?\",\"먹는 것이 줄어도 괜찮을 만한 정도가 있나요?\"],\"callNow\":\"숨이 가빠 보이거나, 갈비뼈 사이나 목이 쑥 들어가거나, 입술·얼굴색이 변하거나, 먹지 못하고 축 늘어지면 바로 연락하세요.\"},{\"id\":\"b-croup\",\"term\":\"크룹이라고 해요\",\"also\":\"후두염 · 컹컹거리는 기침 · 개 짖는 소리\",\"whenTalked\":\"밤에 갑자기 기침 소리가 달라져서 응급실을 찾을 때 많이 이야기돼요.\",\"point\":\"숨을 들이쉴 때 소리가 나거나 힘들어하면 기다리지 마세요. 낮에 멀쩡하다가 밤에 심해지는 경우가 많아요.\",\"what\":\"목 안쪽 숨길이 부어서 기침 소리가 개 짖는 소리처럼 바뀌고 목소리가 쉬는 것을 말해요. 밤에 심해졌다가 낮에 나아 보이기를 며칠 반복하기도 해요.\",\"howChecked\":\"기침 소리와 숨소리를 듣고 숨 쉬는 모습을 봐요. 얼마나 부어 있는지에 따라 그 자리에서 하는 일이 달라져요.\",\"notAtHome\":\"소리만으로 얼마나 부었는지는 알 수 없어요. 찬 공기를 쐬면 잠깐 나아 보이기도 하는데, 나아진 것과 지나간 것은 달라요.\",\"ask\":[\"지금 숨길이 어느 정도라고 보시나요?\",\"밤에 심해지면 무엇을 하면 되나요?\",\"어떤 모습이면 바로 와야 하나요?\",\"며칠쯤 이어질 수 있나요?\"],\"callNow\":\"숨을 들이쉴 때 소리가 나거나, 침을 흘리며 삼키지 못하거나, 입술색이 변하거나, 앉아서만 숨을 쉬려 하면 즉시 연락하세요.\"},{\"id\":\"b-otitis\",\"term\":\"중이염이 있대요\",\"also\":\"귀에 물이 찼다 · 삼출성 중이염\",\"whenTalked\":\"감기 끝에 이야기되고, 귀를 자꾸 만지거나 밤에 심하게 보챌 때 나와요.\",\"point\":\"귀를 만진다고 다 중이염은 아니고, 아프다는 말을 못 해도 중이염일 수 있어요.\",\"what\":\"귀 안쪽에 염증이 생기거나 물이 차 있는 상태를 말해요. 아파하는 경우도 있고 아무 말 없이 지나가는 경우도 있어요. 물이 남아 있는 상태가 이어지면 듣는 것과 이어질 수 있어서 따로 봐요.\",\"howChecked\":\"귀 안을 들여다보고, 필요하면 고막이 어떻게 움직이는지 보는 검사를 해요. 여러 번 반복되면 듣는 것을 함께 확인하기도 해요.\",\"notAtHome\":\"귀 안은 집에서 볼 수 없어요. 아프다고 하지 않아도 있을 수 있고, 반대로 귀를 만지는 것이 다른 이유일 때도 많아요. 면봉으로 안을 건드리지 마세요.\",\"ask\":[\"지금 귀 안이 어떤 상태인가요?\",\"다시 볼 필요가 있나요? 언제쯤인가요?\",\"듣는 것에 영향이 있을 수 있나요?\",\"물놀이나 목욕은 어떻게 하면 되나요?\"],\"callNow\":\"귀에서 진물이나 피가 나거나, 귀 뒤가 붓고 아파하거나, 열과 함께 심하게 처지면 바로 연락하세요.\"},{\"id\":\"b-food-allergy\",\"term\":\"식품 알레르기 이야기를 들었어요\",\"also\":\"알레르기 검사 · 특정 음식 피하기\",\"whenTalked\":\"이유식을 시작할 때와 새로운 음식을 먹은 뒤 두드러기가 났을 때 이야기돼요.\",\"point\":\"검사 결과 하나만으로 정해지지 않아요. 실제로 먹었을 때 어땠는지가 함께 있어야 이야기가 돼요.\",\"what\":\"특정 음식에 몸이 과하게 반응하는 것을 말해요. 반응하는 방식과 정도가 아이마다 다르고, 자라면서 달라지기도 해서 한 번 정해지면 끝나는 이야기가 아니에요.\",\"howChecked\":\"먹은 것과 그 뒤의 모습을 자세히 듣고, 필요하면 피 검사나 피부 검사를 해요. 검사에서 나온 값과 실제로 먹었을 때의 모습을 함께 놓고 봐요.\",\"notAtHome\":\"검사 없이 짐작으로 음식을 하나씩 빼면 먹을 수 있는 것이 좁아지기만 해요. 반대로 인터넷의 안전한 음식 목록으로 정하는 것도 위험해요. 무엇을 빼고 언제 다시 시도할지는 진료에서 정해요.\",\"ask\":[\"이 검사 결과를 어떻게 보고 계신가요?\",\"지금 빼야 하는 음식이 무엇인가요?\",\"언제 다시 시도해 볼 수 있나요?\",\"밖에서 먹을 때 무엇을 조심하면 되나요?\"],\"callNow\":\"먹은 뒤에 입이나 눈이 붓거나, 숨쉬기 힘들어하거나, 온몸에 두드러기가 빠르게 번지거나, 축 늘어지면 즉시 119에 연락하세요.\"},{\"id\":\"b-dev-screening\",\"term\":\"발달 선별검사에서 더 볼 게 있다고 해요\",\"also\":\"영유아 검진 문진표 · 심화 평가 권유\",\"whenTalked\":\"영유아 검진에서 문진표를 낸 뒤에 이야기돼요.\",\"point\":\"이 검사는 가려내는 검사예요. 무엇을 정하는 검사가 아니라 더 볼지 말지를 나누는 자리예요.\",\"what\":\"그 나이에 흔히 나타나는 것들을 부모가 답하는 방식으로 훑어보는 검사예요. 여기서 더 보자는 말이 나오면 그다음 단계로 자세히 보는 평가를 권해요. 훑는 검사라 실제와 다르게 나오기도 해서, 다음 단계가 있는 거예요.\",\"howChecked\":\"나이에 맞는 문항에 부모가 답하고, 필요하면 직접 관찰하거나 더 자세한 평가로 넘어가요. 듣는 것과 보는 것을 함께 확인하기도 해요.\",\"notAtHome\":\"문항을 다시 읽고 스스로 채점해 봐도 의미가 없어요. 인터넷의 체크리스트로 가늠하는 것도 마찬가지예요. 반대로 미루는 것이 가장 아까운 자리이기도 해요 — 이르다고 미루지 않으셔도 돼요.\",\"ask\":[\"어떤 부분에서 더 보자고 하시는 건가요?\",\"다음 단계는 어디서 어떻게 받나요?\",\"그때까지 집에서 해볼 만한 것이 있을까요?\",\"언제까지 받아 보는 것이 좋을까요?\"]},{\"id\":\"b-hfmd\",\"term\":\"수족구래요\",\"also\":\"손발입병 · 구내염 · 등원 중지\",\"whenTalked\":\"어린이집에 다니기 시작한 뒤 여름과 초가을에 많이 이야기돼요.\",\"point\":\"물을 넘기지 못하는 것이 이 병에서 가장 조심할 부분이에요. 발진보다 먹고 마시는 것을 보세요.\",\"what\":\"입 안과 손발에 물집 같은 것이 생기는 병이에요. 입이 아파서 먹고 마시기를 힘들어하는 경우가 많고, 며칠에 걸쳐 지나가요. 옮는 병이라 언제까지 기관에 안 보내는지가 함께 이야기돼요.\",\"howChecked\":\"입 안과 손발을 보고 판단해요. 열이 함께 있는지, 물을 얼마나 넘기는지도 같이 봐요.\",\"notAtHome\":\"발진만 보고 다른 병과 가려내기 어려워요. 물집이 가라앉아도 얼마간 옮길 수 있어서, 언제부터 다시 보내도 되는지는 진료와 기관 기준을 함께 확인해야 해요.\",\"ask\":[\"언제부터 다시 기관에 보내도 되나요?\",\"집에서 무엇을 먹이면 덜 아파할까요?\",\"형제에게 옮지 않게 무엇을 조심하면 되나요?\",\"다시 와야 하는 경우는 언제인가요?\"],\"callNow\":\"물을 거의 넘기지 못하거나, 소변이 크게 줄거나, 열이 여러 날 이어지거나, 축 늘어져 반응이 약하면 바로 연락하세요.\"},{\"id\":\"b-gastro\",\"term\":\"장염이라고 해요\",\"also\":\"구토·설사 · 로타 · 노로\",\"whenTalked\":\"토하고 설사할 때 이야기되고, 어린이집에서 돌 때 함께 나와요.\",\"point\":\"이 병에서 가장 중요한 것은 물이 빠져나가는 것을 막는 일이에요. 무엇을 먹이느냐보다 얼마나 마시느냐를 봐요.\",\"what\":\"장에 염증이 생겨 토하거나 설사하는 것을 말해요. 원인이 여러 가지라 무엇 때문인지에 따라 이야기가 달라지고, 대개 며칠에 걸쳐 지나가요.\",\"howChecked\":\"언제부터 얼마나 자주 토하고 설사했는지, 물을 넘기는지, 소변이 어떤지를 듣고 봐요. 필요하면 대변 검사를 하기도 해요.\",\"notAtHome\":\"물이 얼마나 빠졌는지는 겉으로 가늠하기 어려워요. 지사제나 어른 약을 임의로 먹이면 오히려 위험할 수 있어요. 무엇을 어떻게 먹일지는 진료에서 들으세요.\",\"ask\":[\"지금 물을 어떻게 먹이면 되나요?\",\"무엇을 먹여도 되고 무엇을 피할까요?\",\"어떤 모습이면 바로 와야 하나요?\",\"기관에는 언제부터 보내도 되나요?\"],\"callNow\":\"먹거나 마신 것을 계속 토해 아무것도 넘기지 못하거나, 소변이 크게 줄거나, 대변에 피가 섞이거나, 축 늘어져 깨우기 어려우면 바로 연락하세요.\"},{\"id\":\"b-atopy\",\"term\":\"아토피 피부염이라고 해요\",\"also\":\"태열 · 습진 · 보습\",\"whenTalked\":\"생후 몇 달부터 이야기되고, 계절이 바뀔 때마다 다시 나와요.\",\"point\":\"좋다는 것을 이것저것 발라 보면 무엇 때문에 나아졌는지 나빠졌는지 알 수 없게 돼요.\",\"what\":\"피부가 건조하고 가렵고 붉어지는 것이 오래 이어지는 상태를 말해요. 나아졌다 나빠졌다를 반복하는 경우가 많고, 계절과 환경에 따라 달라져요.\",\"howChecked\":\"어디에 어떻게 났는지, 언제부터 어떤 흐름이었는지를 보고 판단해요. 가족력과 다른 알레르기가 있는지도 함께 봐요.\",\"notAtHome\":\"음식 때문이라고 짐작해서 하나씩 빼면 먹을 수 있는 것만 좁아져요. 인터넷에서 좋다는 것을 여러 개 겹쳐 바르면 무엇이 맞았는지 알 수 없어져요. 바르는 것을 바꾸기 전에 물어보세요.\",\"ask\":[\"지금 상태를 어떻게 보고 계신가요?\",\"어떤 순서로 무엇을 발라야 하나요?\",\"음식과 관련이 있다고 보시나요?\",\"나빠지면 언제 다시 와야 하나요?\"],\"callNow\":\"긁은 자리가 진물이 나고 노랗게 딱지가 지거나, 열이 함께 나거나, 빠르게 번지면 바로 연락하세요.\"},{\"id\":\"b-strabismus\",\"term\":\"눈이 몰리는 것 같다고 해요\",\"also\":\"사시 · 가성 사시 · 눈 정렬\",\"whenTalked\":\"돌 전후에 사진을 보다 이야기되고, 영유아 검진에서 나오기도 해요.\",\"point\":\"어릴 때 눈 모양이 그렇게 보이는 경우가 흔한데, 그것과 실제로 몰린 것을 겉모습으로 가르기는 어려워요.\",\"what\":\"두 눈이 같은 곳을 보지 않는 것처럼 보이는 상태를 말해요. 코가 낮고 눈 사이가 넓은 시기에는 그렇게 보이기만 하는 경우도 있어서, 실제로 그런지 아닌지를 가르는 것이 먼저예요.\",\"howChecked\":\"빛을 비추어 눈에 맺히는 모습을 보고, 가리고 떼는 방식으로 두 눈이 어떻게 움직이는지 봐요. 시력과 함께 보기도 해요.\",\"notAtHome\":\"사진으로는 각도와 조명 때문에 다르게 보여요. 집에서 손으로 가려 보는 것으로는 알 수 없어요. 보는 것과 관련된 일은 시기를 놓치면 되돌리기 어려운 부분이 있어서 미루지 않는 편이 좋아요.\",\"ask\":[\"지금 실제로 몰린 것으로 보시나요?\",\"따로 검사를 받아야 하나요?\",\"언제 다시 확인하면 되나요?\",\"집에서 볼 만한 것이 있을까요?\"]},{\"id\":\"b-anemia\",\"term\":\"빈혈이 있다고 해요\",\"also\":\"철분 부족 · 헤모글로빈 수치\",\"whenTalked\":\"영유아 검진의 피 검사 뒤에 이야기되고, 잘 안 먹는다고 걱정할 때도 나와요.\",\"point\":\"철분제를 임의로 사서 먹이지 마세요. 필요한 양과 기간은 검사 결과를 보고 정해요.\",\"what\":\"피 안에서 산소를 옮기는 부분이 모자란 상태를 말해요. 이 나이에는 먹는 것과 관련해 생기는 경우가 많고, 자라는 속도가 빠른 시기와 겹치기도 해요.\",\"howChecked\":\"피 검사로 값을 보고, 먹는 것과 자라는 흐름을 함께 놓고 판단해요. 필요하면 몇 주 뒤에 다시 검사해서 달라졌는지 봐요.\",\"notAtHome\":\"얼굴이 창백해 보이는 것만으로는 알 수 없고, 반대로 겉으로 멀쩡해도 있을 수 있어요. 우유를 많이 먹는 것과 관련될 수 있는데, 그 조절도 진료에서 함께 정하세요.\",\"ask\":[\"지금 값을 어떻게 보고 계신가요?\",\"무엇을 얼마나 먹여야 하나요?\",\"언제 다시 검사하나요?\",\"우유나 다른 먹는 것에서 바꿀 것이 있나요?\"]},{\"id\":\"b-uti\",\"term\":\"요로감염이래요\",\"also\":\"소변 검사 · 콩팥 초음파\",\"whenTalked\":\"이유 없이 열이 날 때 이야기되고, 소변 볼 때 아파한다고 할 때 나와요.\",\"point\":\"어린아이는 열만 나고 다른 표시가 없기도 해요. 그래서 이유를 모르는 열에서 소변 검사를 하자고 하는 거예요.\",\"what\":\"소변이 지나가는 길에 생기는 감염을 말해요. 어릴수록 열 말고는 눈에 띄는 것이 없는 경우가 있고, 반복되면 소변 길의 구조를 함께 보기도 해요.\",\"howChecked\":\"소변을 받아 검사해요. 어린아이는 받는 방법이 따로 있어서 병원에서 받아요. 필요하면 초음파 같은 검사를 더 하기도 해요.\",\"notAtHome\":\"집에서 받은 소변은 섞여 들어간 것 때문에 결과가 달라질 수 있어요. 냄새나 색만으로는 알 수 없어요. 열이 이유 없이 이어지면 미루지 말고 진료를 받으세요.\",\"ask\":[\"왜 이 검사를 하자고 하시나요?\",\"결과가 나오면 무엇이 달라지나요?\",\"다시 그러지 않게 집에서 챙길 것이 있나요?\",\"더 봐야 할 검사가 있나요?\"],\"callNow\":\"열이 여러 날 이어지거나, 심하게 처지거나, 소변을 거의 보지 않거나, 등이나 옆구리를 아파하면 바로 연락하세요.\"},{\"id\":\"b-tonsil\",\"term\":\"편도가 크다고 해요\",\"also\":\"아데노이드 · 코골이 · 입으로 숨쉬기\",\"whenTalked\":\"코를 심하게 곤다거나 입을 벌리고 잔다고 할 때 이야기돼요.\",\"point\":\"크다는 것만으로 무엇이 정해지지는 않아요. 자는 동안 숨쉬기가 어떤지를 함께 봐요.\",\"what\":\"목과 코 뒤쪽에 있는 조직이 커져 있는 상태를 말해요. 이 나이에 커지는 시기가 있고, 자는 동안 숨쉬기나 듣는 것과 이어지는지를 함께 봐요.\",\"howChecked\":\"직접 보고, 필요하면 엑스레이나 내시경으로 확인해요. 자는 동안의 숨쉬기를 보는 검사를 권하기도 해요.\",\"notAtHome\":\"코를 곤다고 다 문제인 것은 아니고, 안 곤다고 괜찮다고 볼 수도 없어요. 자는 모습을 찍어 두면 진료에서 이야기하기 좋아요.\",\"ask\":[\"지금 크기를 어떻게 보고 계신가요?\",\"자는 동안 숨쉬기를 확인해 봐야 할까요?\",\"지켜본다면 무엇을 보고 있어야 하나요?\",\"듣는 것에도 영향이 있을 수 있나요?\"],\"callNow\":\"자다가 숨이 멎는 것처럼 보이거나, 입술색이 변하거나, 낮에 심하게 처지면 바로 연락하세요.\"},{\"id\":\"b-flat-head\",\"term\":\"머리 모양이 한쪽으로 눌렸대요\",\"also\":\"사두 · 두상 · 헬멧 이야기\",\"whenTalked\":\"생후 몇 달 사이에 이야기되고, 목 기울어짐과 함께 나오기도 해요.\",\"point\":\"머리 모양은 시기가 지나면 손댈 수 있는 폭이 줄어요. 걱정되면 미루지 말고 일찍 물어보세요.\",\"what\":\"한쪽으로만 누워 지내면서 머리 한쪽이 납작해 보이는 것을 말해요. 목이 한쪽으로 기울어 있는 것과 함께 오는 경우가 있어서 두 가지를 같이 봐요.\",\"howChecked\":\"머리 모양을 위에서 보고 좌우를 견주어요. 목이 도는 정도를 함께 보고, 필요하면 다른 검사를 권하기도 해요.\",\"notAtHome\":\"집에서 보면 각도에 따라 달라 보이고, 얼마나 눌렸는지 가늠하기 어려워요. 눕히는 방향을 바꾸는 것은 도움이 되지만, 엎어 재우는 것은 위험하니 하지 마세요.\",\"ask\":[\"지금 정도를 어떻게 보고 계신가요?\",\"집에서 눕히는 방향을 어떻게 바꿔 볼까요?\",\"목이 도는 것도 함께 봐야 할까요?\",\"언제까지 지켜보다 다시 오면 되나요?\"]},{\"id\":\"b-hearing\",\"term\":\"청력을 다시 보자고 해요\",\"also\":\"신생아 청각선별 · 재검 · 듣는 검사\",\"whenTalked\":\"태어나서 받는 검사에서 다시 보자는 말이 나올 때, 말이 늦다고 걱정할 때 이야기돼요.\",\"point\":\"다시 보자는 말은 결과가 나왔다는 뜻이 아니에요. 그날의 상태 때문에 다시 재는 경우가 많아요.\",\"what\":\"듣는 것이 어떤지를 보는 검사예요. 태어난 직후에는 귀 안에 남아 있는 것이나 아이가 움직이는 것 때문에 다시 재는 경우가 있어요. 말이 늦을 때도 듣는 것부터 확인하자고 해요.\",\"howChecked\":\"잠든 사이에 소리에 대한 반응을 보는 검사를 해요. 나이에 따라 방법이 달라지고, 여러 번 나누어 보기도 해요.\",\"notAtHome\":\"소리에 반응한다고 해서 다 듣고 있다고 볼 수 없어요. 진동이나 움직임에 반응하는 경우도 있어서, 집에서 손뼉을 쳐 보는 것으로는 알 수 없어요.\",\"ask\":[\"왜 다시 보자고 하시는 건가요?\",\"언제 다시 받아야 하나요?\",\"결과에 따라 무엇이 달라지나요?\",\"말이 늦는 것과 관련이 있을까요?\"]},{\"id\":\"b-precocious\",\"term\":\"사춘기가 이른 것 같다고 해요\",\"also\":\"성조숙증 · 성장판 · 골연령\",\"whenTalked\":\"가슴이 나오거나 몸이 달라지는 것을 보고 이야기되고, 학령기 검진에서 나오기도 해요.\",\"point\":\"인터넷의 시작 나이 표와 견주지 마세요. 시작한 시기만이 아니라 진행하는 속도를 함께 봐요.\",\"what\":\"몸의 변화가 또래보다 이르게 시작된 것으로 보일 때 하는 이야기예요. 시작한 시점만이 아니라 얼마나 빠르게 진행하는지, 키가 자라는 속도가 어떤지를 함께 놓고 봐요.\",\"howChecked\":\"몸의 변화를 보고, 손 엑스레이로 뼈의 나이를 보거나 피 검사를 하기도 해요. 몇 달 간격으로 다시 보면서 속도를 봐요.\",\"notAtHome\":\"겉모습만으로는 가릴 수 없고, 살이 붙어서 그렇게 보이는 경우도 있어요. 인터넷의 나이 기준으로 스스로 견주면 없는 걱정이 생기거나 있는 변화를 놓쳐요.\",\"ask\":[\"지금 무엇을 보고 이 이야기를 하시나요?\",\"어떤 검사를 받아야 하나요?\",\"얼마 간격으로 다시 보면 되나요?\",\"아이에게는 어떻게 설명해 주면 좋을까요?\"]}],\"pregnancyFacts\":[{\"id\":\"f-bonding-missed\",\"kind\":\"saying\",\"term\":\"태교를 못했어요\",\"also\":\"태교 · 태담\",\"heardFrom\":\"임신 기간이 지나갈 무렵이나 태어난 뒤에, 남이 아니라 스스로에게 가장 많이 하는 말이에요.\",\"point\":\"태교로 무엇을 했는지보다 그 기간을 어떻게 지냈는지가 남아요.\",\"what\":\"남들은 다 했다는데 나만 아무것도 못 한 것 같으시죠. 태교라는 말에는 서로 다른 것이 섞여 있어요. 음악이나 교재처럼 사서 하는 것도 있고, 아이에게 말을 걸고 잘 자고 잘 먹는 것처럼 생활에 가까운 것도 있어요. 못 했다고 느끼실 때 떠올리는 쪽은 대개 앞쪽이에요.\",\"known\":\"특정 음악이나 교재가 아이의 능력을 끌어올린다는 주장은 뒷받침이 약한 편이에요. 반면 임신 기간의 스트레스와 생활 습관에 대해서는 비교적 일관되게 이야기되는 것이 있어요. 못 했다고 느끼시는 목록과, 알려진 것이 있는 목록이 서로 다른 목록이에요.\",\"notAtHome\":\"지나간 기간이 아이에게 무엇을 남겼는지는 어떤 방법으로도 되짚어 알 수 없어요. 이 글도 검색도 알려줄 수 없는 자리예요.\",\"ask\":[\"남은 기간에 챙기면 좋을 생활 습관이 있을까요?\",\"제가 임신 중에 겪은 일 가운데 진료에서 알고 계셔야 할 것이 있을까요?\"],\"basis\":\"산전 관리 일반 권고 — 생활 습관과 스트레스 관리\"},{\"id\":\"f-gender-guess\",\"kind\":\"saying\",\"term\":\"배 모양이나 입덧으로 성별을 알 수 있대요\",\"also\":\"배가 뾰족하면 아들 · 입덧이 심하면 딸\",\"heardFrom\":\"배가 나오기 시작하면 가는 곳마다 듣게 돼요.\",\"what\":\"배가 뾰족하면 아들, 둥글면 딸이라거나, 입덧이 심하면 딸이라는 식으로 도는 말이에요. 태몽의 내용으로 가른다는 이야기도 같은 자리에 있어요.\",\"known\":\"배 모양은 아이의 자세와 위치, 산모의 체형과 배 근육에 따라 달라져요. 성별과 이어진다고 볼 만한 것은 확인된 바가 없어요. 입덧의 정도 역시 사람마다 크게 다르고, 어느 쪽이라고 가를 만큼 갈리지 않아요. 맞았다는 이야기가 유독 많이 남는 것은, 둘 중 하나를 고르는 말이라 절반은 맞기 때문이에요.\",\"notAtHome\":\"집에서 성별을 가늠할 방법은 없어요. 초음파로 본 것도 시기와 아이의 자세에 따라 달라져서, 한 번 듣고 나서 바뀌는 경우가 있어요.\",\"ask\":[\"오늘 본 것으로 성별을 어느 정도까지 말할 수 있는 시기인가요?\",\"다음에 다시 확인하게 되나요?\"],\"basis\":\"초음파 성별 확인 — 시기와 태아 자세에 따른 한계\"},{\"id\":\"f-spicy-skin\",\"kind\":\"saying\",\"term\":\"매운 걸 먹으면 아이 피부가 안 좋아진대요\",\"also\":\"초콜릿을 먹으면 검게 태어난다 · 흰 음식을 먹어라\",\"heardFrom\":\"집안 어른들에게 듣거나, 먹고 나서 스스로 마음에 걸릴 때 검색하게 돼요.\",\"what\":\"먹은 음식의 색이나 맛이 아이의 피부로 간다는 말이에요. 매운 것, 커피, 초콜릿, 검은 음식이 자주 거론돼요.\",\"known\":\"먹은 음식이 아이의 피부색을 정한다고 볼 만한 것은 확인된 바가 없어요. 피부가 예민해지는 것처럼 나중에 나타나는 것들은 여러 요인이 얽혀 있어서, 임신 중에 먹은 특정 음식 하나로 갈린다고 말하기 어려워요. 임신 중에 피하도록 권하는 음식 목록은 따로 있는데, 그 목록은 감염과 수은처럼 전혀 다른 이유로 만들어진 것이에요.\",\"notAtHome\":\"매운 것을 먹고 속이 쓰린 것은 느낄 수 있지만, 그것이 아이에게 무엇을 남기는지는 집에서 알 수 없어요.\",\"ask\":[\"요즘 먹는 것 중에 줄이거나 피해야 할 것이 있을까요?\",\"속이 쓰릴 때 먹어도 되는 약이 있을까요?\"],\"basis\":\"임신 중 식품 권고 — 감염·중금속을 기준으로 만들어진 목록\"},{\"id\":\"f-hair-dye\",\"kind\":\"saying\",\"term\":\"염색이나 파마를 하면 안 된대요\",\"also\":\"미용실 · 두피로 흡수\",\"heardFrom\":\"미용실에서 먼저 물어보기도 하고, 예약해 두고 마음이 걸려 검색하게 돼요.\",\"what\":\"머리에 쓰는 약제가 두피로 들어가 아이에게 간다는 말이에요. 매니큐어와 화장품에 대해서도 같은 이야기가 돌아요.\",\"known\":\"머리에 쓰는 약제가 두피로 흡수되는 양은 많지 않은 것으로 이야기돼요. 그래서 널리 금지되는 것으로 다루지는 않아요. 다만 이 영역은 사람을 대상으로 한 자료가 넉넉하지 않아 권고가 조심스러운 쪽으로 쓰여 있고, 임신 초기를 피하고 환기가 되는 곳에서 짧게 하도록 권하는 이야기가 흔해요.\",\"notAtHome\":\"제품마다 성분이 달라서 성분표만 보고 집에서 가를 수 없어요.\",\"ask\":[\"임신 중에 피해야 할 성분이 따로 있나요?\",\"지금 시기에 해도 되는지 시기로 나뉘는 부분이 있나요?\"],\"basis\":\"임신 중 화학물질 노출 권고 — 자료가 제한적인 영역\"},{\"id\":\"f-taboo-tools\",\"kind\":\"saying\",\"term\":\"가위질이나 못질, 이사를 하면 안 된대요\",\"also\":\"집수리 · 못을 박으면 안 된다 · 임신 중 이사\",\"heardFrom\":\"집안 어른들에게 듣는 경우가 많아요. 지역마다 조금씩 다르게 전해져요.\",\"what\":\"임신 중에 가위질이나 못질을 하면 아이 몸에 표가 난다거나, 이사나 집수리를 하면 안 된다는 말이에요.\",\"known\":\"이런 금기가 아이의 몸에 무엇을 남긴다고 볼 만한 것은 확인된 바가 없어요. 다만 이 말들이 남아 있는 자리에는, 임신부가 무거운 것을 들거나 높은 데 올라가거나 오래 서 있지 않게 하려던 뜻이 함께 있어요. 넘어질 수 있는 일과 무리한 활동을 줄이는 것은 지금도 권해지는 쪽이에요. 말의 근거는 없어도 그 말이 막으려던 것은 남아 있는 셈이에요.\",\"notAtHome\":\"이미 한 일이 무엇을 남겼는지는 되짚어 알 수 없어요.\",\"ask\":[\"제가 지금 하는 일 중에 몸으로 하는 것 가운데 줄여야 할 것이 있을까요?\",\"이사를 앞두고 있는데 진료 일정을 어떻게 맞추면 좋을까요?\"],\"basis\":\"전통 금기 · 임신 중 활동 권고 — 낙상과 무리한 활동을 줄이는 쪽\"},{\"id\":\"f-funeral\",\"kind\":\"saying\",\"term\":\"임신 중에 장례식에 가면 안 된대요\",\"also\":\"부정 탄다 · 상가에 가지 마라\",\"heardFrom\":\"가야 할 자리가 생겼을 때 가족에게 듣게 돼요.\",\"what\":\"임신 중에 상가에 가면 안 된다는 말이에요. 가더라도 절을 하지 말라거나 붉은 것을 지니라는 이야기가 따라붙어요.\",\"known\":\"상가에 가는 것 자체가 아이에게 무엇을 남긴다고 볼 만한 것은 확인된 바가 없어요. 실제로 이야기되는 부분은 다른 쪽이에요. 오래 서 있고 늦게까지 있게 되는 자리라는 것, 사람이 많이 모이는 곳이라 감염이 도는 시기에는 다르게 볼 수 있다는 것이에요. 가족 사이에서 이 일은 대개 근거의 문제가 아니라 마음의 문제로 남아요.\",\"notAtHome\":\"가는 것이 나에게 무리인지 아닌지는 지금 몸 상태와 임신의 경과를 함께 봐야 해서, 이 글로는 정할 수 없어요.\",\"ask\":[\"오래 서 있거나 멀리 다녀오는 일정을 지금 시기에 잡아도 될까요?\",\"다녀온 뒤에 살펴야 할 것이 있을까요?\"],\"basis\":\"전통 금기 · 임신 중 활동과 감염 노출에 대한 일반 권고\"},{\"id\":\"f-ultrasound-often\",\"kind\":\"saying\",\"term\":\"초음파를 자주 보면 아이에게 안 좋대요\",\"also\":\"초음파 횟수 · 입체초음파\",\"heardFrom\":\"진료를 자주 받게 될 때나, 기념 초음파를 예약할 때 듣게 돼요.\",\"point\":\"임신 중에 쓰는 초음파는 방사선이 아니에요. 엑스레이나 CT와는 다른 방식이에요.\",\"what\":\"초음파를 여러 번 보면 아이에게 무엇이 쌓인다는 말이에요. 방사선과 헷갈려서 생긴 이야기인 경우가 많아요.\",\"known\":\"지금까지 알려진 범위에서, 진료로 보는 초음파가 아이에게 남기는 것으로 확인된 바는 없어요. 다만 여러 나라의 권고는 필요할 때 필요한 만큼 보도록 쓰여 있고, 기념으로 오래 보는 것은 조심스럽게 다뤄요. 이유는 위험이 확인되어서가 아니라, 의료 목적이 아닌 노출을 굳이 늘릴 까닭이 없다는 쪽이에요.\",\"notAtHome\":\"몇 번이 적당한지는 임신의 경과와 확인해야 할 것에 따라 달라져서, 집에서 횟수를 세어 가늠할 수 있는 것이 아니에요.\",\"ask\":[\"제 경우에 초음파를 이 간격으로 보는 이유가 무엇인가요?\",\"다음에는 무엇을 확인하려고 보는 건가요?\"],\"basis\":\"산과 초음파 권고 — 비전리 방식, 의료 목적 사용\"},{\"id\":\"f-emf-apron\",\"kind\":\"saying\",\"term\":\"전자파 차단 앞치마를 입어야 한대요\",\"also\":\"전자파 담요 · 전자레인지 · 노트북\",\"heardFrom\":\"임신 축하 선물로 받거나, 광고와 카페 글에서 보게 돼요.\",\"what\":\"가전제품과 휴대전화에서 나오는 것을 막아 준다는 옷과 담요예요. 전자레인지 앞에 서지 말라거나 노트북을 배 위에 두지 말라는 이야기와 함께 돌아요.\",\"known\":\"일상에서 쓰는 가전이 내는 정도가 임신에 무엇을 남긴다고 볼 만한 것은 확인된 바가 없어요. 앞치마가 그것을 막아 무엇을 달라지게 한다는 것도 마찬가지예요. 이 물건은 필요가 확인되어 만들어졌다기보다, 불안이 놓인 자리에 들어온 물건에 가까워요. 다만 일 때문에 특별한 장비를 다루는 경우는 생활 노출과 다른 이야기라서 따로 봐요.\",\"notAtHome\":\"우리 집이나 직장의 노출이 어느 정도인지는 앞치마로도 검색으로도 알 수 없어요.\",\"ask\":[\"제가 일에서 쓰는 장비나 작업 환경 중에 임신 중이라고 알려야 할 것이 있을까요?\",\"직장에서 확인을 요청할 수 있는 창구가 있나요?\"],\"basis\":\"생활 전자기장 노출 — 확인된 바가 없는 영역, 직업적 노출은 별도\"},{\"id\":\"f-dream-name\",\"kind\":\"saying\",\"term\":\"태몽이나 태명이 꼭 있어야 한대요\",\"also\":\"태몽을 못 꿨어요 · 태명 짓기\",\"heardFrom\":\"주변에서 태몽을 물어볼 때마다 듣게 돼요.\",\"what\":\"태몽을 꾸지 않았거나 누가 대신 꿔주지 않았다고 서운해하는 분들이 있어요. 태명을 아직 못 지었다고 마음이 급해지기도 해요.\",\"known\":\"태몽과 태명은 의료가 아니라 문화예요. 꾸었는지 아닌지가 임신의 경과와 이어진다고 볼 만한 것은 없어요. 다만 태명을 부르기 시작하면 배 속의 아이를 이름으로 부르게 되고, 그 호칭이 말을 걸기 쉽게 만들어 주는 면은 있어요. 태명이 늦어도 아이를 부르는 다른 말이 이미 있으면 그 역할은 그 말이 해요.\",\"notAtHome\":\"태몽을 꾸지 않은 것이 무엇을 뜻하는지는 어디서도 알 수 없어요. 뜻이 없기 때문이에요.\",\"ask\":[\"태명을 언제부터 부르기 시작할지 우리끼리 정해 볼까요?\",\"태몽 이야기가 부담이 될 때 가족에게 어떻게 말하면 좋을까요?\"],\"basis\":\"태몽·태명 — 문화적 관습\"},{\"id\":\"f-pregnancy-voucher\",\"kind\":\"system\",\"term\":\"임신확인서와 국민행복카드\",\"also\":\"임신·출산 진료비 지원 · 바우처\",\"heardFrom\":\"임신이 확인된 직후에 병원이나 주변에서 처음 듣게 돼요.\",\"point\":\"임신확인서를 받아 두는 것이 먼저예요. 나머지는 그다음이에요.\",\"what\":\"임신이 확인되면 병원에서 임신확인서를 받을 수 있어요. 그 서류로 임신·출산 진료비를 지원하는 카드를 신청해요. 이 카드로 산전 진찰과 분만에 드는 비용의 일부를 결제해요. 은행이나 카드사, 정부 민원 창구에서 신청해요.\",\"known\":\"국민건강보험이 운영하는 지원이에요. 지원 금액과 쓸 수 있는 범위, 사용 기한이 정해져 있고, 아이가 둘 이상인 임신은 따로 정해져 있어요. 신청해야 받는 것이라 저절로 생기지는 않아요.\",\"amounts\":[{\"item\":\"임신·출산 진료비\",\"value\":\"태아 한 명당 100만원\",\"note\":\"쌍둥이면 200만원처럼 태아 수만큼 늘어요\"},{\"item\":\"쓸 수 있는 기간\",\"value\":\"분만예정일에서 2년\"}],\"notAtHome\":\"우리가 얼마를 받고 언제까지 쓸 수 있는지는 신청하는 시점의 기준으로 정해져요. 검색으로 나온 예전 글의 금액과 다를 수 있어요.\",\"ask\":[\"임신확인서를 오늘 받을 수 있나요?\",\"이 병원에서 이 카드로 결제되는 항목은 어디까지인가요?\"],\"basis\":\"국민건강보험 임신·출산 진료비 지원\",\"asOf\":\"2025년 기준\",\"byRegion\":\"이 지원은 전국이 같아요. 지역마다 갈리는 것은 그 옆에 붙는 것들이에요 — 지자체가 따로 주는 임신 축하금, 교통비, 산전 검사비 보조가 시군구마다 달라요. 보건소에 임신 등록을 하러 가실 때 함께 물어보시면 한 번에 확인돼요.\",\"changes\":\"지원 금액과 사용 기한, 신청 창구가 바뀌어요. 국민건강보험공단이나 병원 원무과에서 지금 기준을 확인해 주세요.\"},{\"id\":\"f-badge-seat\",\"kind\":\"system\",\"term\":\"임산부 배지와 배려석\",\"also\":\"임산부 먼저 · 분홍색 자리\",\"heardFrom\":\"지하철을 타기 시작하면서 알게 돼요.\",\"what\":\"배가 나오기 전에도 알아볼 수 있게 하는 배지와, 대중교통의 분홍색 자리예요. 배지는 보건소나 지하철 역무실에서 받을 수 있어요. 지역에 따라 임신부에게 주는 다른 지원과 함께 안내하기도 해요.\",\"known\":\"배려로 운영되는 자리예요. 비켜 주도록 강제하는 규정이 아니라서, 앉아 있는 사람에게 말을 걸어야 하는 상황이 생겨요. 배지를 달았는데도 자리를 얻지 못하는 날이 있다는 이야기가 흔해요.\",\"notAtHome\":\"우리 지역에서 배지 말고 무엇을 더 주는지는 지역마다 달라서, 보건소에 물어야만 알 수 있어요.\",\"ask\":[\"배지 말고 임신부에게 주는 것이 또 있나요?\",\"우리 지역에서 임신부가 신청할 수 있는 지원이 있나요?\"],\"basis\":\"지자체 임산부 배려 사업\",\"asOf\":\"2025년 기준\",\"byRegion\":\"지역차가 큰 항목이에요. 배지를 주는 곳과 함께 주는 물품이 시군구마다 다르고, 임신부에게 주는 우대 사업 자체가 있는 곳과 없는 곳이 갈려요. 거주지 보건소에 한 번 전화해 보시는 것이 가장 빨라요.\",\"changes\":\"배부하는 곳과 함께 주는 물품이 지역마다, 해마다 달라요. 거주지 보건소에서 확인해 주세요.\"},{\"id\":\"f-prenatal-leave\",\"kind\":\"system\",\"term\":\"임신 중에 쓸 수 있는 휴가와 근로시간 단축\",\"also\":\"태아검진 시간 · 임신기 근로시간 단축\",\"heardFrom\":\"진료 때문에 자꾸 반차를 쓰게 될 때 찾아보게 돼요.\",\"point\":\"쓰겠다고 말하지 않으면 저절로 적용되지 않아요.\",\"what\":\"일하는 임신부가 쓸 수 있도록 법에 정해진 것이 둘 있어요. 하나는 산전 진찰을 받으러 가는 시간을 근무 시간 안에서 쓰는 것이고, 다른 하나는 임신 초기와 후기에 하루 근무 시간을 줄이는 것이에요. 이 때문에 임금을 깎지 못하도록 함께 정해져 있어요.\",\"known\":\"회사가 정하는 복지가 아니라 법에 정해진 것이에요. 다만 신청하는 방법과 내야 하는 서류는 회사마다 달라요. 말을 꺼내기 어려워 못 쓰는 경우가 많다는 이야기가 흔해요.\",\"amounts\":[{\"item\":\"근로시간 단축\",\"value\":\"하루 2시간\",\"note\":\"임신 12주 이내와 32주 이후에 쓸 수 있어요\"},{\"item\":\"단축했을 때 임금\",\"value\":\"깎지 못하도록 정해져 있어요\"},{\"item\":\"진찰 받으러 가는 시간\",\"value\":\"임신 28주까지 4주에 한 번\",\"note\":\"29~36주는 2주에 한 번, 37주부터는 한 주에 한 번\"}],\"notAtHome\":\"우리 회사에서 어떤 서류로 신청하는지는 취업규칙과 인사 담당자만 알아요.\",\"ask\":[\"진찰 시간을 근무 시간으로 쓰려면 어떤 서류가 필요한가요?\",\"근로시간 단축은 언제부터 언제까지 쓸 수 있나요?\"],\"basis\":\"근로기준법 — 태아검진 시간 및 임신기 근로시간 단축\",\"asOf\":\"2025년 기준\",\"byRegion\":\"법으로 정해진 것이라 전국이 같아요. 지역이 아니라 회사에 따라 갈리는 항목이에요 — 신청 서류와 절차는 회사마다 달라요.\",\"changes\":\"적용 시기와 대상이 개정으로 바뀌어요. 고용노동부 상담 창구나 회사 인사 담당자에게 지금 기준을 확인해 주세요.\"},{\"id\":\"f-maternity-leave\",\"kind\":\"system\",\"term\":\"출산전후휴가와 육아휴직은 언제 신청하나요\",\"also\":\"출산휴가 · 육아휴직 급여 · 배우자 출산휴가\",\"heardFrom\":\"출산이 다가오면서 회사에 언제 말할지 정해야 할 때 찾게 돼요.\",\"point\":\"둘은 다른 제도예요. 신청하는 곳도 기한도 달라요.\",\"what\":\"출산 전후로 쓰는 휴가와, 그 뒤에 이어 쓰는 육아휴직이 있어요. 휴가는 회사에 신청하고, 급여는 고용센터에 따로 신청하는 구조예요. 배우자가 쓰는 휴가도 따로 정해져 있어요.\",\"known\":\"기간과 급여, 신청 기한이 법으로 정해져 있어요. 기한을 넘겨 신청하면 받지 못하는 부분이 생길 수 있어서, 미리 날짜를 적어 두는 편이 나아요. 쓴다고 해서 불이익을 주지 못하도록 정해져 있지만, 실제로 겪는 어려움은 회사마다 달라요.\",\"amounts\":[{\"item\":\"출산전후휴가\",\"value\":\"90일\",\"note\":\"쌍둥이 이상은 120일. 출산 뒤에 45일(쌍둥이 60일)이 남도록 나눠 써요\"},{\"item\":\"배우자 출산휴가\",\"value\":\"20일\"},{\"item\":\"육아휴직\",\"value\":\"부모가 각각 1년\",\"note\":\"요건을 채우면 1년 6개월까지 쓰는 길이 있어요\"},{\"item\":\"육아휴직 급여 상한\",\"value\":\"첫 3개월 월 250만원\",\"note\":\"4~6개월은 200만원, 그 뒤는 160만원\"}],\"notAtHome\":\"우리가 얼마를 언제 받는지는 고용 형태와 근속 기간, 소득에 따라 달라져서 이 글로는 정할 수 없어요.\",\"ask\":[\"언제까지 신청해야 하나요?\",\"저희 경우에 어느 쪽부터 쓰는 것이 맞나요?\"],\"basis\":\"근로기준법 · 남녀고용평등법 — 출산전후휴가와 육아휴직\",\"asOf\":\"2025년 기준\",\"byRegion\":\"법으로 정해진 것이라 전국이 같아요. 다만 육아휴직을 쓰는 부모나 그 회사에 지자체가 따로 주는 지원금이 있는 곳이 있어요.\",\"changes\":\"기간과 급여, 배우자 휴가 일수가 개정으로 자주 바뀌어요. 고용노동부나 회사 인사 담당자에게 지금 기준을 확인해 주세요.\"},{\"id\":\"f-postpartum-center\",\"kind\":\"system\",\"term\":\"산후조리원은 꼭 가야 하나요\",\"also\":\"산후조리 · 산모신생아 건강관리사 · 공공산후조리원\",\"heardFrom\":\"예약이 일찍 마감된다는 말을 듣고 급해질 때 찾게 돼요.\",\"what\":\"출산 뒤 몇 주를 보내는 방식은 여럿이에요. 조리원에서 지내기도 하고, 집으로 오는 산모·신생아 건강관리사의 도움을 받기도 하고, 가족이 돌보기도 해요. 정부가 비용의 일부를 대는 가정 방문 지원이 따로 있고, 지자체가 운영하는 공공 산후조리원도 있어요.\",\"known\":\"어느 쪽이 낫다고 말할 수 있는 근거는 없어요. 고르는 기준은 대개 회복에 필요한 도움의 종류, 집의 사정, 비용이에요. 조리원에 가지 않은 것이 아이에게 무엇을 남긴다고 볼 만한 것도 없어요.\",\"notAtHome\":\"우리 지역에 어떤 지원이 있고 우리가 대상인지는 지역마다 달라서, 주민센터나 보건소에서만 확인할 수 있어요.\",\"ask\":[\"산모·신생아 건강관리 지원을 신청할 수 있는 대상인가요?\",\"우리 지역에 공공 산후조리원이 있나요?\"],\"basis\":\"산모·신생아 건강관리 지원사업 · 지자체 공공 산후조리원\",\"asOf\":\"2025년 기준\",\"byRegion\":\"지역차가 가장 큰 항목이에요. 소득 기준을 넘어도 지자체가 자기 예산으로 지원하는 곳이 있고, 공공 산후조리원이 있는 시군구와 없는 곳이 갈려요. 이용할 수 있는 기간과 본인이 내는 돈도 지역마다 달라요. 이건 검색보다 주민센터에 묻는 편이 정확해요.\",\"changes\":\"지원 대상과 금액, 신청 기한이 해마다 바뀌어요. 거주지 보건소나 주민센터에서 확인해 주세요.\"},{\"id\":\"f-cord-blood\",\"kind\":\"system\",\"term\":\"제대혈을 보관해야 하나요\",\"also\":\"제대혈 은행 · 가족 보관 · 기증\",\"heardFrom\":\"임신 후반에 상담 전화를 받거나, 병원에 놓인 안내물로 보게 돼요.\",\"point\":\"이건 의료 결정이기 전에 계약이에요. 파는 쪽의 설명만으로 정하지 않는 편이 나아요.\",\"what\":\"태어날 때 탯줄과 태반에 남는 피를 얼려 보관하는 것이에요. 우리 아이를 위해 돈을 내고 맡기는 방식과, 필요한 사람이 쓸 수 있도록 기증하는 방식이 있어요. 법으로 관리되는 영역이라 허가받은 기관만 할 수 있어요.\",\"known\":\"제대혈이 실제로 쓰이는 병은 정해져 있고 그 범위가 넓지는 않아요. 내 아이가 나중에 자기 제대혈을 쓰게 될 가능성은 낮은 편으로 이야기돼요. 여러 나라의 학회는 개인 보관을 일반적으로 권하지 않고 기증 쪽에 서 있는데, 가족 중에 관련된 병이 있는 경우는 다르게 봐요. 판매 상담에서는 이 구분이 잘 드러나지 않는 경우가 있어요.\",\"amounts\":[{\"item\":\"가족 보관 비용\",\"value\":\"업체와 보관 기간에 따라 크게 달라요\",\"note\":\"계약 기간이 끝난 뒤의 비용도 함께 물어보세요\"},{\"item\":\"기증\",\"value\":\"비용이 들지 않아요\"}],\"notAtHome\":\"우리 가족에게 다르게 볼 만한 사정이 있는지는 가족력과 함께 봐야 해서, 안내물만으로는 가를 수 없어요.\",\"ask\":[\"우리 가족력 중에 제대혈 보관을 다르게 볼 만한 것이 있나요?\",\"기증하는 방법도 알려주실 수 있나요?\"],\"basis\":\"제대혈 관리 및 연구에 관한 법률 · 각국 학회의 개인 보관 권고\",\"asOf\":\"2025년 기준\",\"byRegion\":\"법으로 관리되는 제도라 전국이 같아요. 지역마다 다른 것은 기증할 수 있는 곳이에요 — 기증을 받는 은행과 협약된 분만 병원이 지역마다 달라서, 분만할 병원이 협약 기관인지 미리 확인해야 해요.\",\"changes\":\"보관 기관과 비용, 계약 조건이 업체마다 다르고 자주 바뀌어요. 계약 전에 허가받은 기관인지 보건복지부 쪽에서 확인해 주세요.\"},{\"id\":\"f-birth-report\",\"kind\":\"system\",\"term\":\"출생신고는 언제까지 하나요\",\"also\":\"출생증명서 · 출생통보제 · 정부24\",\"heardFrom\":\"퇴원할 때 병원에서 서류를 받으면서 처음 듣게 돼요.\",\"point\":\"기한이 정해져 있어요. 넘기면 과태료가 붙어요.\",\"what\":\"아이가 태어나면 정해진 기간 안에 출생신고를 해요. 주민센터에 가거나 온라인으로 해요. 병원에서 받은 출생증명서가 필요하고, 아이 이름을 정해서 가야 해요. 병원이 출생 사실을 먼저 알리는 제도가 함께 운영되고 있지만, 그것이 출생신고를 대신하지는 않아요.\",\"known\":\"가족관계등록법에 기한이 정해져 있어요. 출생신고가 되어야 아동수당 같은 다른 신청이 이어져요. 그래서 이 하나가 늦으면 뒤의 것이 다 늦어져요.\",\"amounts\":[{\"item\":\"신고 기한\",\"value\":\"태어난 날부터 한 달 안에\"},{\"item\":\"기한을 넘기면\",\"value\":\"과태료\",\"note\":\"얼마나 늦었는지에 따라 금액이 달라져요\"}],\"notAtHome\":\"필요한 서류는 가족 상황에 따라 달라져서, 우리 경우에 무엇이 더 필요한지는 주민센터에서만 알 수 있어요.\",\"ask\":[\"출생증명서는 언제 받을 수 있나요?\",\"저희 경우에 출생신고에 더 필요한 서류가 있나요?\"],\"basis\":\"가족관계의 등록 등에 관한 법률 — 출생신고\",\"asOf\":\"2025년 기준\",\"byRegion\":\"출생신고 자체는 전국이 같아요. 지역마다 다른 것은 그 자리에서 함께 신청할 수 있는 항목이에요. 주민센터에서 저희 지역에서 같이 신청되는 것을 전부 알려달라고 하시면 걸음을 아껴요.\",\"changes\":\"기한과 온라인 신고 방법, 함께 신청되는 항목이 바뀌어요. 주민센터나 정부24에서 확인해 주세요.\"},{\"id\":\"f-birth-benefits\",\"kind\":\"system\",\"term\":\"첫만남이용권과 부모급여, 아동수당\",\"also\":\"출산 지원금 · 복지로 · 행복출산 원스톱\",\"heardFrom\":\"출생신고를 하러 가기 전에 무엇을 챙겨야 하는지 찾아보게 돼요.\",\"point\":\"출생신고를 하러 갈 때 한 번에 같이 신청할 수 있는 것이 있어요. 미리 물어보시면 걸음을 아껴요.\",\"what\":\"아이가 태어나면 받을 수 있는 것이 여럿이에요. 태어난 직후 한 번 주는 것, 매달 주는 것, 아이 나이에 따라 주는 것이 섞여 있어요. 지자체가 따로 주는 것도 있어요. 주민센터나 온라인 복지 창구에서 신청해요.\",\"known\":\"모두 신청해야 받는 것이에요. 늦게 신청하면 지난 달치를 못 받는 경우가 있어요. 대부분 출생신고와 함께 한 번에 신청할 수 있게 묶여 있어서, 그 자리에서 다 물어보는 것이 가장 확실해요.\",\"amounts\":[{\"item\":\"첫만남이용권\",\"value\":\"첫째 200만원 · 둘째부터 300만원\",\"note\":\"태어난 뒤 한 번, 바우처로 줘요\"},{\"item\":\"부모급여\",\"value\":\"0세는 월 100만원 · 1세는 월 50만원\"},{\"item\":\"아동수당\",\"value\":\"월 10만원\",\"note\":\"만 8세가 되기 전까지\"}],\"notAtHome\":\"우리가 받을 수 있는 것과 금액은 아이의 나이와 거주지, 다른 지원과의 관계에 따라 달라져서 이 글로는 정할 수 없어요.\",\"ask\":[\"출생신고와 같이 신청할 수 있는 것을 전부 알려주실 수 있나요?\",\"우리 지역에서 따로 주는 것이 있나요?\"],\"basis\":\"아동수당법 및 관련 지원 사업\",\"asOf\":\"2025년 기준\",\"byRegion\":\"위 셋은 전국이 같아요. 지역차가 큰 것은 그 옆에 붙는 지자체 출산장려금이에요. 몇십만 원인 곳부터 수백만 원인 곳까지 갈리고, 여러 해에 걸쳐 나눠 주거나 그 지역에 계속 살아야 하는 조건이 붙는 곳도 있어요. 주민센터에서 우리 지역 것을 따로 확인해 주세요.\",\"changes\":\"이름과 금액, 대상 나이가 해마다 바뀌고 새로 생기거나 없어지기도 해요. 주민센터나 온라인 복지 창구에서 지금 기준을 확인해 주세요.\"},{\"id\":\"f-episiotomy\",\"kind\":\"saying\",\"term\":\"회음부 절개는 꼭 하나요\",\"also\":\"회음절개 · 회음부 열상 · 꿰맨다\",\"heardFrom\":\"출산이 가까워질 때 먼저 겪은 사람들에게 듣게 돼요.\",\"what\":\"아이가 나오는 길을 넓히려고 회음부를 미리 가위로 자르는 것이에요. 하지 않아도 저절로 찢어지는 경우가 있고, 그때도 꿰매요.\",\"known\":\"예전에는 거의 모든 출산에서 미리 했지만, 지금은 모두에게 하도록 권하지 않는 쪽으로 여러 나라의 권고가 바뀌었어요. 필요하다고 보는 상황이 어떤 것인지는 분만이 진행되는 모습을 보고 그 자리에서 정해져요. 병원마다 하는 비율이 다르다는 이야기도 있어요.\",\"notAtHome\":\"할지 말지를 미리 정해 둘 수 있는 것이 아니에요. 아이의 자세와 진행에 따라 달라져요.\",\"ask\":[\"이 병원은 회음부 절개를 어떤 경우에 하나요?\",\"제 뜻을 미리 말해 두면 어디까지 반영될 수 있나요?\"],\"basis\":\"분만 권고 — 모두에게 시행하던 방식에서 필요할 때만 시행하는 쪽으로\"},{\"id\":\"f-colostrum\",\"kind\":\"saying\",\"term\":\"초유는 언제부터 나오나요\",\"also\":\"초유 · 젖이 안 도는 것 같아요\",\"heardFrom\":\"출산이 가까워질 때, 그리고 태어난 첫 며칠에 가장 많이 찾게 돼요.\",\"what\":\"출산 전후에 처음 나오는 진하고 노란 젖이에요. 임신 중에 이미 조금씩 비치는 사람도 있고, 태어난 뒤에 나오기 시작하는 사람도 있어요. 양이 아주 적어서 나오지 않는 것처럼 느껴지는 경우가 많아요.\",\"known\":\"처음 며칠 동안 양이 적은 것은 흔히 이야기되는 모습이에요. 아이의 위가 아주 작은 시기라 적은 양으로 시작하도록 되어 있다고 설명해요. 다만 아이가 잘 먹고 있는지는 젖의 양으로 가늠하지 않고, 소변과 대변, 체중 변화로 함께 봐요.\",\"notAtHome\":\"젖이 얼마나 나오는지 눈으로 재서 아이가 충분히 먹었는지 가늠할 수 없어요. 그건 병원에서 아이를 함께 봐야 알 수 있어요.\",\"ask\":[\"아이가 잘 먹고 있는지 무엇으로 보나요?\",\"젖이 도는 것 같지 않은데 지금 해볼 수 있는 것이 있을까요?\"],\"basis\":\"수유 초기 — 초유의 양과 수유 평가 지표\"},{\"id\":\"f-second-child-ask\",\"kind\":\"saying\",\"term\":\"둘째는 언제 낳니\",\"also\":\"하나는 외롭다 · 터울 · 빨리 낳아야 한다\",\"heardFrom\":\"첫아이가 돌을 지날 무렵부터, 그리고 임신 소식을 알렸을 때 \\\"다음은\\\"으로 다시 듣게 돼요.\",\"what\":\"첫째를 두고 둘째를 재촉하거나, 하나만 키우면 외롭다거나, 나이가 있으니 빨리 낳아야 한다는 말이에요. 임신 중에 \\\"다음은 아들\\\"로 이어지기도 해요.\",\"known\":\"아이를 몇 명 언제 낳을지는 부부가 정하는 일이고, 그 결정에는 몸 상태, 일, 돈, 돌봐 줄 사람이 다 들어가요. 하나만 키우면 외롭다는 말은 널리 돌지만 형제의 유무가 아이의 성격이나 관계를 정한다고 볼 만한 것은 확인된 바가 없어요. 터울과 나이를 두고 의료진이 이야기하는 부분은 따로 있고, 그것은 검진에서 내 몸을 보고 듣는 이야기예요. 이 말은 대개 관심의 서툰 모양이고, 그 자리에서 설명할 의무는 없어요.\",\"notAtHome\":\"둘째를 가질 수 있는지, 언제가 몸에 맞는지는 어른들의 말로도 검색으로도 알 수 없어요. 생각이 있다면 검진에서 내 경우를 물어보는 것이 맞아요.\",\"ask\":[\"둘째를 생각한다면 몸으로 볼 때 언제쯤이 좋을까요?\",\"이번 임신에서 겪은 것 중 다음에 영향을 주는 것이 있나요?\"],\"basis\":\"가족 계획은 부부의 결정 — 터울과 몸의 조건은 의료진과 보는 영역\"},{\"id\":\"f-seaweed-soup\",\"kind\":\"saying\",\"term\":\"산후에는 미역국을 삼시 세끼 먹어야 한다\",\"also\":\"미역국 · 산후 음식 · 가물치 · 호박\",\"heardFrom\":\"출산을 앞두고, 그리고 산후조리를 하는 집에서 매 끼니마다 듣게 돼요.\",\"what\":\"출산 뒤 몇 주 동안 끼니마다 미역국을 먹어야 몸이 풀리고 젖이 돈다는 말이에요. 집안에 따라 가물치나 호박처럼 꼭 먹어야 하는 것이 따로 있기도 해요.\",\"known\":\"산후에 수분과 영양을 충분히 먹는 것은 지금도 권하는 쪽이에요. 미역국은 따뜻하고 소화가 쉬워 그 자리에 오래 있었어요. 다만 한 가지 음식을 끼니마다 먹어야 하는 것은 아니고, 미역에 든 요오드를 두고는 지나치게 많이 먹는 것을 조심스럽게 보는 이야기도 있어요. 젖이 도는 것은 음식 한 가지보다 자주 먹이는 것과 몸의 회복에 더 이어져 있다고 봐요. 특정 음식이 꼭 필요하다고 볼 만한 것은 확인된 바가 없어요.\",\"notAtHome\":\"산후에 무엇을 얼마나 먹어야 하는지는 몸 상태와 수유 여부에 따라 달라서, 집안의 관습으로 정할 수 있는 것이 아니에요. 갑상선 쪽 이야기를 들은 적이 있으면 미역의 양은 따로 물어봐요.\",\"ask\":[\"산후에 챙겨 먹으면 좋은 것과 줄이면 좋은 것이 있을까요?\",\"미역국을 매끼 먹어도 되는지, 갑상선 쪽으로 볼 것이 있을까요?\"],\"basis\":\"산후 영양 — 특정 음식이 아니라 전체 섭취로 보는 관점\"},{\"id\":\"f-birth-registration-solo\",\"kind\":\"system\",\"term\":\"혼자 낳으면 출생신고는 어떻게 하나요\",\"also\":\"출생신고 · 혼인 외 출생 · 아이 성 · 인지\",\"heardFrom\":\"혼자 출산을 준비하면서, 또는 낳은 뒤 주민센터에서 듣게 돼요.\",\"point\":\"낳은 사람이 혼자 할 수 있어요. 아이는 낳은 사람의 성과 본을 따르고, 상대가 아버지로 등록되려면 따로 인지라는 절차가 있어요.\",\"what\":\"혼인하지 않은 상태에서 낳으면 낳은 사람이 혼자 출생신고를 할 수 있고, 아이는 낳은 사람의 성과 본을 따라요. 상대를 아버지로 올리려면 상대가 인지하거나, 안 하면 법원에 인지 청구를 할 수 있어요. 인지가 되면 양육비를 청구할 수 있는 바탕이 생겨요. 출생신고는 태어난 날부터 한 달 안에 해요.\",\"known\":\"인지는 아이의 권리이기도 해서, 상대가 피하더라도 법원을 통해 할 수 있어요. 인지가 되어도 친권과 양육권은 낳은 사람에게 있는 것이 보통이고, 상대가 아이를 만나는 것은 따로 정해요. 출생신고 뒤 한부모가족 등록, 아동수당·부모급여 신청이 이어지는데 이것들은 혼인 여부와 상관없어요. 미혼 한부모를 위한 거점기관이 지역마다 있어 서류와 절차를 함께 봐 줘요.\",\"notAtHome\":\"우리 경우에 인지를 청구할지, 언제 할지는 상대와의 관계와 앞으로의 양육비·만남을 함께 보고 정할 일이라 글로 가를 수 없어요. 미혼모 거점기관이나 법률구조공단에서 우리 경우를 물어보는 것이 맞아요.\",\"basis\":\"가족관계등록법 — 출생신고 · 민법 — 인지\",\"byRegion\":\"절차는 전국이 같아요. 미혼 한부모 거점기관과 지자체의 지원이 지역마다 달라요.\",\"changes\":\"출생신고 절차(출생통보제 등)와 지원이 바뀌고 있어요. 주민센터나 거점기관에서 지금 기준을 확인해 주세요.\",\"asOf\":\"2026년 기준\",\"ask\":[\"출생신고 때 상대를 올리지 않으면 나중에 어떻게 되나요?\",\"인지 청구는 언제 하는 것이 좋고 어디에 물어보면 되나요?\"],\"amounts\":[{\"item\":\"출생신고\",\"value\":\"태어난 날부터 한 달 안\",\"note\":\"거주지 주민센터 · 온라인\"},{\"item\":\"상담\",\"value\":\"미혼 한부모 거점기관 · 법률구조공단 132\",\"note\":\"지역마다 기관이 달라요\"}]}],\"babyFacts\":[{\"id\":\"fb-cold-hands\",\"kind\":\"saying\",\"term\":\"손발이 차가운데 추운 건가요\",\"also\":\"몇 겹 입혀야 하나요 · 속싸개 · 양말\",\"heardFrom\":\"신생아를 처음 안아 본 날부터, 그리고 어른들이 손을 만져 보고 한마디 할 때마다 듣게 돼요.\",\"point\":\"손발의 온도로는 아이가 추운지 알 수 없어요. 만져 보는 자리를 바꾸면 달라 보여요.\",\"what\":\"아기 손발이 유독 차서 춥게 해 놓은 것 같아 마음이 쓰이시죠. 어른들이 만져 보고 한 겹 더 입히라고 하는 자리이기도 해요.\",\"known\":\"어린 아기는 몸의 중심에서 먼 손발이 늦게 따뜻해져요. 그래서 손발만 만지면 실제보다 차게 느껴져요. 옷을 정하는 기준으로는 어른이 입은 것에 한 겹 더 정도를 흔히 이야기하고, 지나치게 덥게 하는 것도 권하지 않아요. 두껍게 싸서 재우는 것은 오히려 조심스럽게 다뤄지는 영역이 있어요.\",\"notAtHome\":\"손발을 만져 보는 것으로는 몸이 더운지 추운지 가를 수 없어요. 옷을 정하는 것은 방의 온도와 아이의 모습을 함께 보고 하는 일이라, 만져 본 느낌 하나로 정하지 않는 편이 나아요.\",\"ask\":[\"아이 방 온도와 옷을 어느 정도로 하면 좋을까요?\",\"속싸개는 언제까지 쓰는 것이 좋을까요?\"],\"basis\":\"신생아 체온 조절 — 말초 순환의 특성\"},{\"id\":\"fb-navel-coin\",\"kind\":\"saying\",\"term\":\"배꼽이 튀어나왔는데 동전을 붙이면 되나요\",\"also\":\"배꼽 탈장 · 배꼽에 반창고 · 동전 붙이기\",\"heardFrom\":\"우는 아이의 배꼽이 볼록 나오는 것을 보고, 어른들에게 듣거나 검색하게 돼요.\",\"point\":\"눌러 붙여 두는 방법은 권해지지 않아요. 테이프와 눌린 자리 때문에 피부가 상하는 일이 이야기돼요.\",\"what\":\"울 때 배꼽이 볼록 나오는 것을 보고 동전이나 단추를 붙여 눌러 두라는 말을 듣게 돼요. 지금도 하는 집이 있어요.\",\"known\":\"눌러 붙여 두는 방법이 도움이 된다고 볼 만한 것은 확인된 바가 없어요. 오히려 피부가 짓무르거나 상하는 쪽이 더 자주 이야기돼요. 이 영역은 시간이 지나면서 달라지는 경우가 많아 지켜보는 쪽으로 다루는데, 언제까지 지켜볼지와 어느 시점에 다르게 볼지는 아이를 직접 보고 정해요.\",\"notAtHome\":\"지금 상태가 지켜봐도 되는 것인지 아닌지는 크기를 눈으로 보는 것만으로 가를 수 없어요.\",\"ask\":[\"지금은 지켜보는 것이 맞을까요? 다시 보여드려야 하는 때가 있나요?\",\"집에서 하지 말아야 할 것이 있나요?\"],\"callNow\":\"튀어나온 부분이 들어가지 않으면서 아이가 심하게 울고, 그 자리의 색이 변하거나 토하고 축 처져요.\",\"basis\":\"제대 탈장 — 경과 관찰 권고\"},{\"id\":\"fb-leg-wrap\",\"kind\":\"saying\",\"term\":\"다리를 곧게 하려고 싸매야 하나요\",\"also\":\"O자 다리 · 다리 펴서 싸기 · 속싸개\",\"heardFrom\":\"속싸개를 쓰기 시작할 때 어른들에게 듣게 돼요.\",\"point\":\"다리를 곧게 펴서 단단히 싸는 방식은 엉덩관절 쪽에서 조심스럽게 다뤄져요.\",\"what\":\"아기 다리가 벌어져 있어서 곧게 펴서 싸 두면 다리 모양이 좋아진다는 말이에요.\",\"known\":\"어린 아기의 다리가 바깥으로 굽어 보이는 것은 자라면서 달라지는 흔한 모습으로 이야기돼요. 반대로 다리를 펴서 단단히 싸는 방식은 엉덩관절이 자리 잡는 데 좋지 않게 보는 쪽이 많아요. 싸개를 쓰더라도 다리 쪽은 움직일 수 있게 헐렁하게 두도록 권하는 것이 흔해요.\",\"notAtHome\":\"다리 모양만 보고 지켜볼 것인지 아닌지는 집에서 가를 수 없어요. 엉덩관절은 겉으로 보이지 않는 자리라 검진에서 따로 봐요.\",\"ask\":[\"속싸개를 쓸 때 다리는 어떻게 두는 것이 좋을까요?\",\"엉덩관절은 언제 따로 확인하나요?\"],\"basis\":\"속싸개 사용 권고 — 하지 자유도와 엉덩관절 발달\"},{\"id\":\"fb-shave-hair\",\"kind\":\"saying\",\"term\":\"배냇머리를 밀면 숱이 많아지나요\",\"also\":\"눈썹을 밀면 진해진다 · 백일 배냇머리\",\"heardFrom\":\"백일 무렵에 어른들에게 듣거나, 미용실에서 권하기도 해요.\",\"what\":\"배냇머리를 밀어 주면 나중에 머리숱이 많아지고, 눈썹을 밀면 진해진다는 말이에요.\",\"known\":\"머리카락이 나는 수와 굵기는 자라면서 정해지는 것이라, 미는 것으로 달라진다고 볼 만한 것은 확인된 바가 없어요. 밀고 난 뒤 새로 난 머리가 굵어 보이는 것은 잘린 단면이 뭉툭해서 그렇게 보이는 것으로 설명해요. 아기 피부는 얇아서, 미는 동안 생기는 상처 쪽이 더 자주 이야기돼요.\",\"notAtHome\":\"지금 숱이 적은 것이 나중에 어떻게 될지는 아무도 알 수 없어요.\",\"ask\":[\"아기 피부에 면도기를 대도 되는 시기인가요?\",\"머리를 감기고 나서 살펴야 할 것이 있나요?\"],\"basis\":\"모발 성장 — 자르는 것과 굵기의 관계\"},{\"id\":\"fb-100days\",\"kind\":\"saying\",\"term\":\"백일의 기적은 진짜인가요\",\"also\":\"통잠 · 백일의 기절\",\"heardFrom\":\"밤에 자꾸 깨는 시기에 이 말을 붙들고 버티게 돼요.\",\"point\":\"오는 집도 있고 오지 않는 집도 있어요. 오지 않았다고 무엇을 잘못한 것이 아니에요.\",\"what\":\"백일 무렵부터 아이가 밤에 길게 잔다는 말이에요. 기다렸는데 오지 않으면 내가 뭘 잘못했나 싶어지죠.\",\"known\":\"이 무렵에 밤잠이 길어지는 아이가 있다는 것은 널리 이야기돼요. 낮과 밤의 리듬이 생기는 시기와 겹치기 때문이에요. 다만 시기와 정도는 아이마다 크게 달라서, 날짜에 맞춰 일어나는 일로 보기는 어려워요. 그 무렵 오히려 더 자주 깨는 아이도 흔해요. 기적이라는 말이 붙으면서, 오지 않은 집이 자기 탓을 하게 되는 면이 있어요.\",\"notAtHome\":\"우리 아이가 언제부터 길게 잘지는 미리 알 수 없어요.\",\"ask\":[\"지금 시기에 이만큼 깨는 것을 어떻게 보면 될까요?\",\"잠에 대해 지금 해볼 수 있는 것이 있을까요?\"],\"basis\":\"영아 수면 발달 — 밤낮 리듬이 생기는 시기의 개인차\"},{\"id\":\"fb-night-light\",\"kind\":\"saying\",\"term\":\"밤에 불을 켜두면 눈이 나빠지나요\",\"also\":\"수유등 · 근시 · 상야등\",\"heardFrom\":\"밤 수유 때문에 불을 켜 두게 되면서 찾아보게 돼요.\",\"what\":\"밤새 불을 켜 두면 아이 눈이 나빠지거나 잠을 잘 못 잔다는 말이에요.\",\"known\":\"밤에 켜 둔 불빛이 시력을 나빠지게 한다는 이야기는 오래전 한 보고가 알려진 뒤 널리 퍼졌는데, 뒤이은 연구에서는 그렇게 보기 어렵다는 쪽으로 정리됐어요. 다만 밝은 빛이 잠드는 리듬에 영향을 준다는 이야기는 따로 있어서, 밤에는 어둡게 두고 필요할 때만 낮은 조명을 쓰도록 권하는 편이에요.\",\"notAtHome\":\"우리 아이의 눈이 어떤지는 집에서 알 수 없어요. 눈은 아이가 말할 수 있게 되기 전에도 검진에서 따로 봐요.\",\"ask\":[\"눈은 언제 따로 확인하나요?\",\"밤 수유를 할 때 조명을 어떻게 하면 좋을까요?\"],\"basis\":\"야간 조명과 근시 — 초기 보고 이후 재검증된 영역 · 빛과 수면 리듬\"},{\"id\":\"fb-left-handed\",\"kind\":\"saying\",\"term\":\"왼손잡이를 바꿔줘야 하나요\",\"also\":\"손잡이 · 숟가락 바꿔 쥐여 주기\",\"heardFrom\":\"아이가 숟가락을 왼손으로 잡을 때 어른들이 옮겨 쥐여 주면서 시작돼요.\",\"what\":\"아이가 왼손을 자주 쓰면 오른손으로 바꿔 줘야 한다는 말이에요.\",\"known\":\"어느 손을 주로 쓰는지는 자라면서 정해지고, 확실해지는 시기는 아이마다 달라요. 바꾸도록 시키는 것이 아이에게 도움이 된다고 볼 만한 것은 확인된 바가 없어요. 오히려 억지로 바꾸는 과정에서 아이가 자기를 고쳐야 하는 것으로 받아들이는 면이 이야기돼요. 다만 아주 어린 시기에 한쪽 손만 뚜렷하게 쓰는 것은 다른 이유로 한 번 살펴보기도 해요.\",\"notAtHome\":\"지금 왼손을 자주 쓰는 것이 손잡이가 정해진 것인지 아직 오가는 중인지는 집에서 가를 수 없어요.\",\"ask\":[\"이 시기에 한쪽 손을 더 쓰는 것을 어떻게 보면 될까요?\",\"따로 살펴봐야 하는 경우가 있나요?\"],\"basis\":\"손 선호 발달 — 확립 시기의 개인차\"},{\"id\":\"fb-sweating\",\"kind\":\"saying\",\"term\":\"땀을 많이 흘리는데 약한 건가요\",\"also\":\"허약체질 · 잘 때 머리에 땀 · 식은땀\",\"heardFrom\":\"베개가 젖을 만큼 땀을 흘리는 것을 보고 어른들에게 듣게 돼요.\",\"what\":\"자는 동안 머리와 등이 흥건해서, 몸이 약한 것 아니냐는 말을 듣게 돼요.\",\"known\":\"어린아이가 잠들 무렵과 잠든 초반에 땀을 많이 흘리는 것은 흔히 이야기되는 모습이에요. 몸집에 견주어 땀샘이 많고, 체온을 내리는 방식이 어른과 달라서라고 설명해요. 허약체질이라는 말은 의학에서 쓰는 말이 아니에요. 다만 땀과 함께 다른 것이 같이 보이는 경우는 따로 살펴보기도 해요.\",\"notAtHome\":\"땀의 양만으로 몸 상태를 가늠할 수 없어요. 무엇을 함께 보아야 하는지는 아이를 직접 봐야 정해져요.\",\"ask\":[\"땀 말고 같이 살펴야 할 것이 있을까요?\",\"방 온도와 이불을 어떻게 하면 좋을까요?\"],\"basis\":\"소아 발한 — 체온 조절의 특성\"},{\"id\":\"fb-walker\",\"kind\":\"saying\",\"term\":\"보행기를 써도 되나요\",\"also\":\"걸음마 보조기 · 점퍼루 · 쏘서\",\"heardFrom\":\"선물로 받거나, 아이를 잠깐 앉혀 둘 곳이 필요할 때 찾게 돼요.\",\"point\":\"여러 나라가 권하지 않거나 판매를 막는 쪽으로 갔어요. 이유는 걸음이 아니라 사고예요.\",\"what\":\"아이를 앉혀 두면 발로 밀고 다니는 바퀴 달린 기구예요. 빨리 걷게 해 준다고 알려져 있어요.\",\"known\":\"빨리 걷게 만든다고 볼 만한 것은 확인된 바가 없고, 오히려 늦어질 수 있다는 이야기가 있어요. 더 크게 다뤄지는 것은 사고 쪽이에요. 계단에서 넘어지거나, 혼자서는 닿지 않던 높이에 손이 닿게 되면서 생기는 일 때문에 나라에 따라 판매를 막거나 쓰지 않도록 권해요. 바퀴가 없어 제자리에서만 움직이는 기구는 이와 나누어 이야기해요.\",\"notAtHome\":\"우리 집에서 안전한지는 문턱과 계단, 손 닿는 자리를 함께 봐야 해서 기구만 보고 가를 수 없어요.\",\"ask\":[\"이 시기에 걷기를 도우려면 무엇을 해 주면 좋을까요?\",\"이미 쓰고 있다면 어떻게 두는 것이 나을까요?\"],\"basis\":\"영아용 보행기 — 각국의 사용 권고와 손상 보고\"},{\"id\":\"fb-teeth-order\",\"kind\":\"saying\",\"term\":\"이가 늦게 나면 문제인가요\",\"also\":\"첫니 · 이 나는 순서 · 유치\",\"heardFrom\":\"또래 아이들 사진을 보다가, 또는 검진을 앞두고 찾아보게 돼요.\",\"what\":\"또래는 다 났는데 우리 아이만 아직이라 마음이 쓰이시죠. 나는 순서가 다르다고 마음에 걸린다는 이야기도 같이 돌아요.\",\"known\":\"첫니가 나는 시기는 아이마다 폭이 넓어요. 순서도 흔히 이야기되는 차례가 있을 뿐이라, 다른 차례로 나는 아이가 있어요. 늦게 나는 것 하나만 떼어 보기보다 함께 보이는 다른 것이 있는지를 같이 봐요. 이가 나기 시작하면 그때부터 닦아 주도록 권하고, 치과에 처음 가는 시기도 따로 이야기되고 있어요.\",\"notAtHome\":\"언제쯤 날지는 집에서 알 수 없어요. 잇몸을 눌러 보는 것으로 앞당길 수 있는 것도 아니에요.\",\"ask\":[\"이 시기에 아직 안 난 것을 어떻게 보면 될까요?\",\"치과는 언제 처음 가는 것이 좋을까요?\"],\"basis\":\"유치 맹출 — 시기와 순서의 개인차\"},{\"id\":\"fb-formula-water\",\"kind\":\"saying\",\"term\":\"분유는 어떤 물에 어떻게 타나요\",\"also\":\"생수로 타도 되나요 · 물 온도 · 타 놓은 분유\",\"heardFrom\":\"첫 수유를 준비하면서, 그리고 외출할 때마다 다시 찾게 돼요.\",\"point\":\"제품마다 표시가 달라요. 통에 적힌 방법이 먼저예요.\",\"what\":\"생수로 타도 되는지, 끓였다 식힌 물을 써야 하는지, 어느 정도로 식혀서 타는지 묻게 돼요.\",\"known\":\"분유 가루는 완전히 무균 상태인 것으로 다루지 않아요. 그래서 국제 기구가 내놓은 조제 방법에는 끓인 물을 지나치게 식히기 전에 타고, 먹이기 전에 알맞게 식히도록 되어 있어요. 다만 제품과 나라에 따라 표시가 다르고, 아이의 상태에 따라 다르게 안내받는 경우도 있어요. 타 놓은 것을 오래 두지 않는 것은 공통으로 이야기돼요.\",\"notAtHome\":\"우리가 쓰는 제품에 맞는 방법은 통에 적힌 표시와 담당 의료진만 알아요. 물의 종류도 지역과 아이 상태에 따라 다르게 안내받는 경우가 있어요.\",\"ask\":[\"저희가 쓰는 분유는 어떤 물로 어떻게 타는 것이 맞나요?\",\"타 놓은 것을 얼마나 두어도 되나요?\"],\"basis\":\"분유 조제 권고 — 국제 기구 지침 및 제품 표시\"},{\"id\":\"fb-engorgement\",\"kind\":\"saying\",\"term\":\"젖몸살이 왔어요 · 단유는 어떻게 하나요\",\"also\":\"울혈 · 젖 말리기 · 젖몸살 마사지\",\"heardFrom\":\"젖이 도는 며칠 사이와, 수유를 끝내기로 정한 무렵에 혼자 검색하게 돼요.\",\"point\":\"가슴이 붉어지고 열이 나면서 몸살처럼 아프면 스스로 풀지 않고 연락해요.\",\"what\":\"젖이 고여 가슴이 단단해지고 아픈 것을 젖몸살이라고 불러요. 수유를 끝내는 과정을 단유라고 해요. 둘 다 산모의 몸이 겪는 일인데 이야기할 자리가 마땅치 않아서 혼자 찾아보게 되는 영역이에요.\",\"known\":\"고인 젖을 비우는 것과 아픈 자리를 다루는 방법에 대해서는 널리 안내되는 것이 있어요. 단유는 한 번에 끊기보다 서서히 줄이도록 권하는 쪽이 많은데, 사정에 따라 다르게 하는 경우도 있어요. 붉어지고 열이 나는 경우는 나누어 봐서, 그때는 집에서 스스로 풀지 않아요.\",\"notAtHome\":\"지금 아픈 것이 고여서인지 다른 것인지는 집에서 가를 수 없어요. 인터넷의 마사지 방법을 그대로 따라 하다가 늦어지는 경우가 있어요.\",\"ask\":[\"지금 아픈 것을 어떻게 보면 될까요?\",\"단유를 하려면 어떤 속도로 줄이는 것이 좋을까요?\"],\"callNow\":\"가슴이 붉어지고 열이 나면서 몸살처럼 아프거나, 아픈 자리가 점점 넓어져요.\",\"basis\":\"수유기 유방 울혈과 단유 — 일반 권고\"},{\"id\":\"fb-water-when\",\"kind\":\"saying\",\"term\":\"물은 언제부터 먹여도 되나요\",\"also\":\"보리차 · 더울 때 물 · 수분\",\"heardFrom\":\"더운 날 아기가 목말라 보일 때, 또는 어른들이 물을 먹이라고 할 때 찾게 돼요.\",\"what\":\"젖이나 분유만 먹는 아기에게 물을 따로 줘도 되는지 묻게 돼요.\",\"known\":\"이유식을 시작하기 전의 아기는 젖이나 분유로 수분을 함께 받는 것으로 이야기돼요. 그 시기에 물을 따로 많이 주는 것은 권하지 않는 쪽이에요. 배가 차서 정작 먹는 양이 줄 수 있고, 몸의 균형에도 영향을 준다고 보기 때문이에요. 이유식을 시작하면서 조금씩 함께 주도록 안내하는 것이 흔해요.\",\"notAtHome\":\"우리 아이가 지금 물을 줘도 되는 때인지는 먹는 양과 시기를 함께 봐야 정해져요.\",\"ask\":[\"지금 시기에 물을 따로 줘도 되나요?\",\"더운 날에는 어떻게 하면 좋을까요?\"],\"basis\":\"영아 수분 섭취 권고 — 이유식 시작 전후\"},{\"id\":\"fb-milk-honey\",\"kind\":\"saying\",\"term\":\"생우유와 꿀은 언제부터인가요\",\"also\":\"꿀 · 우유 · 보툴리누스\",\"heardFrom\":\"어른들이 목에 좋다며 꿀을 권할 때, 또는 이유식을 하면서 우유를 물어보게 돼요.\",\"point\":\"꿀은 시기가 되기 전에는 주지 않도록 권해요. 가열해도 마찬가지로 다뤄요.\",\"what\":\"생우유를 언제부터 먹여도 되는지, 꿀을 발라 줘도 되는지 묻게 돼요.\",\"known\":\"꿀은 보툴리누스균과 관련해, 정해진 시기가 되기 전에는 주지 않도록 널리 권해요. 이건 떠도는 말이 아니라 지켜지는 권고예요. 가열하거나 조리에 섞은 경우도 같게 다뤄요. 생우유는 돌 무렵 전까지 주된 먹을거리로 쓰지 않도록 권하는 편인데, 조리에 조금 쓰는 것과는 나누어 이야기해요.\",\"notAtHome\":\"우리 아이에게 언제부터 되는지는 시기와 먹는 상황을 함께 봐야 해서, 제품 표시만으로는 정할 수 없어요.\",\"ask\":[\"저희 아이는 언제부터 우유를 줘도 되나요?\",\"꿀이 들어간 과자나 시리얼도 같이 피해야 하나요?\"],\"callNow\":\"꿀이 든 것을 먹은 뒤 힘이 없고 젖을 잘 빨지 못하거나, 변이 며칠 나오지 않으면서 축 처져요.\",\"basis\":\"영아 보툴리눔 중독 예방 권고 · 우유 도입 시기 권고\"},{\"id\":\"fb-checkup\",\"kind\":\"system\",\"term\":\"영유아 건강검진은 언제 몇 번 받나요\",\"also\":\"영유아검진 · 문진표 · 구강검진\",\"heardFrom\":\"우편이나 문자로 안내를 받으면서 알게 돼요.\",\"point\":\"회차마다 받을 수 있는 기간이 정해져 있어요. 그 기간을 넘기면 그 회차를 못 받는 경우가 있어요.\",\"what\":\"나이에 맞춰 여러 차례 받는 검진이에요. 자라는 것과 발달, 먹고 자는 것을 함께 보고, 나이에 따라 구강검진이 같이 있어요. 미리 문진표를 작성해서 가요.\",\"known\":\"국민건강보험이 운영해요. 회차마다 받을 수 있는 기간이 나이로 정해져 있어서, 그 안에 가야 해요. 어린이집이나 유치원에서 결과를 요구하는 경우가 있어요.\",\"amounts\":[{\"item\":\"건강검진\",\"value\":\"생후 14일부터 71개월까지 여덟 번\"},{\"item\":\"구강검진\",\"value\":\"네 번\",\"note\":\"18개월 이후 나이에 맞춰 따로 있어요\"},{\"item\":\"비용\",\"value\":\"지정된 곳에서 받으면 따로 내지 않아요\"}],\"notAtHome\":\"우리 아이의 다음 회차가 언제인지는 생년월일로 정해져요. 검진에서 보는 것은 집에서 대신 볼 수 있는 것이 아니에요.\",\"ask\":[\"다음 검진은 언제까지 받아야 하나요?\",\"문진표는 어디서 미리 받나요?\"],\"basis\":\"국민건강보험 영유아 건강검진\",\"asOf\":\"2025년 기준\",\"byRegion\":\"검진 자체는 전국이 같아요. 지역마다 다른 것은 검진을 하는 병원이에요. 가까운 지정 기관은 국민건강보험공단에서 찾아봐야 하고, 시골에서는 갈 수 있는 곳이 몇 군데뿐인 경우가 있어요.\",\"changes\":\"회차와 시기, 포함되는 항목이 바뀌어요. 국민건강보험공단이나 검진 기관에서 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-vaccine-schedule\",\"kind\":\"system\",\"term\":\"예방접종 일정과 비용\",\"also\":\"국가예방접종 · 접종 수첩 · 유료 접종\",\"heardFrom\":\"첫 접종을 다녀오면서, 그리고 어린이집에 서류를 낼 때 다시 찾게 돼요.\",\"what\":\"나이에 맞춰 정해진 접종 일정이 있어요. 나라에서 비용을 대는 것과 그렇지 않은 것이 나뉘고, 지정된 곳에서 받으면 비용이 들지 않는 항목이 있어요. 기록은 전산으로 남아서 어린이집 제출에 쓰여요.\",\"known\":\"일정은 나이에 따라 정해져 있고, 여러 번에 나누어 맞는 것이 있어요. 조금 늦어졌을 때 어떻게 이어 맞는지는 정해진 방식이 있어서, 처음부터 다시 하는 것이 아닌 경우가 많아요. 나라에서 대는 항목은 해마다 늘거나 바뀌어요.\",\"amounts\":[{\"item\":\"국가에서 대는 접종\",\"value\":\"지정된 곳에서 받으면 따로 내지 않아요\"},{\"item\":\"어린이 인플루엔자\",\"value\":\"정해진 기간에 무료\",\"note\":\"대상 나이와 기간이 해마다 정해져요\"}],\"notAtHome\":\"우리 아이가 지금 무엇을 맞을 차례인지, 늦어진 것을 어떻게 이어 맞는지는 접종 기록을 봐야 정해져요.\",\"ask\":[\"지금 늦어진 것이 있나요? 있다면 어떻게 이어 맞나요?\",\"이번에 맞는 것 중에 비용이 드는 것이 있나요?\"],\"basis\":\"표준예방접종일정표\",\"asOf\":\"2025년 기준\",\"byRegion\":\"국가에서 대는 항목은 전국이 같아요. 그 밖의 접종을 지자체가 따로 지원하는 곳이 있어서, 우리 지역에 추가로 지원하는 것이 있는지 보건소에 물어볼 만해요.\",\"changes\":\"지원하는 항목과 일정이 해마다 바뀌어요. 예방접종 안내 누리집이나 접종 기관에서 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-daycare-apply\",\"kind\":\"system\",\"term\":\"어린이집 입소 대기는 어떻게 거나요\",\"also\":\"입소 대기 순위 · 가점 · 대기 번호\",\"heardFrom\":\"복직을 생각하기 시작할 무렵, 주
