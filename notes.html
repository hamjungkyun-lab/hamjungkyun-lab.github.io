변에서 빨리 걸어 두라는 말을 듣게 돼요.\",\"point\":\"대기는 미리 걸어 두는 것이라, 보낼 시기를 정하기 전에 걸어 두는 집이 많아요.\",\"what\":\"온라인으로 어린이집을 골라 대기를 걸어 두고, 자리가 나면 연락을 받는 방식이에요. 여러 곳에 함께 걸 수 있고, 맞벌이나 다자녀 같은 사정에 따라 순위가 달라져요.\",\"known\":\"순위는 정해진 기준에 따라 점수로 매겨져요. 대기 순번은 다른 집의 신청과 취소에 따라 계속 움직여서, 앞이라고 해서 그대로 가지 않아요. 기다리는 기간은 지역에 따라 차이가 커요.\",\"notAtHome\":\"우리가 몇 번째이고 언제쯤 자리가 날지는 순번만으로 가늠하기 어려워요. 어린이집에 직접 물어보는 집이 많아요.\",\"ask\":[\"저희 사정으로 받을 수 있는 가점이 있나요?\",\"지금 순번이면 대략 언제쯤 볼 수 있을까요?\"],\"basis\":\"어린이집 입소 대기 관리 제도\",\"asOf\":\"2025년 기준\",\"byRegion\":\"지역차가 제도의 체감을 통째로 바꾸는 항목이에요. 기다리는 기간이 몇 달인 곳과 몇 년인 곳이 갈리고, 가점을 매기는 기준에도 지자체가 정하는 부분이 있어요. 국공립과 민간의 수도 지역마다 달라요. 우리 지역 기준은 주민센터나 육아종합지원센터에서 확인해 주세요.\",\"changes\":\"신청 방법과 순위 기준이 바뀌고 지역마다 달라요. 어린이집 입소 신청 누리집이나 주민센터에서 확인해 주세요.\"},{\"id\":\"fb-child-benefit\",\"kind\":\"system\",\"term\":\"부모급여와 아동수당은 언제 신청하나요\",\"also\":\"계좌 변경 · 어린이집 이용과의 관계 · 복지 창구\",\"heardFrom\":\"출생신고를 하고 나서, 그리고 아이가 자라 구간이 바뀔 때 다시 찾게 돼요.\",\"what\":\"출생신고와 함께 신청하는 경우가 많은데, 놓쳤다면 나중에도 신청할 수 있어요. 아이가 어린이집에 다니는지에 따라 받는 방식이 달라지는 부분이 있어요.\",\"known\":\"신청한 달부터 받는 것이 원칙이라, 늦게 신청하면 그 전 달치는 받지 못하는 경우가 있어요. 아이 나이에 따라 금액과 종류가 바뀌는 구간이 있어서, 그때 따로 신청하거나 바꿔야 하는 것이 생겨요.\",\"amounts\":[{\"item\":\"부모급여\",\"value\":\"0세는 월 100만원 · 1세는 월 50만원\",\"note\":\"어린이집에 다니면 보육료로 먼저 쓰고 남는 만큼 받아요\"},{\"item\":\"아동수당\",\"value\":\"월 10만원\",\"note\":\"만 8세가 되기 전까지\"}],\"notAtHome\":\"우리가 지금 무엇을 받고 있고 무엇을 더 신청할 수 있는지는 신청 내역을 봐야 알 수 있어요.\",\"ask\":[\"지금 저희가 신청해 두지 않은 것이 있나요?\",\"아이가 어린이집에 다니게 되면 무엇이 달라지나요?\"],\"basis\":\"아동수당법 및 관련 지원 사업\",\"asOf\":\"2025년 기준\",\"byRegion\":\"위 둘은 전국이 같아요. 지자체가 따로 주는 양육수당이나 돌봄 지원은 지역마다 달라서, 이사를 하면 받던 것이 달라지는 경우가 있어요.\",\"changes\":\"금액과 대상 나이, 어린이집 이용에 따른 처리 방식이 해마다 바뀌어요. 주민센터나 온라인 복지 창구에서 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-night-clinic\",\"kind\":\"system\",\"term\":\"밤이나 휴일에 아이가 아프면 어디로 가나요\",\"also\":\"달빛어린이병원 · 야간 진료 · 응급실\",\"heardFrom\":\"금요일 밤이나 연휴 첫날에 처음 찾게 되는데, 그때 찾으면 이미 늦어요.\",\"point\":\"미리 한 번 찾아서 적어 두면, 정작 그날 밤에 검색하지 않아도 돼요.\",\"what\":\"밤이나 휴일에 문을 여는 소아 진료 기관을 따로 지정해 운영해요. 응급실과는 다른 곳이에요. 지역마다 있는 곳과 여는 시간이 달라요. 전화로 상담할 수 있는 창구도 따로 있어요.\",\"known\":\"지정된 곳의 목록과 운영 시간은 공공 창구에서 안내해요. 다만 급한 신호가 보일 때는 여는 곳을 찾는 대신 바로 응급실이나 119로 가요.\",\"notAtHome\":\"지금이 아침까지 기다려도 되는 때인지는 집에서 가를 수 없어요. 이 화면의 신호 목록은 대조해서 판정하라고 있는 것이 아니라, 하나라도 보이면 바로 연락하시라고 있는 것이에요.\",\"ask\":[\"밤에 아이가 아프면 저희는 어디로 가는 것이 좋을까요?\",\"이 병원의 야간·휴일 진료 시간은 어떻게 되나요?\"],\"basis\":\"야간·휴일 소아 진료 지정 기관 · 응급의료 안내\",\"asOf\":\"2025년 기준\",\"byRegion\":\"지역차가 가장 큰 항목이에요. 지정된 병원이 아예 없는 시군이 있고, 여는 시간도 평일 밤만 하는 곳과 휴일까지 하는 곳이 갈려요. 그래서 이 항목은 미리 우리 동네 기준으로 한 번 찾아 적어 두셔야 해요.\",\"changes\":\"지정된 기관과 운영 시간이 자주 바뀌어요. 응급의료 안내 누리집이나 지역 보건소에서 지금 목록을 확인해 주세요.\"},{\"id\":\"fb-fever-care\",\"kind\":\"saying\",\"term\":\"열이 날 때 물수건으로 닦아줘야 하나요\",\"also\":\"미온수 마사지 · 해열제 번갈아 쓰기 · 옷을 벗겨야 하나\",\"heardFrom\":\"밤에 열이 오르기 시작하면 검색하게 되고, 어른들에게도 듣게 돼요.\",\"point\":\"이 글은 열을 어떻게 볼지 정하는 글이 아니에요. 도는 방법 가운데 지금은 권해지지 않는 것이 무엇인지만 적어요.\",\"what\":\"열이 나면 미지근한 물로 닦아 주라거나, 해열제 두 가지를 번갈아 쓰라거나, 옷을 다 벗겨 두라는 말이 돌아요.\",\"known\":\"물로 닦아 주는 방법은 예전에 널리 권해졌지만, 지금은 먼저 하는 방법으로 권하지 않는 쪽이 많아요. 아이가 떨면서 오히려 힘들어하는 경우가 있기 때문이에요. 해열제를 번갈아 쓰는 방식도 집에서 스스로 정할 일로 다루지 않아요. 약의 종류와 간격을 헷갈려 겹쳐 주는 일이 실제로 일어나기 때문이에요. 물을 잘 마시게 하는 것과 아이가 편해하는 정도로 입히는 것은 공통으로 이야기돼요.\",\"notAtHome\":\"지금 이 열을 어떻게 봐야 하는지는 집에서 가를 수 없어요. 아이의 나이와 모습, 함께 보이는 것을 같이 봐야 정해져요. 약을 얼마나 어떻게 줄지도 아이마다 달라서 이 글에 적을 수 없어요.\",\"ask\":[\"저희 아이에게는 어떤 약을 얼마 간격으로 주면 되나요?\",\"밤에 열이 오르면 어떤 경우에 바로 와야 하나요?\"],\"callNow\":\"태어난 지 얼마 안 된 아이가 열이 나요. 축 처져 깨우기 어렵거나, 숨쉬기 힘들어하거나, 경련을 일으켜요.\",\"basis\":\"소아 발열 대응 권고 — 미온수 도포와 해열제 교차 사용에 대한 재검토\"},{\"id\":\"fb-swallowed\",\"kind\":\"saying\",\"term\":\"무언가를 삼킨 것 같아요\",\"also\":\"이물 · 단추 모양 전지 · 자석 · 약\",\"heardFrom\":\"바닥에 있던 것이 사라진 것을 알아챈 순간 찾게 돼요.\",\"point\":\"단추 모양 전지와 자석 여러 개, 그리고 약은 다르게 다뤄요. 지켜보는 것으로 하지 않아요.\",\"what\":\"동전, 구슬, 약, 단추 모양 전지, 자석 같은 것을 입에 넣었거나 삼킨 것 같을 때예요.\",\"known\":\"무엇을 삼켰는지에 따라 완전히 다르게 다뤄져요. 억지로 토하게 하는 것은 권하지 않아요. 목에 걸려 숨을 못 쉬는 상황과, 삼켜서 넘어간 상황도 서로 다르게 다뤄요. 삼킨 것이 무엇인지 알 수 있게 같은 물건이나 포장을 챙겨 가도록 안내하는 경우가 많아요.\",\"notAtHome\":\"무엇을 얼마나 삼켰는지, 지금 어디에 있는지는 집에서 알 수 없어요. 겉으로는 멀쩡해 보이는 시간이 있는 경우가 있어요.\",\"ask\":[\"삼킬 만한 것을 집에서 어떻게 치워 두면 좋을까요?\",\"이런 일이 생기면 저희는 어디로 먼저 가야 하나요?\"],\"callNow\":\"숨쉬기 힘들어하거나 소리를 못 내요. 침을 흘리며 삼키지 못해요. 단추 모양 전지나 자석, 약을 삼킨 것 같아요.\",\"basis\":\"소아 이물 섭취 대응 — 삼킨 물질에 따른 분류\"},{\"id\":\"fb-burn-fall\",\"kind\":\"saying\",\"term\":\"데었거나 떨어졌어요\",\"also\":\"화상 · 낙상 · 침대에서 떨어짐 · 뒤집기\",\"heardFrom\":\"일이 벌어진 그 자리에서, 손이 떨리는 채로 검색하게 돼요.\",\"point\":\"데었을 때 얼음이나 된장, 소주, 연고를 바르는 것은 권하지 않아요.\",\"what\":\"뜨거운 것에 데거나, 침대나 소파에서 떨어졌을 때 무엇을 먼저 해야 하는지 찾게 돼요.\",\"known\":\"데었을 때는 흐르는 시원한 물에 충분히 식히도록 널리 권해요. 얼음을 대거나 예전부터 바르던 것들을 쓰는 것은 권하지 않는 쪽으로 정리되어 있어요. 물집을 터뜨리지 않도록도 이야기해요. 떨어진 경우에는 겉으로 보이는 상처보다 그 뒤 몇 시간 동안의 모습을 함께 보도록 안내하는데, 그 판단은 집에서 하는 것이 아니에요.\",\"notAtHome\":\"얼마나 깊이 데었는지, 머리 안쪽에 무엇이 있는지는 겉으로 보이지 않아요. 아이가 울다 그쳤다는 것이 지나갔다는 뜻은 아니에요.\",\"ask\":[\"이런 일이 생기면 저희는 어디로 먼저 가야 하나요?\",\"집에 준비해 두면 좋을 것이 있을까요?\"],\"callNow\":\"떨어진 뒤 토하거나 축 처져 깨우기 어려워요. 데인 자리가 넓거나 얼굴·손·사타구니예요. 우는 소리가 평소와 다르거나 팔다리를 쓰지 않으려고 해요.\",\"basis\":\"소아 화상·머리 부상 초기 대응 권고\"},{\"id\":\"fb-cpr\",\"kind\":\"saying\",\"term\":\"영아 심폐소생술을 배워둬야 하나요\",\"also\":\"영아 CPR · 하임리히 · 응급처치 교육\",\"heardFrom\":\"아이가 사레들려 놀란 날, 또는 뉴스를 보고 찾게 돼요.\",\"point\":\"글로 읽어 둔 것과 손으로 해 본 것은 그날 밤에 전혀 다르게 나와요.\",\"what\":\"아이가 숨을 쉬지 않거나 목에 무엇이 걸렸을 때 하는 응급처치예요. 어른에게 하는 것과 방법이 달라요.\",\"known\":\"여러 기관이 무료 교육을 열고 있어요. 소방서와 보건소, 적십자사 같은 곳에서 받을 수 있고, 지역에 따라 임신부와 보호자를 위한 과정을 따로 여는 곳도 있어요. 방법은 몇 년마다 지침이 바뀌기 때문에, 예전에 배운 분도 다시 확인하는 편이 나아요.\",\"notAtHome\":\"글이나 영상만 보고 익혔다고 보기 어려운 영역이에요. 이 글은 방법을 적지 않아요. 순서를 잘못 기억한 채로 급한 날을 맞는 것이 더 위험하기 때문이에요.\",\"ask\":[\"저희 지역에서 보호자가 받을 수 있는 교육이 어디에 있나요?\",\"아이 나이에 맞는 과정이 따로 있나요?\"],\"basis\":\"심폐소생술 지침 — 주기적 개정 · 각 기관 무료 교육\",\"changes\":\"지침이 몇 년마다 바뀌고, 교육을 여는 곳과 일정도 달라져요. 소방서나 보건소에서 지금 일정을 확인해 주세요.\"},{\"id\":\"fb-dad-helping\",\"kind\":\"saying\",\"term\":\"아빠가 봐주는 거예요? 대단하네\",\"also\":\"아빠가 애 보네 · 오늘은 엄마 어디 갔어요\",\"heardFrom\":\"아이를 데리고 혼자 나간 날, 병원이나 놀이터에서 처음 보는 어른에게 듣게 돼요.\",\"point\":\"칭찬처럼 들리지만, 돌봄이 한쪽 일이고 다른 쪽은 돕는 것이라는 전제가 깔려 있어요.\",\"what\":\"혼자 아이를 데리고 나가면 유독 자주 듣는 말이에요. 좋은 뜻으로 하는 말인 것도 알지만, 들을 때마다 조금 걸리는 자리이기도 해요. 반대로 그 말이 반가운 날도 있어요.\",\"known\":\"같은 일을 해도 누가 하느냐에 따라 다르게 불리는 자리예요. 한쪽에게는 '당연한 것'이고 다른 쪽에게는 '대단한 것'이 되면, 그 집에서 돌봄을 나누는 이야기도 그 틀을 따라가기 쉬워요. 돌봄을 나눌수록 아이와의 관계가 어느 한쪽에만 쏠리지 않는 쪽으로 보는 이야기가 많아요. 밖에서 듣는 말을 바꿀 수는 없지만, 집 안에서 쓰는 말은 정할 수 있어요 — '도와준다' 대신 '맡는다'로요.\",\"notAtHome\":\"이 말에 어떻게 답해야 하는지에 정해진 답은 없어요. 그 자리에서 설명할 일인지, 웃고 넘길 일인지는 그날 그 사람의 몫이에요.\",\"ask\":[\"돌보는 사람이 둘로 나뉘면 아이가 적응하는 데 도움이 되는 것이 있을까요?\",\"아이가 한쪽만 찾는 시기가 지금 나이에 흔한 편인가요?\"],\"basis\":\"돌봄 분담 — '도움'과 '분담'을 가르는 관점\"},{\"id\":\"fb-dad-leave\",\"kind\":\"system\",\"term\":\"아빠도 육아휴직을 쓸 수 있나요\",\"also\":\"배우자 출산휴가 · 부모 육아휴직 · 육아기 근로시간 단축\",\"heardFrom\":\"회사에 말을 꺼내기 전에 알아보게 되고, 주위에서 쓴 사람 이야기를 들으며 알게 돼요.\",\"point\":\"아빠도 쓸 수 있어요. 그리고 두 사람이 나눠 쓰거나 같은 시기에 함께 쓰는 길이 따로 있어요.\",\"what\":\"아이를 돌보기 위해 일을 쉬는 제도예요. 낳은 사람만 쓰는 것이 아니라 양쪽 모두 각각 쓸 수 있어요. 아이가 태어난 직후 짧게 쓰는 휴가와, 길게 쉬는 휴직이 다른 제도로 나뉘어 있어요. 일하는 시간을 줄여서 계속 일하는 길도 있어요.\",\"known\":\"고용노동부가 운영하고 고용보험에서 급여가 나와요. 양쪽이 각각 쓸 수 있고, 두 사람이 함께 쓰거나 이어서 쓸 때 급여를 더 주는 제도가 따로 있어요. 신청은 회사를 통해 하고, 기간과 금액은 아이의 나이와 쓰는 방식에 따라 달라져요. 쓰겠다고 말한 것 때문에 불리하게 대하는 것은 법으로 금지돼 있어요.\",\"amounts\":[{\"item\":\"누가\",\"value\":\"양쪽 모두 각각 쓸 수 있어요\"},{\"item\":\"배우자 출산휴가\",\"value\":\"출산 직후 쓰는 짧은 휴가가 따로 있어요\",\"note\":\"휴직과 다른 제도예요\"},{\"item\":\"함께 쓸 때\",\"value\":\"두 사람이 같은 시기나 이어서 쓰면 급여를 더 주는 제도가 있어요\"},{\"item\":\"급여\",\"value\":\"고용보험에서 나와요. 상한이 있어요\"}],\"notAtHome\":\"우리 회사에서 언제부터 며칠을 쓸 수 있고 급여가 얼마인지는 집에서 알 수 없어요. 아이 나이와 고용 형태, 고용보험 가입 기간에 따라 달라져서 회사 인사 담당이나 고용노동부에 확인해야 해요.\",\"ask\":[\"제가 쓸 수 있는 기간과 신청 시기가 언제인가요?\",\"두 사람이 함께 쓰거나 이어서 쓰면 달라지는 것이 있나요?\"],\"basis\":\"고용노동부 육아휴직 · 배우자 출산휴가 제도\",\"asOf\":\"2025년 기준\",\"byRegion\":\"제도 자체는 전국이 같아요. 다른 것은 회사예요 — 같은 제도인데 쓰는 분위기와 절차가 회사마다 크게 달라요. 지자체가 따로 주는 지원금이 있는 곳도 있어요.\",\"changes\":\"기간과 급여, 함께 쓸 때의 혜택이 자주 바뀌는 영역이에요. 고용노동부나 고용보험 쪽에서 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-samchil\",\"kind\":\"saying\",\"term\":\"삼칠일 동안은 밖에 나가지도 손님을 받지도 마라\",\"also\":\"삼칠일 · 금줄 · 백일 전엔 외출 금지\",\"heardFrom\":\"태어나서 집에 온 첫 주에 집안 어른들에게 듣게 돼요.\",\"what\":\"태어난 뒤 스물하루 동안 산모와 아기가 밖에 나가지 않고 손님도 들이지 않는다는 말이에요. 백일까지 밖에 데리고 나가지 말라는 말로 이어지기도 해요.\",\"known\":\"이 말이 남아 있는 자리에는 어린 아기가 감염에 약하고 산모의 몸이 회복 중이라는 사정이 함께 있어요. 그 둘은 지금도 그대로예요 — 사람이 많은 곳과 아픈 사람을 피하고, 손을 씻고, 산모가 쉬는 것은 지금도 권해지는 쪽이에요. 다만 날수를 정해 집에 가두는 방식은 지금의 안내가 아니에요. 아기와 산모가 바깥 공기를 쐬는 것은 몸 상태에 따라 이르게 권하기도 해요. 금줄처럼 상징으로 남은 것은 그 집의 문화로 두면 돼요.\",\"notAtHome\":\"우리 아기가 언제부터 어디까지 나가도 되는지는 태어난 주수와 몸 상태에 따라 달라서, 날수로 정할 수 있는 것이 아니에요. 퇴원할 때 받은 안내와 첫 검진에서 듣는 것이 기준이에요.\",\"ask\":[\"밖에 데리고 나가는 것은 언제부터, 어디까지 하면 될까요?\",\"집에 오는 손님에게 부탁할 것이 있을까요?\"],\"basis\":\"신생아 감염 예방과 산후 회복 — 날수가 아니라 조건으로 보는 관점\"},{\"id\":\"fb-postpartum-cold\",\"kind\":\"saying\",\"term\":\"산후에 찬물 쓰고 이 닦으면 나중에 고생한다\",\"also\":\"산후풍 · 찬바람 쐬지 마라 · 샤워 금지 · 양말 신고 자라\",\"heardFrom\":\"산후조리를 하는 집에서 어른들에게 매일 듣게 돼요.\",\"point\":\"산모의 몸이 회복 중이라는 것은 사실이에요. 다만 무엇을 금지하느냐는 그때와 지금이 달라요.\",\"what\":\"출산 뒤 몇 주 동안 찬물에 손을 대지 말고, 찬바람을 쐬지 말고, 이를 닦지 말고, 더운 날에도 두껍게 입으라는 말이에요. 어기면 나중에 뼈마디가 시리다는 이야기가 따라붙어요.\",\"known\":\"산후의 몸은 관절이 느슨하고 피로가 깊어 회복에 시간이 걸려요. 쉬고 무리하지 않는 것은 지금도 권하는 쪽이에요. 반면 이를 닦지 않거나 씻지 않는 것은 지금은 권하지 않아요 — 산후에는 잇몸이 약하고 땀이 많아 오히려 위생이 더 이야기돼요. 더운 날 두껍게 싸는 것도 몸에 열이 쌓여 조심스럽게 다뤄요. 산후의 통증과 시린 느낌은 여러 가지로 설명되고, 찬물 하나로 갈리는 것이 아니에요.\",\"notAtHome\":\"산후에 몸이 어디까지 회복됐는지, 어떤 활동이 되는지는 집에서 느낌으로 가를 수 없어요. 산후 진찰에서 묻는 것이 맞아요. 관절이 아프거나 열이 나는 것은 참을 일이 아니라 말할 일이에요.\",\"ask\":[\"산후에 씻는 것과 움직이는 것은 어디까지 하면 될까요?\",\"손목이나 무릎이 아픈데 산후에 흔한 것인지 봐 주시겠어요?\"],\"callNow\":\"열이 나면서 아랫배나 가슴이 아플 때, 출혈이 갑자기 늘 때, 한쪽 다리가 붓고 아플 때는 기다리지 말고 연락하세요.\",\"basis\":\"산후 회복기의 위생과 활동에 관한 현재의 안내\"},{\"id\":\"fb-chew-feed\",\"kind\":\"saying\",\"term\":\"어른이 씹어서 먹이면 소화가 잘된다\",\"also\":\"같은 숟가락 · 입으로 식혀 주기 · 입 뽀뽀\",\"heardFrom\":\"이유식을 시작할 무렵 어른들이 아이를 먹여 줄 때 보게 돼요.\",\"what\":\"어른이 먼저 씹어서 아이 입에 넣어 주거나, 어른 숟가락으로 그대로 먹이고, 뜨거운 것을 입으로 식혀 주는 것을 말해요. 예전에는 흔한 방식이었어요.\",\"known\":\"어른의 입에서 아이 입으로 옮겨 가는 것이 있다는 이야기가 있어요. 충치와 관련된 균이 그중에 자주 거론돼요. 그래서 지금은 숟가락을 따로 쓰고, 씹어 먹이는 것을 피하도록 안내하는 쪽이 많아요. 다만 이것은 '그렇게 하면 반드시 어떻게 된다'가 아니라 '옮겨 갈 길을 줄이자'는 이야기예요. 아이를 예뻐하는 몸짓과 겹쳐 있어서, 금지보다 숟가락을 따로 두는 것처럼 다른 길을 마련하는 쪽이 통해요.\",\"notAtHome\":\"이미 그렇게 먹였다고 해서 무엇이 어떻게 됐는지는 집에서 알 수 없고, 되짚어 걱정할 자리도 아니에요. 지금부터 숟가락을 따로 두면 돼요.\",\"ask\":[\"아이 이가 나기 시작했는데 치과는 언제 처음 가면 될까요?\",\"같이 먹을 때 어른들에게 부탁할 것이 있을까요?\"],\"basis\":\"구강 세균의 전파 경로에 관한 안내 — 식기 분리\"},{\"id\":\"fb-boy-late-talk\",\"kind\":\"saying\",\"term\":\"사내애는 말이 늦다, 크면 다 한다\",\"also\":\"늦게 트인다 · 큰애도 그랬다 · 지켜보면 된다\",\"heardFrom\":\"말이 늦는 것 같아 걱정을 꺼냈을 때 어른들에게 듣게 돼요.\",\"point\":\"안심시키려는 말이지만, 이 말로 검진에서 물어볼 때를 넘기는 집이 있어요.\",\"what\":\"남자아이는 원래 말이 늦고, 집안의 다른 아이도 그랬으니 기다리면 된다는 말이에요. 걱정하는 사람을 달래려고 하는 말이기도 해요.\",\"known\":\"말이 트이는 시기는 아이마다 폭이 넓고, 평균으로 보면 성별에 따른 차이가 조금 이야기되기도 해요. 다만 그 차이는 작고, 우리 아이가 어디쯤인지를 그 말로 알 수는 없어요. 집안의 다른 아이가 늦게 트였다는 것도 이 아이의 이야기가 아니에요. 말이 늦을 때는 듣는 것부터 함께 보는 것이 보통이고, 그것은 기다린다고 알 수 있는 것이 아니에요.\",\"notAtHome\":\"이 말을 듣고 걱정을 접지 마세요. 영유아 검진의 발달선별검사에서 확인하시고, 마음에 걸리면 검진을 기다리지 말고 물어보세요. 늦은지 아닌지를 이 글도 어른들의 말도 가려 주지 않아요.\",\"ask\":[\"지금 나이에 말이 이 정도인 것을 어떻게 보시나요?\",\"듣는 것도 함께 확인해 봐야 할까요?\"],\"basis\":\"언어 발달의 개인차 — 선별검사로 확인하는 접근\"},{\"id\":\"fb-teething-fever\",\"kind\":\"saying\",\"term\":\"이 날 때는 열이 나고 설사를 한다\",\"also\":\"이앓이 · 이 나느라 보챈다 · 치발기\",\"heardFrom\":\"아이가 보채고 침을 많이 흘릴 때 어른들에게 듣게 돼요.\",\"point\":\"열을 '이 나느라'로 넘기면 봐야 할 열을 놓쳐요. 이 말은 열을 설명하는 말로 쓰지 않는 편이 안전해요.\",\"what\":\"이가 날 때 열이 나고 설사를 하고 밤에 보채는 것이 다 그 때문이라는 말이에요. 아이가 아픈 이유를 설명해 주는 말이라 듣는 사람도 받아들이기 쉬워요.\",\"known\":\"이가 날 무렵 잇몸이 붓고 침이 늘고 보채는 것은 흔히 이야기돼요. 다만 뚜렷한 열이나 설사를 이가 나는 것으로 설명하는 데는 조심스러운 쪽이 많아요. 그 시기는 다른 이유로 열이 나기도 쉬운 때라, 이 때문이라고 두면 다른 이유를 늦게 보게 돼요. 잇몸을 시원한 것으로 눌러 주는 것은 흔히 권하고, 잇몸에 바르는 약은 종류에 따라 권하지 않는 것이 있어 쓰기 전에 물어봐요.\",\"notAtHome\":\"지금 나는 열이 이 때문인지 아닌지는 집에서 가를 수 없어요. 어린 아기의 열은 이유를 설명하려 하지 말고 그대로 연락하는 것이 맞아요.\",\"ask\":[\"이가 날 때 집에서 해 줄 수 있는 것이 있을까요?\",\"잇몸에 바르는 약을 써도 될까요?\"],\"callNow\":\"어린 아기가 열이 나요. 열과 함께 축 처지거나, 먹지 않거나, 설사가 이어져 소변이 줄어요.\",\"basis\":\"이가 나는 시기의 증상에 관한 안내 — 열은 따로 본다\"},{\"id\":\"fb-gp-care-support\",\"kind\":\"system\",\"term\":\"조부모가 봐주면 받을 수 있는 지원이 있나요\",\"also\":\"조부모 돌봄수당 · 손주돌보미 · 가족 돌봄 지원\",\"heardFrom\":\"조부모에게 아이를 맡기기로 하면서 비용 이야기가 나올 때 찾아보게 돼요.\",\"point\":\"나라 전체의 제도가 아니라 지자체마다 있는 곳과 없는 곳이 갈려요. 우리 지역에 있는지가 먼저예요.\",\"what\":\"조부모나 가까운 친척이 아이를 봐줄 때 지자체가 돌봄비를 주거나, 조부모를 위한 돌봄 교육을 여는 것을 말해요. 아이 나이와 소득, 돌보는 시간에 조건이 붙어요.\",\"known\":\"전국 공통의 제도는 아니에요. 일부 광역·기초 지자체가 자기 예산으로 조부모 돌봄비를 주고 있고, 아이 나이가 두세 살 무렵으로 좁고 소득 조건이 붙는 곳이 많아요. 나라에서 운영하는 아이돌봄서비스는 돌보는 사람이 가족이면 대상이 아니라서, 조부모 돌봄은 그쪽과 겹치지 않아요. 보건소나 육아종합지원센터가 조부모를 위한 양육 교육을 여는 곳도 있어요.\",\"amounts\":[{\"item\":\"지자체 조부모 돌봄비\",\"value\":\"있는 곳과 없는 곳이 갈려요\",\"note\":\"있는 곳은 월 몇십만 원 수준이고, 아이 나이와 소득 조건이 붙어요\"},{\"item\":\"아이돌봄서비스\",\"value\":\"가족이 돌보는 경우는 대상이 아니에요\"},{\"item\":\"조부모 양육 교육\",\"value\":\"보건소·육아종합지원센터에서 여는 곳이 있어요\"}],\"notAtHome\":\"우리 지역에 있는지, 우리가 조건에 맞는지는 거주지 기준으로 정해져서 검색한 다른 지역 글로는 알 수 없어요.\",\"ask\":[\"우리 지역에 조부모가 아이를 봐줄 때 받을 수 있는 지원이 있나요?\",\"조부모가 들을 수 있는 양육 교육이 어디에서 열리나요?\"],\"basis\":\"지자체 조부모 돌봄 지원 사업\",\"asOf\":\"2025년 기준\",\"byRegion\":\"지역차가 제도의 유무를 정하는 항목이에요. 조부모 돌봄비를 주는 지자체와 아예 없는 지자체가 갈리고, 있는 곳도 아이 나이와 소득 기준, 월 금액이 달라요. 거주지 주민센터나 육아종합지원센터에 물어봐야만 알 수 있어요.\",\"changes\":\"새로 생기거나 없어지는 지자체가 해마다 있고, 금액과 조건도 바뀌어요. 거주지 주민센터에서 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-yubo-integration\",\"kind\":\"system\",\"term\":\"유치원과 어린이집이 하나로 합쳐진다는데\",\"also\":\"유보통합 · 통합 입학 포털 · 처음학교로 · 입소대기\",\"heardFrom\":\"기관을 고를 무렵 뉴스와 다른 부모에게서 듣게 돼요.\",\"point\":\"관리하는 부처와 신청 창구가 합쳐지는 일이에요. 지금 다니는 곳이 바로 바뀌는 것은 아니에요.\",\"what\":\"유치원은 교육부, 어린이집은 보건복지부로 나뉘어 있던 체계를 하나로 합치는 일이에요. 신청 창구, 교사 자격, 지원금, 교육과정을 맞춰 가는 것이 함께 이야기돼요. 2025년 시범 지역을 거쳐 2026년부터 전국 단위로 시행된다고 안내돼요.\",\"known\":\"유치원은 '처음학교로', 어린이집은 '입소대기'로 따로 신청하던 것을 하나의 창구로 모으는 것이 학부모에게 가장 먼저 닿는 변화예요. 보육료와 교육비의 차이를 줄이는 것, 교사 기준을 맞추는 것도 함께 가요. 다만 세부는 단계적으로 바뀌고 있어서, 올해 무엇이 되고 무엇이 아직인지는 그때그때 달라요.\",\"amounts\":[{\"item\":\"신청 창구\",\"value\":\"통합 포털로 모으는 중\",\"note\":\"지역과 시기에 따라 아직 따로 신청하는 곳이 있어요\"},{\"item\":\"지금 다니는 곳\",\"value\":\"바로 바뀌는 것은 아니에요\"}],\"notAtHome\":\"우리 지역에서 올해 무엇이 바뀌었는지, 우리 아이가 지금 신청하는 방식이 무엇인지는 거주지 교육청과 주민센터의 안내로만 알 수 있어요. 검색으로 나온 다른 지역의 글과 다를 수 있어요.\",\"ask\":[\"우리 지역은 올해 입학 신청을 어디서 하나요?\",\"지금 다니는 곳에서 달라지는 것이 있나요?\"],\"basis\":\"유보통합 — 교육부·보건복지부 이원 체계의 일원화\",\"asOf\":\"2026년 기준\",\"byRegion\":\"시범 지역이었던 곳과 아닌 곳이 갈리고, 통합 포털의 적용 시기도 지역마다 달라요. 거주지 교육청 안내가 기준이에요.\",\"changes\":\"시행 범위와 신청 방식이 해마다 바뀌는 중이에요. 거주지 교육청이나 육아종합지원센터에서 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-short-leave\",\"kind\":\"system\",\"term\":\"육아휴직을 1~2주만 쓸 수도 있다는데\",\"also\":\"단기 육아휴직 · 배우자 지원 확대 · 어린이집 적응 기간 휴직\",\"heardFrom\":\"어린이집 적응이나 방학, 아이 입원처럼 며칠만 비는 때를 앞두고 듣게 돼요.\",\"point\":\"몇 달 단위로만 쓰던 육아휴직을 짧게 나눠 쓰는 길이 생겼어요. 회사에 미리 말해야 쓸 수 있어요.\",\"what\":\"육아휴직을 1~2주 단위로 짧게 쓰는 제도가 2026년 하반기부터 생겼다고 안내돼요. 어린이집 적응 기간, 방학, 아이가 아플 때처럼 긴 휴직은 어렵고 며칠은 꼭 필요한 때를 위한 것이에요. 아버지의 참여를 늘리려는 배우자 지원 확대와 함께 이야기돼요.\",\"known\":\"육아휴직은 법으로 정해진 제도라 회사가 거절할 수 없지만, 신청 절차와 서류는 회사마다 달라요. 짧게 나눠 쓸 때 전체 기간에서 어떻게 세는지, 급여가 어떻게 나오는지는 세부가 정해져 있어서 쓰기 전에 확인해야 해요. 쓰겠다고 말한 것 때문에 불리하게 대하는 것은 법으로 금지돼 있어요.\",\"amounts\":[{\"item\":\"단기 육아휴직\",\"value\":\"1~2주 단위로 사용\",\"note\":\"2026년 하반기부터로 안내돼요. 횟수와 세는 방식은 확인이 필요해요\"},{\"item\":\"신청\",\"value\":\"회사를 통해 미리 신청\"}],\"notAtHome\":\"우리 회사에서 언제 어떻게 신청하는지, 남은 휴직 기간이 얼마인지는 인사 담당이나 고용노동부에 확인해야만 알 수 있어요. 이 글의 날수가 우리 경우와 다를 수 있어요.\",\"ask\":[\"어린이집 적응 기간에 1~2주 휴직을 쓰려면 언제까지 신청해야 하나요?\",\"짧게 나눠 쓰면 전체 육아휴직 기간에서 어떻게 세나요?\"],\"basis\":\"남녀고용평등법 육아휴직 — 단기 분할 사용\",\"asOf\":\"2026년 기준\",\"byRegion\":\"법으로 정해진 것이라 전국이 같아요. 지역이 아니라 회사에 따라 절차와 분위기가 갈리는 항목이에요.\",\"changes\":\"분할 횟수와 급여 산정 방식이 개정으로 바뀌어요. 고용노동부 상담 창구나 회사 인사 담당자에게 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-elementary-care\",\"kind\":\"system\",\"term\":\"초등학교 돌봄은 몇 시까지 되나요\",\"also\":\"늘봄학교 · 온동네 초등돌봄 · 방과후 · 초1 돌봄 공백\",\"heardFrom\":\"입학을 앞두고 하원 시간이 갑자기 당겨진다는 것을 알았을 때 찾게 돼요.\",\"point\":\"어린이집보다 끝나는 시각이 이르다는 것이 초1 돌봄 공백의 시작이에요. 학교마다 되는 것이 달라서 그 학교에 물어야 해요.\",\"what\":\"초등학교에 들어가면 수업이 어린이집 하원보다 훨씬 이르게 끝나요. 그 뒤 시간을 학교 안에서 돌보고 가르치는 제도가 늘봄학교로 운영되어 왔고, 2026년부터는 지역과 함께 운영하는 '온동네 초등돌봄'으로 넓히는 것으로 안내돼요.\",\"known\":\"초1·2를 중심으로 시작해 넓혀 가고 있고, 저녁까지 운영하는 곳과 아닌 곳이 갈려요. 프로그램 종류, 끝나는 시각, 비용이 학교와 지역마다 달라요. 신청은 대개 입학 전후에 학교를 통해 해요. 자리가 모자라는 학교가 있어 미리 알아 두는 쪽이 나아요.\",\"amounts\":[{\"item\":\"대상\",\"value\":\"초1·2부터 넓혀 가는 중\",\"note\":\"학년과 시간은 학교마다 달라요\"},{\"item\":\"운영 시간\",\"value\":\"학교와 지역에 따라 달라요\"}],\"notAtHome\":\"우리 아이가 갈 학교에서 몇 시까지 무엇이 되는지는 그 학교의 안내로만 알 수 있어요. 옆 학교 이야기가 우리 학교와 다를 수 있어요.\",\"ask\":[\"이 학교의 돌봄은 몇 시까지, 어떤 신청으로 되나요?\",\"자리가 모자랄 때 우선순위는 어떻게 정하나요?\"],\"basis\":\"교육부 늘봄학교 · 온동네 초등돌봄\",\"asOf\":\"2026년 기준\",\"byRegion\":\"지역차가 가장 큰 항목 중 하나예요. 저녁까지 운영하는 지역과 아닌 지역, 지역 돌봄 기관과 이어진 곳과 아닌 곳이 갈려요. 입학할 학교와 거주지 교육청에서 확인해 주세요.\",\"changes\":\"제도 이름과 운영 범위가 해마다 바뀌고 있어요. 입학 전 학교 설명회나 교육청에서 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-care-service-income\",\"kind\":\"system\",\"term\":\"아이돌봄서비스는 소득이 얼마까지 되나요\",\"also\":\"아이돌봄 지원 · 소득 기준 확대 · 시간제 돌봄\",\"heardFrom\":\"돌봄이 비는 시간을 메울 길을 찾다가 소득 기준에 걸릴까 싶어 찾게 돼요.\",\"point\":\"소득 기준이 넓어졌어요. 예전에 안 됐던 집도 지금은 될 수 있어요.\",\"what\":\"나라가 운영하는 아이돌봄서비스는 돌보미가 집으로 와서 시간제나 종일로 아이를 봐주는 제도예요. 소득에 따라 정부가 비용의 일부를 대고, 그 소득 기준이 중위소득의 두 배까지로 넓어진 것으로 안내돼요.\",\"known\":\"소득 구간에 따라 본인이 내는 돈이 달라지고, 긴급 돌봄과 시간제, 종일제가 나뉘어 있어요. 기준을 넘는 집도 전액 본인 부담으로 쓸 수 있어요. 돌보는 사람이 가족이면 대상이 아니에요. 대기가 긴 지역이 있어 필요한 때보다 미리 신청해 두는 집이 많아요.\",\"amounts\":[{\"item\":\"정부 지원 소득 기준\",\"value\":\"중위소득의 두 배 이하로 확대\",\"note\":\"구간에 따라 본인 부담 비율이 달라요\"},{\"item\":\"기준 초과\",\"value\":\"전액 본인 부담으로 이용 가능\"}],\"notAtHome\":\"우리 집이 어느 구간인지, 지금 대기가 얼마나 긴지는 신청해 봐야만 알 수 있어요. 소득 산정 방식이 집마다 달라 검색으로는 가를 수 없어요.\",\"ask\":[\"우리 집 소득이면 어느 구간이고 시간당 얼마를 내나요?\",\"우리 지역은 신청하면 얼마나 기다리나요?\"],\"basis\":\"여성가족부 아이돌봄서비스\",\"asOf\":\"2026년 기준\",\"byRegion\":\"제도는 전국이 같지만 돌보미 수와 대기 기간이 지역마다 크게 달라요. 지자체가 본인 부담을 더 낮춰 주는 곳도 있어요. 거주지 서비스 제공기관에 확인해 주세요.\",\"changes\":\"소득 기준과 지원 비율이 해마다 바뀌어요. 아이돌봄서비스 누리집이나 거주지 제공기관에서 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-child-support-advance\",\"kind\":\"system\",\"term\":\"양육비를 못 받고 있는데 나라가 먼저 준다는데\",\"also\":\"양육비 선지급 · 한부모 · 양육비 이행\",\"heardFrom\":\"양육비가 끊긴 뒤 어디에 말해야 할지 찾다가 듣게 돼요.\",\"point\":\"받지 못한 양육비를 나라가 먼저 주고 나중에 상대에게 받아 내는 제도예요. 소득 기준이 없어졌다고 안내돼요.\",\"what\":\"비양육 부모가 양육비를 주지 않을 때, 나라가 아이 몫의 양육비를 먼저 지급하고 그 돈을 상대에게 받아 내는 제도예요. 처음에는 소득 기준이 있었는데 2026년 하반기부터 그 기준이 없어져 더 많은 한부모가 신청할 수 있다고 안내돼요.\",\"known\":\"신청하면 바로 나오는 것이 아니라 양육비 채권이 확인되고 상대가 주지 않는 것이 인정되는 절차가 있어요. 금액과 기간이 정해져 있고, 신청 창구가 따로 있어요. 양육비 이행과 관련된 상담도 같은 곳에서 받을 수 있어요.\",\"amounts\":[{\"item\":\"소득 기준\",\"value\":\"폐지로 안내돼요\",\"note\":\"2026년 하반기부터\"},{\"item\":\"지급\",\"value\":\"아이 한 명당 월 정액\",\"note\":\"금액과 기간은 지금 기준을 확인해 주세요\"}],\"notAtHome\":\"우리 경우가 대상인지, 어떤 서류가 필요한지는 양육비이행관리원에 물어야만 알 수 있어요. 절차가 집마다 달라요.\",\"ask\":[\"저희 경우 신청할 수 있나요? 어떤 서류가 필요한가요?\",\"신청하면 언제부터 받게 되나요?\"],\"basis\":\"양육비이행법 — 양육비 선지급 제도\",\"asOf\":\"2026년 기준\",\"byRegion\":\"법으로 정해진 것이라 전국이 같아요. 다만 지자체가 한부모 가정에 따로 주는 지원은 지역마다 달라서 주민센터에서 함께 물어볼 만해요.\",\"changes\":\"대상과 금액, 신청 요건이 개정으로 바뀌어요. 양육비이행관리원에서 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-parent-education\",\"kind\":\"system\",\"term\":\"부모교육을 무료로 들을 수 있는 곳이 있나요\",\"also\":\"공통 부모교육 · 육아종합지원센터 · 부모교육 프로그램\",\"heardFrom\":\"어린이집이나 보건소 안내문에서, 또는 아이 때문에 막막해져서 찾게 돼요.\",\"point\":\"나라와 지자체가 여는 부모교육이 있어요. 아이가 다니는 기관이 아니어도 신청할 수 있어요.\",\"what\":\"육아종합지원센터와 건강가정지원센터 같은 곳에서 부모를 대상으로 여는 교육이에요. 아이의 발달, 훈육, 부모의 마음 같은 주제를 다루고, 2026년에는 교육부와 중앙육아종합지원센터가 함께 하는 공통 부모교육이 연중 운영된다고 안내돼요. 온라인으로 듣는 과정도 있어요.\",\"known\":\"교육을 들은 부모의 양육 스트레스와 아이와의 관계가 달라진다는 연구가 여러 나라에서 쌓여 있어요. 다만 그것은 평균의 이야기이고 어떤 과정이 우리 집에 맞는지는 들어 봐야 알아요. 과정의 종류, 횟수, 비용은 센터마다 다르고 무료인 곳이 많아요.\",\"amounts\":[{\"item\":\"운영\",\"value\":\"육아종합지원센터 · 건강가정지원센터 등\",\"note\":\"온라인 과정도 있어요\"},{\"item\":\"비용\",\"value\":\"무료인 곳이 많아요\",\"note\":\"센터마다 달라 확인이 필요해요\"}],\"notAtHome\":\"우리 지역에서 올해 어떤 과정이 열리는지, 신청이 언제인지는 거주지 센터에서만 알 수 있어요.\",\"ask\":[\"우리 지역에서 부모가 들을 수 있는 교육이 지금 무엇이 있나요?\",\"일하는 부모가 들을 수 있는 저녁이나 온라인 과정이 있나요?\"],\"basis\":\"교육부·중앙육아종합지원센터 공통 부모교육\",\"asOf\":\"2026년 기준\",\"byRegion\":\"센터가 있는 시군구와 없는 곳이 갈리고, 과정의 종류와 횟수가 지역마다 달라요. 거주지 육아종합지원센터에 전화해 보는 것이 가장 빨라요.\",\"changes\":\"과정과 일정이 해마다 바뀌어요. 중앙육아종합지원센터 누리집이나 거주지 센터에서 지금 일정을 확인해 주세요.\"},{\"id\":\"fb-sns-age-ban\",\"kind\":\"saying\",\"term\":\"외국은 16세 미만 SNS를 법으로 막는다는데\",\"also\":\"SNS 연령 제한 · 호주 금지법 · 스마트폰 금지 학교\",\"heardFrom\":\"아이가 SNS 계정을 원할 때, 뉴스에서 다른 나라 소식을 보고 찾게 돼요.\",\"point\":\"여러 나라가 실제로 법을 만들었어요. 한국에는 아직 그런 법이 없고, 서비스마다 정한 가입 나이가 있어요.\",\"what\":\"호주가 2025년 말부터 16세 미만의 SNS 사용을 막는 법을 시행했고, 인도네시아·말레이시아·덴마크·프랑스 등이 15세나 16세를 기준으로 뒤따르고 있어요. 영국·캐나다·뉴질랜드도 추진 중이에요. 학교에서 폰을 쓰지 못하게 하는 흐름도 함께 커졌어요.\",\"known\":\"이 법들의 바탕에는 청소년의 마음 건강과 SNS 사용 사이의 관계를 두고 쌓인 이야기가 있어요. 다만 그 관계가 얼마나 직접적인지는 연구자 사이에서도 의견이 갈려요. 한국은 법으로 막지 않고 있고, 대부분의 서비스가 14세를 가입 나이로 정해 두고 있어요. 어느 나이가 맞는지는 정해진 답이 아니라 집마다 정하는 자리예요.\",\"notAtHome\":\"우리 아이에게 언제가 맞는지를 다른 나라의 법이 정해 주지는 않아요. 이 글도 그것을 정해 주지 않아요. 다만 '다 하는데 왜 안 돼'에 답할 때 바깥의 기준이 하나 있다는 것은 쓸 수 있어요.\",\"ask\":[\"학교에서 폰과 SNS에 대해 정해 둔 규칙이 있나요?\",\"같은 반 부모들과 기준을 맞추는 자리가 있나요?\"],\"basis\":\"각국의 미성년자 SNS 연령 제한 입법 동향\"},{\"id\":\"fb-allergen-late\",\"kind\":\"saying\",\"term\":\"땅콩이랑 달걀은 늦게 줘야 한다\",\"also\":\"알레르기 음식 늦게 시작 · 조기 도입 · 이유식 순서\",\"heardFrom\":\"이유식을 시작할 무렵 어른들에게, 그리고 예전 책과 글에서 보게 돼요.\",\"point\":\"예전 안내가 뒤집힌 자리예요. 지금은 늦추지 말고 이유식 초기에 시작하도록 권하는 쪽이 많아요.\",\"what\":\"알레르기를 일으키기 쉬운 음식은 돌이 지나서, 혹은 더 늦게 줘야 한다는 말이에요. 한때는 실제로 그렇게 안내됐어요.\",\"known\":\"지금은 여러 나라의 안내가 반대로 바뀌었어요. 이유식을 시작해 다른 음식을 먹게 되면 땅콩과 달걀 같은 음식도 늦추지 말고 소량으로 시작하도록 권해요. 늦추는 것이 오히려 알레르기와 이어진다는 연구가 쌓인 뒤의 변화예요. 다만 아이에게 이미 심한 피부 증상이 있거나 가족에 알레르기가 있으면 시작 방법을 따로 안내받아요.\",\"notAtHome\":\"우리 아이가 어떤 음식을 어떻게 시작하면 되는지는 아이의 피부 상태와 가족력을 아는 사람에게 물어야 해요. 처음 주는 날의 양과 지켜볼 것도 집에서 정하지 않아요.\",\"ask\":[\"땅콩과 달걀은 언제 어떻게 시작하면 될까요?\",\"처음 줄 때 무엇을 지켜보고 어떤 경우에 연락하면 되나요?\"],\"callNow\":\"먹은 뒤에 입이나 눈이 붓거나, 숨쉬기 힘들어하거나, 온몸에 두드러기가 빠르게 번지거나, 축 늘어지면 즉시 119에 연락하세요.\",\"basis\":\"영유아 알레르겐 조기 도입 — 바뀐 국제 안내\"},{\"id\":\"fb-upf-snacks\",\"kind\":\"saying\",\"term\":\"애들 과자가 뭐 어때서\",\"also\":\"초가공식품 · 첨가당 · 아이 간식 · 가공식품\",\"heardFrom\":\"간식을 두고 어른들과 부딪힐 때, 마트에서 아이가 조를 때 듣게 돼요.\",\"point\":\"과자 한 봉지의 문제가 아니라 하루 먹는 것의 대부분이 어디서 오느냐의 이야기예요.\",\"what\":\"아이 간식으로 과자와 가공식품을 주는 것을 두고 뭐가 문제냐는 말이에요. 반대쪽에는 초가공식품을 아예 먹이면 안 된다는 말이 함께 돌아요.\",\"known\":\"여러 나라의 식생활 지침이 최근 아이의 먹을거리에서 초가공식품과 첨가당을 줄이도록 분명하게 쓰기 시작했어요. 아이가 먹는 것의 절반 이상이 그런 음식에서 온다는 조사도 나왔어요. 다만 과자 한 봉지가 아이를 어떻게 한다는 이야기가 아니라, 하루의 대부분을 무엇으로 채우느냐의 이야기예요. 어떤 음식이 '초가공'인지의 기준도 아직 정리되는 중이에요.\",\"notAtHome\":\"우리 아이의 먹는 양과 자라는 흐름이 어떤지는 검진에서 보는 것이고, 간식의 종류로 집에서 가늠할 수 있는 것이 아니에요. 금지로 가면 몰래 먹는 길이 열려요.\",\"ask\":[\"지금 아이가 먹는 것에서 바꾸면 좋을 것이 있을까요?\",\"간식을 어떤 것으로 두면 좋을까요?\"],\"basis\":\"최근 식생활 지침의 초가공식품·첨가당 권고\"},{\"id\":\"fb-ai-friend-age\",\"kind\":\"saying\",\"term\":\"AI가 아이 친구가 될 수 있나요\",\"also\":\"AI 챗봇 · AI 동반자 앱 · AI 스피커 · 몇 살부터\",\"heardFrom\":\"아이가 AI와 긴 대화를 하는 것을 보고, 또는 AI 친구 앱 광고를 보고 찾게 돼요.\",\"point\":\"소아과 쪽 안내는 'AI는 도구이지 친구나 상담자가 아니다'로 모여요. 나이에 따라 쓰는 법이 달라요.\",\"what\":\"말을 걸면 답해 주는 AI를 아이가 친구처럼 여기는 일이 늘었어요. 외롭거나 말할 사람이 없을 때 더 그래요. AI 친구를 내세운 앱도 많이 나와요.\",\"known\":\"2026년 미국 소아과학회가 AI에 대한 안내를 냈어요. 다섯 살 이하는 AI 챗봇을 쓰지 않도록, 열두 살까지는 어른과 함께 제한해서, 그 위는 숙제와 만들기에는 쓰되 위로와 마음 상담에는 쓰지 않도록 권해요. AI가 어린아이에게는 사람과 구분되지 않고, 마음이 힘든 아이의 신호를 놓치거나 그 생각을 따라가기 쉽다는 것이 이유예요.\",\"notAtHome\":\"우리 아이가 AI를 어떻게 쓰고 있는지, 무엇을 말하고 있는지는 아이가 말해 주지 않으면 알 수 없어요. 캐묻는 대신 왜 편한지를 묻는 쪽이 길이 열려요. 무거운 이야기가 오갔다면 그것은 어른이 나설 일이에요.\",\"ask\":[\"우리 아이 나이에 AI 기기는 어디까지 쓰게 하면 될까요?\",\"아이가 마음 이야기를 AI에게만 하는 것 같은데 어디에 상의하면 되나요?\"],\"callNow\":\"AI와의 대화에서 스스로를 해치는 말이나 죽고 싶다는 말이 나왔다면 기다리지 말고 학교 상담실이나 정신건강상담 1577-0199, 자살예방상담 109로 연락하세요.\",\"basis\":\"미국 소아과학회(AAP) 2026 생성형 AI 안내 — 연령별 사용 권고\"},{\"id\":\"fb-ai-textbook\",\"kind\":\"system\",\"term\":\"AI 디지털교과서는 어떻게 됐나요\",\"also\":\"AI 교육자료 · AIDT · 학교운영위원회 심의\",\"heardFrom\":\"학교에서 태블릿 수업 안내가 오거나, 뉴스에서 폐지 이야기를 보고 찾게 돼요.\",\"point\":\"'교과서'가 아니라 '교육자료'가 됐어요. 학교가 고르는 것이고, 그 과정에 학부모 의견을 낼 자리가 있어요.\",\"what\":\"수업에서 쓰는 AI 기반 학습 프로그램이에요. 2025년부터 교과서로 전국에 도입하려 했지만, 2025년 8월 법 개정으로 교육자료로 바뀌어 의무 채택이 사라졌어요. 지금은 학교가 필요에 따라 선택해서 쓰고, 선정할 때 교육부 기준을 따르고 학교운영위원회 심의를 거치게 되어 있어요.\",\"known\":\"2025년 한 해 동안 열흘 이상 쓴 학생이 열에 하나가 안 됐고, 한 번도 접속하지 않은 학생이 절반을 넘었다는 조사가 있어요. 학부모 설문에서는 과반이 사용에 반대했어요. 쓰는 학교와 안 쓰는 학교가 갈리고, 쓰는 학교 안에서도 과목과 시간이 달라요. 아이의 학습 기록이 어디에 저장되고 언제 지워지는지는 학교와 업체에 따라 다르고, 그것을 묻는 것은 학부모가 할 수 있는 일이에요.\",\"amounts\":[{\"item\":\"지위\",\"value\":\"교과서 → 교육자료 (2025년 8월 법 개정)\",\"note\":\"의무 채택이 아니에요\"},{\"item\":\"선정\",\"value\":\"학교가 학교운영위원회 심의를 거쳐 선택\"}],\"notAtHome\":\"우리 아이 학교가 올해 무엇을 어떻게 쓰는지는 그 학교의 안내로만 알 수 있어요. 옆 학교 이야기가 우리 학교와 달라요.\",\"ask\":[\"이 학교는 어떤 과목에 어떤 AI 교육자료를 얼마나 쓰나요?\",\"아이의 학습 기록은 어디에 저장되고 언제 지워지나요? 학부모 의견은 어디에 내나요?\"],\"basis\":\"초·중등교육법 개정(2025.8) — AI 디지털교과서의 교육자료 전환\",\"asOf\":\"2026년 기준\",\"byRegion\":\"교육청과 학교마다 채택 여부가 갈려요. 지역 전체로 쓰는 곳도, 거의 안 쓰는 곳도 있어요. 다니는 학교와 거주지 교육청 안내가 기준이에요.\",\"changes\":\"정책 이름과 범위가 해마다 바뀌는 중이에요. 학교 안내나 교육청에서 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-info-class-hours\",\"kind\":\"system\",\"term\":\"AI 교육을 따로 시켜야 하나요\",\"also\":\"정보 교과 시수 확대 · 코딩 교육 · AI 중점학교\",\"heardFrom\":\"주변에서 코딩 학원 이야기가 나올 때, 학교 안내문에서 정보 수업이 늘었다는 것을 보고 찾게 돼요.\",\"point\":\"학교 안의 정보·AI 수업이 늘고 있어요. 밖에서 따로 시켜야 하는지는 학교에서 무엇을 하는지 먼저 보고 정할 일이에요.\",\"what\":\"2022 개정 교육과정부터 초등 실과와 중학교 정보 교과의 시간이 이전의 두 배 수준으로 늘었고, AI와 디지털을 중점으로 운영하는 학교와 방과후 프로그램이 함께 늘었어요. 유네스코가 정리한 학생의 AI 역량은 기술보다 '사람이 가운데 있다는 태도'와 'AI의 윤리'를 앞에 둬요.\",\"known\":\"AI 교육이 코딩을 가르치는 일과 같지는 않아요. 유네스코 틀은 네 갈래 — 사람 중심의 태도, AI의 윤리, AI 기술과 쓰임, AI 설계 — 로 정리되고, 앞의 둘은 학원이 아니라 집과 학교의 대화에서 길러진다고 봐요. 학교 교육과정에 AI를 넣은 나라는 아직 소수라, 대부분의 아이가 학교 밖에서 AI를 배우고 있다는 것도 함께 이야기돼요.\",\"amounts\":[{\"item\":\"초등 실과·중학 정보 시간\",\"value\":\"이전의 두 배 수준으로 확대\",\"note\":\"학년과 학교에 따라 실제 시간은 달라요\"},{\"item\":\"AI·디지털 중점학교\",\"value\":\"지역마다 지정된 학교가 있어요\"}],\"notAtHome\":\"우리 아이 학교에서 정보 수업을 몇 시간 어떻게 하는지, 방과후에 무엇이 있는지는 학교 안내로만 알 수 있어요. 따로 시킬지는 그것을 보고 정해도 늦지 않아요.\",\"ask\":[\"이 학교의 정보·AI 수업은 몇 학년에 어떤 내용으로 하나요?\",\"방과후나 지역에서 무료로 들을 수 있는 AI·디지털 과정이 있나요?\"],\"basis\":\"2022 개정 교육과정 정보 교과 시수 · 유네스코 학생 AI 역량 틀(2024, 2026 갱신)\",\"asOf\":\"2026년 기준\",\"byRegion\":\"중점학교 지정과 방과후 프로그램은 교육청마다 달라요. 거주지 교육청 안내를 확인해 주세요.\",\"changes\":\"교육과정 적용 학년과 시수, 지정 학교가 해마다 바뀌어요. 학교 안내나 교육청에서 지금 기준을 확인해 주세요.\"},{\"id\":\"fb-deepfake-help\",\"kind\":\"system\",\"term\":\"딥페이크 피해를 당했을 때 어디에 연락하나요\",\"also\":\"디지털 성범죄 · 삭제 지원 · 학교폭력 신고\",\"heardFrom\":\"아이가 겪었다는 것을 알게 된 순간, 또는 학교에서 예방교육 안내가 왔을 때 찾게 돼요.\",\"point\":\"삭제 지원, 상담, 신고가 각각 다른 창구예요. 번호를 미리 저장해 두면 그날 검색하지 않아도 돼요.\",\"what\":\"아이의 사진이나 영상이 AI로 가공되어 퍼지는 피해예요. 청소년 사이의 사이버 성폭력이 몇 년 사이 크게 늘었고 그중 상당수가 딥페이크라는 조사가 있어요. 피해를 겪은 아이의 상당수가 스스로를 해치고 싶은 생각을 했다는 결과도 함께 나와요. 교육부는 학교 예방교육을 늘리고 학부모용 대응 안내를 배포하고 있어요.\",\"known\":\"이것은 나이와 상관없이 법이 다루는 범죄예요. 디지털성범죄피해자지원센터가 삭제 지원과 상담을 하고, 학교 안의 일이면 학교폭력 절차로도 다뤄져요. 경찰 신고는 그와 별개로 할 수 있어요. 돌고 있는 것을 지우기 전에 어른이 기록을 남기는 것이 뒤의 절차에 쓰여요. 아이에게 가장 먼저 할 말은 '네 잘못이 아니다'예요.\",\"amounts\":[{\"item\":\"디지털성범죄피해자지원센터\",\"value\":\"02-735-8994\",\"note\":\"삭제 지원 · 상담\"},{\"item\":\"학교폭력 신고\",\"value\":\"117\"},{\"item\":\"청소년 상담\",\"value\":\"1388\",\"note\":\"아이가 스스로를 해칠 것 같으면 자살예방상담 109\"}],\"notAtHome\":\"어디까지 퍼졌는지, 누가 만들었는지를 부모가 혼자 알아내려 하면 더 퍼뜨리거나 아이를 더 다치게 하기 쉬워요. 그 일은 기관이 해요.\",\"ask\":[\"학교에서는 이런 일이 생기면 어떤 절차로 다루나요?\",\"학부모용 대응 안내 자료를 받을 수 있나요?\"],\"basis\":\"성폭력처벌법 · 교육부 디지털 성범죄 예방교육 · 디지털성범죄피해자지원센터\",\"asOf\":\"2026년 기준\",\"byRegion\":\"전국 공통 창구가 있고, 서울 등 일부 지역은 지자체 센터가 따로 있어요. 학교의 대응 절차는 교육청마다 조금씩 달라요.\",\"changes\":\"연락처와 지원 범위, 학교 절차가 바뀔 수 있어요. 번호는 쓰기 전에 한 번 확인해 주세요.\"},{\"id\":\"fb-ai-toy-listens\",\"kind\":\"saying\",\"term\":\"AI 인형이 아이 말을 다 들어 준대요\",\"also\":\"말하는 인형 · AI 장난감 · 대화형 로봇\",\"heardFrom\":\"선물로 받거나 광고에서 보고, 아이가 인형과 길게 이야기하는 것을 보고 찾게 돼요.\",\"point\":\"조사에서 답변의 넷 중 하나가 아이에게 맞지 않았고, 대화 기록이 밖으로 새어 나간 제품도 있었어요.\",\"what\":\"말을 걸면 대답하고 이야기를 나누는 인형과 로봇이에요. 아이의 말을 들어 주고 외롭지 않게 해 준다고 소개돼요.\",\"known\":\"2025~2026년 미국의 소비자 조사에서 AI 장난감 답변의 약 사분의 일이 아이에게 맞지 않는 내용이었어요 — 자해, 약물, 성적인 내용, 위험한 것을 다루는 방법이 섞여 있었어요. 어떤 인형은 아이들의 대화 기록과 이름, 생일이 밖에서 열렸어요. 미국의 한 주는 어린이용 AI 장난감 판매를 막았어요. 소아과 쪽 안내는 다섯 살 이하의 AI 대화 자체를 권하지 않아요. 아이가 기계와 사람을 아직 나누지 못하기 때문이에요.\",\"notAtHome\":\"우리 집 인형이 무슨 말을 하는지, 녹음이 어디로 가는지는 겉으로 알 수 없어요. 설정과 안내문에서 확인이 안 되면 그것이 답이에요.\",\"ask\":[\"이 나이에 말하는 기계와 지내는 것을 어떻게 보시나요?\",\"아이가 인형에게만 하는 말이 있는데 어떻게 받아 주면 될까요?\"],\"basis\":\"미국 PIRG 'Trouble in Toyland' AI 장난감 조사(2025) · AAP 생성형 AI 안내(2026)\"},{\"id\":\"fb-ai-symptom-answer\",\"kind\":\"saying\",\"term\":\"챗GPT한테 물어보면 바로 알려 준다\",\"also\":\"AI에게 증상 묻기 · 챗봇 건강 상담 · AI 진료\",\"heardFrom\":\"밤에 아이가 아플 때, 또는 다른 부모가 그렇게 한다는 말을 듣고 찾게 돼요.\",\"point\":\"소아 증례로 재 보면 챗봇이 맞게 짚는 경우가 열에 둘이 안 됐어요. 말이 확신에 차 있어서 틀린 답도 맞게 들려요.\",\"what\":\"아이의 증상을 챗봇에 설명하면 무엇인지, 어떻게 하면 되는지 바로 답을 준다는 말이에요. 부모 셋 중 하나가 아이 건강 정보에 챗봇을 쓴다는 조사가 있어요.\",\"known\":\"소아 증례 백 개로 재 본 연구에서 챗봇이 맞게 짚은 것은 열일곱 개였어요. 나머지는 틀렸거나 너무 넓어서 쓸 수 없는 답이었어요. 챗봇은 아이를 본 적이 없고 진찰을 할 수 없고 틀려도 책임지는 사람이 없어요. 소아과학회의 안내는 'AI는 도구이지 의료인이 아니다'로 모여요. 다만 진료에서 무엇을 물어볼지 정리하는 데 쓰는 것과, 아이 상태를 가리는 데 쓰는 것은 다른 일이에요.\",\"notAtHome\":\"이 앱도 챗봇도 아이 상태를 가리지 않아요. 열·경련·숨쉬기·축 처짐처럼 급한 신호는 묻지 말고 바로 연락하는 것이 순서예요. 챗봇이 '지켜보라'고 한 답을 믿고 밤을 넘긴 것이 가장 흔한 늦어지는 길이에요.\",\"ask\":[\"밤에 아이가 아프면 저희는 어디로 연락하면 되나요?\",\"챗봇에서 본 내용이 있는데 제 아이 경우는 어떻게 보시나요?\"],\"callNow\":\"열이 나면서 축 처져 깨우기 어렵거나, 숨쉬기 힘들어하거나, 경련을 일으키거나, 물을 넘기지 못하면 챗봇에 묻지 말고 바로 연락하세요.\",\"basis\":\"소아 증례 기반 챗봇 정확도 연구(2026) · AAP 생성형 AI 정책(2026)\"},{\"id\":\"fb-ai-tutor-no-hagwon\",\"kind\":\"saying\",\"term\":\"AI 튜터 쓰면 과외 안 해도 된다\",\"also\":\"AI 학습 앱 · 숙제 도우미 · 개인 맞춤 학습\",\"heardFrom\":\"학습 앱 광고에서, 그리고 사교육비를 두고 고민할 때 듣게 돼요.\",\"point\":\"튜터링 자체는 효과가 큰 방법이에요. 다만 AI 튜터는 답을 주는 것인지 생각하게 하는 것인지에 따라 결과가 몇 배 갈려요.\",\"what\":\"AI가 아이 수준에 맞춰 가르쳐 주니 사람 과외가 필요 없다는 말이에요. 반대쪽에는 AI를 쓰면 생각하는 힘이 준다는 말이 함께 돌아요.\",\"known\":\"일대일 튜터링은 교육 연구에서 가장 효과가 큰 방법 중 하나로 꾸준히 나와요. AI 튜터도 그 자리를 일부 할 수 있다는 결과가 있지만, 도구에 따라 크게 갈려요 — 한 단계씩 묻는 튜터형 도구를 쓴 학생과 답을 바로 주는 챗봇을 쓴 학생의 혼자 풀기 성적이 몇 배 차이 났다는 조사가 있어요. 생각을 도구에 넘기는 습관이 들면 도구가 없는 시험에서 그대로 드러나고, 교사의 상당수가 글쓰기와 문제 해결력이 떨어지는 것을 봤다고 답했어요.\",\"notAtHome\":\"우리 아이가 어느 쪽으로 쓰고 있는지는 앱 점수로는 알 수 없어요. 앱에서 맞은 것을 종이로 다시 풀어 보면 보여요.\",\"ask\":[\"학교에서 AI 학습 도구를 쓰는 데 정해 둔 기준이 있나요?\",\"아이가 혼자 풀 수 있는지를 집에서 어떻게 확인하면 될까요?\"],\"basis\":\"튜터링 효과 연구 종합 · AI 튜터 도구 유형별 비교(2025~2026)\"},{\"id\":\"fb-single-parent-support\",\"kind\":\"system\",\"term\":\"한부모가족 지원은 누가 얼마나 받나요\",\"also\":\"한부모가족 아동양육비 · 한부모 증명서 · 청소년한부모\",\"heardFrom\":\"헤어진 뒤 주민센터에서, 또는 같은 처지의 부모에게서 듣게 돼요.\",\"point\":\"소득 기준에 들면 아이 한 명당 매달 정해진 양육비를 받아요. 증명서가 있으면 보육료·급식비·주거 쪽 지원이 따라와요.\",\"what\":\"아이를 혼자 키우는 가정이 소득 기준 안에 들면 한부모가족으로 등록하고, 아이 한 명당 매달 아동양육비를 받는 제도예요. 등록하면 한부모가족 증명서가 나오고, 그것으로 어린이집 우선 입소, 학비·급식비 감면, 공공임대 가점 같은 지원을 함께 받을 수 있어요. 만 24세 이하의 청소년 한부모에게는 금액과 지원이 더 있어요.\",\"known\":\"소득 기준은 해마다 바뀌고, 아이 나이에 따라 금액이 달라요. 양육비를 받고 있어도 소득 산정에 들어가는 방식이 있어서 신청해 봐야 알아요. 등록은 거주지 주민센터에서 하고, 혼인 중 별거 상태로는 대상이 아닌 경우가 있어요. 등록 자체가 아이 학교나 주변에 알려지는 것은 아니에요.\",\"notAtHome\":\"우리 집이 기준에 드는지는 소득과 재산을 함께 보기 때문에 검색으로는 가를 수 없어요. 전에 안 됐어도 기준이 바뀌었을 수 있으니 주민센터에서 지금 기준으로 다시 물어보는 것이 맞아요.\",\"basis\":\"한부모가족지원법 — 아동양육비·복지급여\",\"byRegion\":\"법으로 정한 지원은 전국이 같지만, 지자체가 따로 얹어 주는 양육비·주거·교육 지원이 지역마다 달라요. 거주지 주민센터에서 함께 물어보세요.\",\"changes\":\"소득 기준과 금액이 해마다 바뀌어요. 주민센터나 한부모가족 상담전화 1644-6621에서 지금 기준을 확인해 주세요.\",\"asOf\":\"2026년 기준\",\"ask\":[\"저희 소득이면 한부모가족 등록이 되나요? 어떤 서류가 필요한가요?\",\"증명서로 받을 수 있는 다른 지원(보육·학비·주거)은 무엇이 있나요?\"],\"amounts\":[{\"item\":\"아동양육비\",\"value\":\"아이 한 명당 월 정액\",\"note\":\"아이 나이와 소득 구간에 따라 달라요 — 지금 기준을 확인해 주세요\"},{\"item\":\"등록\",\"value\":\"거주지 주민센터\",\"note\":\"한부모가족 증명서 발급\"},{\"item\":\"상담\",\"value\":\"1644-6621\",\"note\":\"한부모가족 상담전화\"}]},{\"id\":\"fb-custody-three-words\",\"kind\":\"system\",\"term\":\"친권·양육권·양육비는 뭐가 다른가요\",\"also\":\"친권자 · 양육자 지정 · 협의이혼 · 양육비 산정\",\"heardFrom\":\"헤어지는 과정에서 법원과 서류에서 보게 되고, 주변에서 섞어 쓰는 말을 듣게 돼요.\",\"point\":\"세 가지는 다른 것이에요. 누가 법적 대리인인지, 누가 같이 살며 키우는지, 상대가 얼마를 보태는지.\",\"what\":\"친권은 아이의 법적 대리인으로서 중요한 결정(학교·수술·재산)을 하는 권한이고, 양육권은 아이와 함께 살며 키우는 것이에요. 둘을 한 사람이 다 가질 수도, 나눌 수도 있어요. 양육비는 함께 살지 않는 쪽이 아이의 생활비로 보태는 돈이고, 헤어질 때 정해요. 협의이혼이든 재판이든 아이가 있으면 이 세 가지를 정해야 끝나요.\",\"known\":\"양육비는 법원의 산정 기준표를 바탕으로 두 사람의 소득과 아이 나이로 정해지고, 나중에 사정이 바뀌면 다시 정할 수 있어요. 정했는데 안 주면 양육비이행관리원이 받아 내는 절차를 돕고, 못 받는 동안 나라가 먼저 주는 길이 있어요. 헤어진 뒤에도 양쪽 다 부모라는 것은 바뀌지 않고, 함께 살지 않는 쪽이 아이를 만나는 것(면접교섭)도 함께 정해요.\",\"notAtHome\":\"우리 경우에 누가 무엇을 갖는 것이 아이에게 맞는지는 둘의 사정과 아이의 나이에 따라 달라서 글로 가를 수 없어요. 법률구조공단(132)이나 가정법원의 상담에서 우리 경우를 물어보는 것이 맞아요.\",\"basis\":\"민법 — 친권·양육자 지정 · 가정법원 양육비 산정기준표\",\"byRegion\":\"법은 전국이 같아요. 다만 가정법원마다 상담·조정 절차의 모양이 조금씩 다르고, 지자체의 법률 상담 창구가 따로 있는 곳이 있어요.\",\"changes\":\"양육비 산정 기준표와 이행 제도가 개정으로 바뀌어요. 법률구조공단이나 양육비이행관리원에서 지금 기준을 확인해 주세요.\",\"asOf\":\"2026년 기준\",\"ask\":[\"저희 경우 친권과 양육권을 어떻게 정하는 것이 아이에게 맞을까요?\",\"양육비는 어떻게 정해지고, 안 주면 어디에 말하면 되나요?\"],\"amounts\":[{\"item\":\"법률 상담\",\"value\":\"법률구조공단 132\",\"note\":\"소득 기준에 따라 무료\"},{\"item\":\"양육비 이행\",\"value\":\"양육비이행관리원 1644-6621\",\"note\":\"받아 내는 절차 · 선지급 제도\"}]},{\"id\":\"fb-visitation-how\",\"kind\":\"system\",\"term\":\"면접교섭은 어떻게 정하나요\",\"also\":\"면접교섭권 · 만나는 날 · 면접교섭 센터 · 아이가 안 가겠다고 할 때\",\"heardFrom\":\"헤어질 때 법원에서, 그리고 만나는 날마다 부딪히며 듣게 돼요.\",\"point\":\"함께 살지 않는 부모가 아이를 만나는 것은 아이의 권리이기도 해요. 날짜와 방식을 정해 두는 것이고, 안 지켜지거나 위험하면 법원에서 바꿀 수 있어요.\",\"what\":\"헤어진 뒤 함께 살지 않는 부모가 아이를 만나는 것을 면접교섭이라고 해요. 얼마나 자주, 어디서, 어떻게 주고받을지를 헤어질 때 정하고, 정한 대로 안 되면 법원에 조정을 청할 수 있어요. 두 사람이 마주치기 어려운 경우 법원의 면접교섭 센터처럼 중간에서 아이를 넘겨주고 만남을 지켜보는 자리를 쓸 수 있어요.\",\"known\":\"만나는 것이 아이에게 해로운 사정(폭력·학대·중독)이 있으면 법원이 제한하거나 방식을 바꿀 수 있어요. 반대로 한쪽이 이유 없이 만남을 막으면 그것도 법원에 청할 수 있는 일이에요. 아이가 크면 아이의 뜻이 점점 더 반영돼요. 아이가 안 가겠다고 할 때 강제로 보내는 것도, 그 말을 핑계로 안 보내는 것도 다 걸리는 일이라 그때는 상담을 끼우는 집이 많아요.\",\"notAtHome\":\"우리 집의 만남이 어떤 모양이어야 아이에게 맞는지는 둘의 관계와 아이의 나이에 따라 달라서 글로 가를 수 없어요. 가정법원의 상담이나 면접교섭 센터, 건강가정지원센터에서 우리 경우를 물어보는 것이 맞아요.\",\"basis\":\"민법 — 면접교섭권 · 가정법원 면접교섭 센터\",\"byRegion\":\"면접교섭 센터가 있는 법원과 없는 법원이 갈려요. 거주지 가정법원과 건강가정지원센터에 물어보세요.\",\"changes\":\"센터의 운영과 절차가 바뀔 수 있어요. 가정법원에서 지금 기준을 확인해 주세요.\",\"asOf\":\"2026년 기준\",\"ask\":[\"주고받을 때 마주치지 않는 방법이 있나요?\",\"아이가 가기 싫다고 하면 어떻게 해야 하나요?\"],\"amounts\":[{\"item\":\"조정·변경\",\"value\":\"거주지 가정법원\",\"note\":\"약속이 안 지켜지거나 위험할 때\"},{\"item\":\"상담\",\"value\":\"건강가정지원센터 · 1644-6621\",\"note\":\"면접교섭 상담·지원\"}]},{\"id\":\"fb-school-family-form\",\"kind\":\"system\",\"term\":\"학교 서류에 가족 사항을 꼭 적어야 하나요\",\"also\":\"가정환경 조사서 · 보호자 칸 · 비상연락처 · 한부모 표시\",\"heardFrom\":\"입학이나 새 학기에 학교에서 서류가 올 때 보게 돼요.\",\"point\":\"학교가 꼭 알아야 하는 것은 보호자가 누구이고 급할 때 어디로 연락하는지예요. 집의 모양을 적는 칸은 비워도 돼요.\",\"what\":\"새 학기에 오는 서류에는 보호자, 비상연락처, 가족 사항 같은 칸이 있어요. 학교가 실제로 쓰는 것은 보호자가 누구인지(알림·동의·상담 대상)와 급할 때 연락할 사람이에요. 가족 구성이나 부모의 직업처럼 교육과 상관없는 것은 적지 않아도 되고, 요즘은 그 칸을 없앤 학교가 많아요.\",\"known\":\"보호자 칸에는 아이를 실제로 키우는 사람을 적으면 돼요. 다른 쪽 부모에게 학교 알림이 가지 않게 하고 싶거나, 반대로 가게 하고 싶으면 담임에게 따로 말해 두는 것이 가장 분명해요. 한부모라는 것을 학교에 알릴지는 선택이지만, 급식비·학비 감면 같은 지원을 받으려면 행정실에는 서류가 가요. 그것이 담임이나 반 친구에게 알려지는 것은 아니에요.\",\"notAtHome\":\"이 학교의 서류가 무엇을 묻고 무엇에 쓰는지는 그 학교의 안내로만 알 수 있어요. 비워도 되는지 애매하면 담임에게 물어보면 돼요.\",\"basis\":\"학교생활기록 작성 지침 · 개인정보 최소 수집\",\"byRegion\":\"서류의 모양은 학교마다, 교육청마다 달라요. 다니는 학교의 안내가 기준이에요.\",\"changes\":\"서류 양식과 수집 항목이 바뀌고 있어요. 학교에서 지금 양식을 확인해 주세요.\",\"asOf\":\"2026년 기준\",\"ask\":[\"보호자 칸에 저만 적으면 되나요? 알림은 어디로 가나요?\",\"급식비·학비 감면을 신청하면 담임 선생님도 알게 되나요?\"],\"amounts\":[{\"item\":\"꼭 적는 것\",\"value\":\"보호자 · 비상연락처\",\"note\":\"\"},{\"item\":\"안 적어도 되는 것\",\"value\":\"가족 구성 · 직업 등 교육과 무관한 것\",\"note\":\"학교마다 양식이 달라요\"}]},{\"id\":\"fb-child-surname-change\",\"kind\":\"system\",\"term\":\"아이 성을 바꿀 수 있나요\",\"also\":\"성·본 변경 · 재혼 뒤 성 · 친양자 입양\",\"heardFrom\":\"재혼을 앞두고, 또는 아이가 학교에서 성이 다르다는 말을 듣고 찾게 돼요.\",\"point\":\"가정법원에 청구해서 바꿀 수 있어요. 아이의 복리를 기준으로 법원이 정하고, 아이가 크면 아이의 뜻을 들어요.\",\"what\":\"아이의 성과 본을 바꾸려면 가정법원에 성·본 변경을 청구해요. 재혼한 배우자의 성으로 바꾸는 경우가 많고, 그것과 별개로 재혼 배우자가 아이를 친양자로 입양하면 법적으로 완전히 그 집의 아이가 돼요. 성만 바꾸는 것과 입양은 다른 절차이고 무게도 달라요.\",\"known\":\"법원은 아이에게 이로운지를 기준으로 봐요. 아이의 나이, 아이의 뜻, 생부모와의 관계, 바꾸려는 이유를 함께 보고, 아이가 어느 정도 자랐으면 아이의 의견을 직접 들어요. 생부모의 동의가 꼭 필요한 것은 아니지만 의견을 묻는 절차가 있어요. 바꾼 뒤에 아이가 다시 되돌리고 싶어 하는 경우도 있어서, 아이의 뜻을 먼저 보는 것이 이야기의 중심이에요.\",\"notAtHome\":\"우리 아이에게 바꾸는 것이 맞는지는 아이의 마음과 생부모와의 관계에 따라 달라서 어른들끼리 정할 일이 아니에요. 법률구조공단이나 가정법원 상담에서 절차를 묻되, 아이의 뜻은 따로 들어 보세요.\",\"basis\":\"민법 — 성·본 변경 · 친양자 입양\",\"byRegion\":\"법은 전국이 같아요. 가정법원마다 필요한 서류와 기간이 조금 달라요.\",\"changes\":\"절차와 서류가 개정으로 바뀔 수 있어요. 법률구조공단(132)에서 지금 기준을 확인해 주세요.\",\"asOf\":\"2026년 기준\",\"ask\":[\"성만 바꾸는 것과 입양은 아이에게 무엇이 다른가요?\",\"아이의 뜻은 어떻게 반영되나요?\"],\"amounts\":[{\"item\":\"청구\",\"value\":\"거주지 가정법원\",\"note\":\"성·본 변경 심판 청구\"},{\"item\":\"상담\",\"value\":\"법률구조공단 132\",\"note\":\"\"}]},{\"id\":\"fb-single-parent-child-outcome\",\"kind\":\"saying\",\"term\":\"한부모 집 아이는 문제가 생긴다\",\"also\":\"결손가정 · 아빠(엄마) 없이 크면 · 이혼 가정 아이\",\"heardFrom\":\"헤어지기로 했을 때 주변에서, 아이에게 무슨 일이 생길 때마다 듣게 돼요.\",\"point\":\"집의 모양이 아니라 집 안의 갈등과 돌봄의 안정이 아이에게 남는 것으로 봐요. 매일 싸우는 두 부모보다 안정된 한 부모가 낫다는 이야기가 쌓여 있어요.\",\"what\":\"부모가 헤어지면 아이가 잘못 자란다는 말이에요. 헤어지기로 한 사람에게 가장 무겁게 오는 말이고, 아이가 어떤 일을 겪을 때마다 '그래서'로 돌아와요.\",\"known\":\"여러 나라의 연구가 오래 쌓였고, 거기서 반복되는 것은 집의 모양 자체보다 집 안의 갈등, 돌봄이 안정적인지, 경제적 어려움이 아이에게 남는다는 쪽이에요. 매일 다투는 두 부모와 사는 아이보다 안정된 한 부모와 사는 아이가 더 잘 지낸다는 결과가 많아요. 헤어지는 과정 자체는 아이에게 큰일이라 그 시기에 흔들리는 것은 흔하지만, 그것이 평생 가는 것은 아니에요. 헤어진 뒤에 두 어른이 아이 앞에서 계속 싸우는 집에서 어려움이 오래가요.\",\"notAtHome\":\"우리 아이가 지금 겪는 어려움이 집의 모양 때문인지는 그 말로 알 수 없어요. 같은 나이의 아이가 흔히 겪는 일인 경우가 대부분이고, 걱정되면 그 어려움 자체를 상담에서 보는 것이 맞아요.\",\"basis\":\"가족 구조와 아동 발달 연구 — 갈등·안정성·경제 요인\",\"ask\":[\"지금 아이가 보이는 모습이 이 나이에 흔한 것인가요, 따로 볼 것인가요?\",\"헤어진 뒤 아이를 위해 우리가 가장 먼저 지킬 것은 무엇인가요?\"]},{\"id\":\"fb-single-parent-manners\",\"kind\":\"saying\",\"term\":\"혼자 키우면 버릇이 없다\",\"also\":\"한부모라서 그렇다 · 아빠(엄마) 없이 커서 · 가정교육이 안 됐다\",\"heardFrom\":\"아이가 밖에서 흐트러질 때, 명절에, 기관에서 전해 듣게 돼요.\",\"point\":\"가정교육이라고 불리는 것의 재료는 어른의 수가 아니라 같은 규칙의 반복이에요. 혼자서도 되고, 둘이어도 안 되는 집이 있어요.\",\"what\":\"혼자 키우는 집 아이는 가르칠 사람이 모자라서 버릇이 없다는 말이에요. 아이가 인사를 안 하거나 떼를 쓰는 장면에 '그래서'로 붙어 와요.\",\"known\":\"아이가 예절과 규칙을 익히는 데 필요한 것으로 이야기되는 것은 같은 규칙이 매일 반복되는 것, 안 된다는 말이 흔들리지 않는 것, 그리고 따뜻함이에요. 어른이 둘이어도 규칙이 서로 다르거나 매일 바뀌면 아이는 기준을 찾지 못하고, 혼자여도 같은 규칙이 매일 같으면 익혀요. 혼자 키우는 집에서 실제로 걸리는 것은 가르칠 사람이 아니라 기다릴 시간과, 미안함이 규칙을 녹이는 것, 남의 눈 때문에 밖에서 더 다그치게 되는 것이에요. 그것은 어른의 수가 아니라 다룰 수 있는 자리예요.\",\"notAtHome\":\"우리 아이의 어떤 모습이 가정교육의 문제인지 아닌지는 그 말로 알 수 없어요. 그 나이에 흔한 일인 경우가 대부분이고, 걱정되면 그 장면 하나를 두고 보는 것이 맞아요. 집의 모양을 두고 하는 말은 아이의 장면이 아니라 말하는 사람의 생각이에요.\",\"basis\":\"훈육 연구 — 일관성·온정이 결과를 정한다는 관점\",\"ask\":[\"지금 아이의 이 모습이 이 나이에 흔한 것인가요?\",\"혼자 키우는 집에서 규칙을 지키기 쉽게 하는 방법이 있을까요?\"]},{\"id\":\"fb-survivor-pension\",\"kind\":\"system\",\"term\":\"배우자가 세상을 떠나면 유족연금은 어떻게 되나요\",\"also\":\"유족연금 · 유족급여 · 유족보상 · 사망일시금\",\"heardFrom\":\"장례를 치른 뒤 회사나 주민센터, 같은 일을 겪은 사람에게서 듣게 돼요.\",\"point\":\"떠난 사람이 국민연금에 들어 있었으면 남은 배우자와 아이에게 매달 유족연금이 나와요. 일 때문에 떠났으면 산재 유족급여가 따로 있고, 공무원·교직원·군인은 그 연금에서 나와요. 신청하지 않으면 나오지 않아요.\",\"what\":\"국민연금에 일정 기간 이상 들어 있던 사람이 세상을 떠나면, 그 사람이 받았을 연금의 일부가 남은 가족에게 매달 나오는 제도예요. 받는 순서는 배우자가 먼저이고, 배우자가 없으면 아이예요. 떠난 것이 일과 관련이 있으면 근로복지공단의 유족급여가 따로 있고, 두 가지가 겹치면 조정돼요. 공무원·사립학교 교직원·군인은 각자의 연금 제도에서 유족연금이 나와요. 교통사고나 범죄로 떠났으면 자동차보험·범죄피해자 구조금 같은 다른 길도 있어요.\",\"known\":\"신청해야 나오고, 떠난 날부터 신청까지 기한이 있어요. 기한을 넘기면 지난 몫은 일부만 돌아와요. 남은 배우자가 일을 해서 소득이 있으면 일정 나이까지 지급이 멈추거나 줄어들 수 있고, 아이는 정해진 나이까지 받아요. 재혼하면 배우자 몫은 끝나지만 아이 몫은 그대로예요. 들어 있던 기간이 짧으면 연금이 아니라 한 번에 나오는 사망일시금이 될 수 있어요. 가입 기록은 국민연금공단(1355)에서 확인할 수 있어요.\",\"notAtHome\":\"우리 집이 얼마를 언제까지 받는지는 떠난 사람의 가입 기간과 소득, 남은 배우자의 나이와 소득, 아이의 나이가 함께 들어가서 검색으로는 알 수 없어요. 떠난 분의 주민등록번호와 가족관계증명서를 가지고 국민연금공단 지사에 가서 그대로 물어보는 것이 맞아요. 일 때문에 떠났다면 회사가 아니라 근로복지공단(1588-0075)에 직접 물어보세요.\",\"basis\":\"국민연금법 — 유족연금 · 산업재해보상보험법 — 유족급여\",\"byRegion\":\"국민연금과 산재는 전국이 같아요. 지자체가 따로 두는 위기가정·한부모 긴급 지원은 지역마다 달라서 주민센터에서 함께 물어보세요.\",\"changes\":\"지급 비율과 소득 기준, 아이가 받는 나이의 끝이 법 개정으로 바뀌어요. 국민연금공단 1355에서 지금 기준을 확인해 주세요.\",\"asOf\":\"2026년 기준\",\"ask\":[\"떠난 사람의 가입 기간이면 유족연금이 나오나요, 일시금인가요? 신청 기한은 언제까지인가요?\",\"제가 일을 하면 지급이 멈추나요? 아이 몫은 몇 살까지 나오나요?\"],\"amounts\":[{\"item\":\"국민연금 유족연금\",\"value\":\"국민연금공단 1355\",\"note\":\"가입 기간에 따라 받았을 연금의 일부가 매달\"},{\"item\":\"산재 유족급여\",\"value\":\"근로복지공단 1588-0075\",\"note\":\"일과 관련된 사망일 때 — 연금 또는 일시금\"},{\"item\":\"신청 기한\",\"value\":\"사망일부터 정해진 기간\",\"note\":\"넘기면 지난 몫이 일부만 돌아와요 — 먼저 확인해 주세요\"}]},{\"id\":\"fb-after-death-paperwork\",\"kind\":\"system\",\"term\":\"배우자가 떠난 뒤 아이와 관련해 해야 하는 일은 무엇인가요\",\"also\":\"사망신고 · 안심상속 원스톱 · 친권 · 미성년 상속 · 특별대리인 · 한정승인\",\"heardFrom\":\"장례 뒤 주민센터에서, 또는 상속 이야기가 나올 때 듣게 돼요.\",\"point\":\"친권은 남은 부모에게 그대로 있어요. 따로 할 일은 사망신고, 떠난 사람의 재산과 빚을 한 번에 조회하는 신청, 그리고 아이 몫의 상속을 어떻게 할지 정하는 것 세 가지예요. 빚이 재산보다 많아 보이면 기한 안에 움직여야 해요.\",\"what\":\"배우자가 세상을 떠나면 남은 부모가 혼자 친권자가 되고, 그것은 신청하지 않아도 그대로예요. 할 일은 한 달 안에 하는 사망신고, 사망신고와 함께 신청하는 안심상속 원스톱 서비스(떠난 사람의 예금·보험·연금·부동산·빚·세금을 한 번에 조회), 그리고 상속이에요. 아이도 상속인이어서 아이 몫이 따로 있어요. 부모와 아이가 함께 상속인이면 서로 이해가 엇갈리는 자리라, 아이 몫을 두고 나누거나 포기하거나 한정승인을 할 때는 법원에서 아이를 위한 특별대리인을 정해야 하는 경우가 있어요.\",\"known\":\"빚이 재산보다 많을 수 있으면 떠난 것을 안 날부터 정해진 기한 안에 상속포기나 한정승인을 법원에 신청해야 하고, 아이 몫도 따로 해야 해요. 그 기한을 넘기면 빚을 그대로 받게 될 수 있어요. 숨은 빚은 안심상속 조회로 대부분 나오지만 전부는 아니에요. 보험금은 상속과 다르게 수익자가 받고, 수익자가 아이면 아이 이름의 통장이 필요해요. 아이 이름으로 받은 돈을 부모가 쓰는 데도 제한이 있어요.\",\"notAtHome\":\"우리 집 상속을 포기해야 하는지, 한정승인이 맞는지, 특별대리인이 필요한지는 재산과 빚의 모양에 따라 달라서 혼자 정하면 안 돼요. 대한법률구조공단(132)에서 무료로 상담받을 수 있고, 가정법원 민원실에서도 안내해요. 기한이 있으니 장례 뒤 몇 주 안에 한 번 물어보는 것이 맞아요.\",\"basis\":\"민법 — 친권 · 상속 · 한정승인 · 특별대리인\",\"byRegion\":\"법은 전국이 같아요. 사망신고와 안심상속 신청은 어느 주민센터에서도 할 수 있어요.\",\"changes\":\"안심상속에서 조회되는 항목이 늘어나고, 상속 관련 기한과 절차가 바뀔 수 있어요. 법률구조공단 132에서 지금 기준을 확인해 주세요.\",\"asOf\":\"2026년 기준\",\"ask\":[\"아이 몫 상속을 두고 특별대리인이 필요한 경우인가요?\",\"빚이 얼마인지 모르는데 한정승인을 해 두는 것이 맞나요? 기한은 언제까지인가요?\"],\"amounts\":[{\"item\":\"사망신고\",\"value\":\"한 달 안에\",\"note\":\"주민센터 — 안심상속 원스톱도 함께 신청\"},{\"item\":\"상속포기·한정승인\",\"value\":\"안 날부터 정해진 기한\",\"note\":\"가정법원 — 아이 몫은 따로\"},{\"item\":\"무료 법률상담\",\"value\":\"132\",\"note\":\"대한법률구조공단\"}]},{\"id\":\"fb-child-grief-counsel\",\"kind\":\"system\",\"term\":\"부모를 잃은 아이의 상담은 어디서 받나요\",\"also\":\"아동 애도 상담 · 사별 가족 모임 · 위(Wee)클래스 · 정신건강복지센터\",\"heardFrom\":\"장례 뒤 몇 달이 지나 아이가 달라졌을 때, 학교나 주변에서 권하며 듣게 돼요.\",\"point\":\"아이를 보는 애도 상담은 정신건강복지센터, 학교 상담실(위클래스), 청소년상담복지센터, 건강가정지원센터에서 길을 안내받을 수 있어요. 돈이 안 들거나 적게 들고, 아이 기록에 남는 것이 아니에요.\",\"what\":\"부모나 가까운 사람을 잃은 아이를 위한 상담이에요. 아이의 나이에 맞게 놀이·그림·이야기로 슬픔을 다루고, 남은 부모도 함께 보는 곳이 많아요. 시·군·구마다 있는 정신건강복지센터가 첫 자리이고, 학교에 다니면 위클래스와 교육청 위센터, 청소년이면 청소년상담복지센터(1388), 가족이 함께 보려면 건강가정지원센터(1577-9337)가 있어요. 사별 가족끼리 만나는 자기돕기 모임도 지역과 종교 단체, 호스피스 기관에 있어요.\",\"known\":\"공공 상담은 대부분 무료이고, 횟수가 정해져 있어서 이어지면 다른 곳으로 연결해 줘요. 아이의 학교 생활기록에 상담 내용이 올라가지 않아요. 몇 달 동안 잠·밥·놀이·학교가 함께 무너져 있거나, 자기 탓을 하거나, 자기를 해치는 말을 하면 기다리지 않고 가는 것이 좋아요. 부모가 먼저 가서 아이를 어떻게 데려올지 상의해도 돼요.\",\"notAtHome\":\"우리 아이가 상담이 필요한 상태인지 아닌지는 집에서 가를 수 없어요. 그것을 가르는 것이 상담의 첫 만남이에요. 아이가 거부하면 부모만 먼저 가도 돼요.\",\"basis\":\"정신건강복지법 — 정신건강복지센터 · 학교보건법 — 위클래스\",\"byRegion\":\"정신건강복지센터는 모든 시·군·구에 있지만, 아이를 따로 보는 상담사가 있는지와 사별 가족 모임이 있는지는 지역마다 달라요. 1577-0199로 전화하면 사는 곳의 센터로 이어져요.\",\"changes\":\"상담 횟수와 연계 기관이 해마다 바뀌어요. 1577-0199나 학교 상담실에서 지금 기준을 확인해 주세요.\",\"asOf\":\"2026년 기준\",\"ask\":[\"이 나이 아이가 부모를 잃었을 때 보는 상담이 있나요? 몇 번까지 무료인가요?\",\"아이가 안 가겠다고 하면 부모만 먼저 가도 되나요?\"],\"amounts\":[{\"item\":\"정신건강상담\",\"value\":\"1577-0199\",\"note\":\"사는 곳의 정신건강복지센터로 연결\"},{\"item\":\"청소년상담\",\"value\":\"1388\",\"note\":\"청소년상담복지센터 — 전화·문자·채팅\"},{\"item\":\"가족상담\",\"value\":\"1577-9337\",\"note\":\"건강가정지원센터\"}]},{\"id\":\"fb-child-forgets-grief\",\"kind\":\"saying\",\"term\":\"아이는 어려서 금방 잊는다\",\"also\":\"어릴 때라 다행이다 · 애들은 모른다 · 아이 앞에서는 울지 마라\",\"heardFrom\":\"장례식장에서, 친척에게서, 위로하려는 말로 듣게 돼요.\",\"point\":\"아이가 울지 않는 것은 잊어서가 아니라 슬픔이 어른과 다른 모양으로 오기 때문이에요. 어릴수록 말로 못 하고 몸과 놀이와 몇 달 뒤의 물음으로 와요.\",\"what\":\"어린아이는 죽음을 모르고 금방 잊으니 아이 앞에서 슬퍼하지 말고 아이도 그냥 두면 된다는 말이에요. 위로하려는 말이지만, 아이의 슬픔을 없는 것으로 두게 만들어요.\",\"known\":\"아이는 어른처럼 슬픔을 이어서 겪지 않고 놀다가 갑자기 울고 금방 다시 놀아요. 그것이 이 나이의 애도예요. 기억이 없는 아기도 돌보는 사람이 달라지고 집의 공기가 달라진 것을 몸으로 겪어요. 어른이 슬픔을 숨기면 아이는 슬픔을 말하면 안 되는 것으로 배우고, 어른이 울면서 왜 우는지 말해 주면 아이는 슬픔을 다루는 법을 배워요. 떠난 사람을 집에서 이야기하는 가정의 아이가 더 잘 지낸다는 이야기가 쌓여 있어요.\",\"notAtHome\":\"우리 아이가 괜찮은지, 참는 것인지는 겉으로 가를 수 없어요. 몇 달 동안 잠·밥·놀이·학교가 함께 달라져 있으면 아동 애도 상담에서 보는 것이 맞아요.\",\"basis\":\"아동 애도 연구 — 발달 단계별 슬픔의 표현\",\"ask\":[\"이 나이 아이가 가까운 사람을 잃었을 때 어떤 모습이 흔한가요?\",\"어떤 모습이 보이면 아이 상담을 받아 보는 것이 좋을까요?\"]}]}],null],null],null]},[null,[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"notes\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/d834a61ded011cb4.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"ko\",\"childr
