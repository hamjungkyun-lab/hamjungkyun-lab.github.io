void\":[\"흰색·회색·옅은 크림색 변을 보고 며칠 더 지켜보는 것 — 이 색은 미루지 말라고 안내돼요.\"],\"see\":[\"흰색·회색·옅은 크림색 변이 한 번이라도 나왔을 때 — 사진과 함께 소아청소년과에 바로 보여요.\",\"변 색이 옅어지면서 눈 흰자나 피부가 노랗게 보일 때\",\"변 색과 상관없이 생후 2주가 지나도 눈 흰자나 피부가 노랗거나 소변이 진할 때\",\"변에 피가 섞이거나 묻어 나올 때\",\"태변 시기가 지났는데 철분제를 먹지 않는 아기가 검은 변을 볼 때\"],\"urgent\":[\"피 섞인 변이나 젤리 같은 붉은 변과 함께 아기가 자지러지게 울기를 되풀이할 때\",\"초록색 물을 토할 때\",\"축 늘어져 반응이 없거나 깨우기 어려울 때\"],\"swatches\":[{\"label\":\"흰색\",\"hex\":\"#F2F0E6\",\"note\":\"생후 몇 달 안에 이런 색이 나오면 바로 소아청소년과에 사진과 함께 보여요. 담도폐쇄증처럼 일찍 찾아야 하는 병을 살피는 색으로 안내돼요.\",\"seeNow\":true},{\"label\":\"회색\",\"hex\":\"#BDBAB0\",\"note\":\"흰색과 같이 바로 진료를 받으라고 안내되는 색이에요. 사진을 찍어 가요.\",\"seeNow\":true},{\"label\":\"옅은 노란 크림색\",\"hex\":\"#EEE4BC\",\"note\":\"누런빛이 거의 빠진 연한 크림색도 대변 색깔 카드에서는 바로 진료로 넘기는 색이에요. 헷갈리면 사진과 함께 보여요.\",\"seeNow\":true},{\"label\":\"빨간색 (피)\",\"hex\":\"#B3261E\",\"note\":\"붉은 피가 섞이거나 줄처럼 묻어 나오면 기저귀나 사진을 챙겨 바로 진료를 받아요.\",\"seeNow\":true},{\"label\":\"검은색 (타르 같은)\",\"hex\":\"#2A2420\",\"note\":\"태변 시기가 지났고 철분제도 먹지 않는데 타르처럼 검고 끈적한 변이 나오면 바로 진료를 받아요.\",\"seeNow\":true},{\"label\":\"태변 (첫 며칠 검푸른색)\",\"hex\":\"#2F3A2B\",\"note\":\"태어나 첫 며칠 동안 나오는 검푸르고 끈적한 변이에요. 먹는 양이 늘면서 초록빛, 누런빛으로 바뀌어 가는 경우가 많아요.\"},{\"label\":\"노란색\",\"hex\":\"#E2B437\",\"note\":\"모유를 먹는 아기에게서 흔히 보이는 색이에요. 묽거나 좁쌀 같은 알갱이가 섞이기도 해요.\"},{\"label\":\"황갈색\",\"hex\":\"#C08B2E\",\"note\":\"분유를 먹거나 이유식을 시작하면서 흔히 보이는 색이에요.\"},{\"label\":\"초록색\",\"hex\":\"#6E7F2C\",\"note\":\"모유·분유·철분제·먹은 음식에 따라 초록빛이 돌기도 해요. 변이 장을 빨리 지나갈 때도 이런 색이 나온다고 안내돼요.\"},{\"label\":\"갈색\",\"hex\":\"#7A5230\",\"note\":\"이유식과 여러 음식을 먹기 시작하면 점점 갈색으로 바뀌는 경우가 많아요.\"}],\"source\":\"대만·캐나다 온타리오의 대변 색깔 카드 · MSD 매뉴얼 · 대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-fever\",\"title\":\"열이 날 때\",\"category\":\"fever\",\"ages\":[0,96],\"keywords\":[\"고열\",\"미열\",\"해열제\",\"체온\",\"체온계\",\"열나요\",\"열이 안 떨어져요\",\"해열제 간격\"],\"summary\":\"열은 아이들이 가장 자주 겪는 증상이에요. 숫자 하나보다 아이가 어떻게 지내는지, 몇 개월인지를 함께 봐요.\",\"home\":[\"같은 체온계로 같은 자리에서 재야 오르내림을 비교하기 쉬워요. 잰 시각과 숫자를 적어 두어요.\",\"얇은 옷을 입히고 방을 너무 덥지 않게 해요.\",\"물·모유·분유를 조금씩 자주 먹여요. 소변을 얼마나 보는지도 함께 봐요.\",\"해열제는 종류마다 쓸 수 있는 월령과 간격이 달라요. 약 종류와 양은 아이 체중에 맞춰 약사·의사에게 확인해요.\",\"열이 내려도 아이가 잘 놀고 잘 먹는지를 함께 살피라고 안내돼요.\"],\"avoid\":[\"알코올이나 찬물로 몸을 닦는 것\",\"두꺼운 이불로 꽁꽁 싸서 땀을 내는 것\",\"해열제 두 가지를 임의로 번갈아 먹이는 것 — 간격과 양은 약사·의사에게 확인해요.\",\"아스피린을 아이에게 먹이는 것\"],\"see\":[\"생후 3개월 미만인데 38도 이상 열이 날 때 — 바로 진료를 받아요.\",\"열이 이어질 때 — 2세 미만은 하루, 2세 이상은 사흘을 넘기면 — 또는 내렸다가 다시 오를 때\",\"잘 먹지 못하고 소변이 줄었을 때\",\"귀를 아파하거나, 소변볼 때 아파하거나, 숨소리가 거칠 때\",\"아이가 평소와 다르게 많이 보채거나 처질 때\"],\"urgent\":[\"경련을 일으켰을 때\",\"숨쉬기 힘들어하거나 입술·얼굴색이 변할 때\",\"축 늘어져 반응이 없거나 깨우기 어려울 때\",\"열과 함께 눌러도 색이 사라지지 않는 붉은 점이 생겼을 때\"],\"source\":\"대한소아청소년과학회 · 질병관리청 · 미국소아과학회(AAP)\"},{\"id\":\"c-febrile-seizure\",\"title\":\"열이 나며 경련할 때\",\"category\":\"fever\",\"ages\":[6,72],\"keywords\":[\"열경련\",\"열성경련\",\"경기\",\"경련\",\"눈이 돌아가요\",\"몸이 떨려요\",\"경기해요\"],\"summary\":\"열이 오를 때 몸이 굳거나 떨리는 경련은 대개 생후 6개월에서 5세 사이에 생긴다고 안내돼요. 처음 겪으면 119에 연락해요.\",\"home\":[\"아이를 바닥처럼 평평하고 안전한 곳에 옆으로 눕혀요. 토한 것이 기도로 넘어가지 않게 하려는 거예요.\",\"주변의 딱딱하거나 뾰족한 물건을 치워요.\",\"경련이 시작된 시각을 보고, 얼마나 이어지는지 재요. 할 수 있다면 영상을 찍어 두어요. 진료 때 도움이 돼요.\",\"멎은 뒤에는 한동안 졸려 하거나 멍해 보이는 경우가 많아요. 숨을 고르게 쉬는지 곁에서 지켜봐요.\"],\"avoid\":[\"입에 손가락·숟가락·수건 등을 넣는 것\",\"몸을 꽉 붙잡아 떨림을 멈추게 하려는 것\",\"경련 중에 물이나 약을 먹이는 것\",\"정신을 차리게 하려고 흔들거나 찬물을 끼얹는 것\"],\"see\":[\"경련이 멎었어도 처음 겪은 경련이면 진료를 받아요.\",\"전에 열성 경련이 있었던 아이가 다시 경련했을 때 — 다니는 소아청소년과에 알려요.\",\"경련 뒤 열의 원인을 찾아봐야 할 때\"],\"urgent\":[\"처음 경련을 일으켰을 때\",\"경련이 5분 넘게 이어지거나, 멎었다가 다시 시작할 때\",\"경련 뒤 숨쉬기 힘들어하거나 입술색이 변할 때\",\"경련 뒤 한참이 지나도 깨지 않거나 몸 한쪽을 잘 못 움직일 때\"],\"source\":\"대한소아청소년과학회 · 대한소아신경학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-cold\",\"title\":\"감기 기운이 있을 때\",\"category\":\"fever\",\"ages\":[0,96],\"keywords\":[\"감기\",\"콧물\",\"재채기\",\"목감기\",\"코감기\",\"감기약\",\"누런 콧물\"],\"summary\":\"콧물·재채기·가벼운 기침으로 시작하는 감기는 어린이집에 다니기 시작하면 한 해에도 여러 번 걸리는 경우가 많아요.\",\"home\":[\"물과 먹던 것을 조금씩 자주 먹이고 푹 쉬게 해요.\",\"콧물은 부드러운 휴지로 닦고, 코 밑이 헐지 않게 보습제를 얇게 발라 주는 분이 많아요.\",\"실내 습도를 적당히 맞추고 환기를 해요. 가습기는 매일 씻어 써요.\",\"기침이 있는 아이는 손 씻기와 기침 예절을 함께 연습해요.\",\"12개월이 지난 아이의 밤 기침에는 꿀을 조금 먹이는 집도 있어요. 12개월 전에는 꿀을 먹이지 않아요.\"],\"avoid\":[\"어른 감기약이나 집에 있던 약을 임의로 먹이는 것 — 약 종류와 양은 아이 체중에 맞춰 약사·의사에게 확인해요.\",\"12개월 미만 아기에게 꿀을 먹이는 것\",\"감기에 항생제를 먼저 달라고 하는 것 — 쓸지는 진료하는 의사가 정해요.\"],\"see\":[\"생후 3개월 미만 아기가 감기 기운을 보일 때\",\"열이 2~3일 넘게 이어질 때\",\"귀를 아파하거나 자꾸 만질 때\",\"기침이 심해지거나 열흘 넘게 나아지지 않을 때\",\"잘 먹지 못하고 소변이 줄었을 때\"],\"urgent\":[\"숨쉬기 힘들어하거나 숨 쉴 때 갈비뼈 사이가 쑥쑥 들어갈 때\",\"입술·얼굴색이 변할 때\",\"축 늘어져 반응이 없거나 깨우기 어려울 때\"],\"source\":\"대한소아청소년과학회 · 질병관리청 · 미국소아과학회(AAP)\"},{\"id\":\"c-stuffy-nose\",\"title\":\"코가 막혔을 때\",\"category\":\"face\",\"ages\":[0,96],\"keywords\":[\"코막힘\",\"코딱지\",\"콧물 흡입\",\"코뻥\",\"식염수\",\"코 흡입기\",\"코 킁킁\",\"코가 막혀요\"],\"summary\":\"어린 아기는 코로 숨을 쉬는 비중이 커서 코가 막히면 먹고 자는 것이 힘들어지는 경우가 많아요.\",\"home\":[\"식염수를 콧구멍에 한두 방울 넣어 코딱지를 불린 뒤 흡인기로 살살 빼요.\",\"흡인은 먹기 전이나 자기 전처럼 필요할 때에만 해요. 너무 자주 하면 코 안이 부을 수 있다고 안내돼요.\",\"따뜻한 물로 샤워한 뒤 욕실의 수증기 속에 잠깐 있으면 코가 풀리는 경우가 있어요.\",\"큰 아이는 한쪽씩 막고 살살 푸는 법을 가르쳐요.\"],\"avoid\":[\"면봉을 콧속 깊이 넣는 것\",\"입으로 직접 콧물을 빨아내는 것\",\"어른용 코 스프레이를 아이에게 쓰는 것 — 약사·의사에게 확인해요.\",\"베개를 높게 괴어 아기를 재우는 것 — 아기는 평평한 바닥에 똑바로 눕혀 재워요.\"],\"see\":[\"코가 막혀 먹는 양이 크게 줄었을 때\",\"열이 함께 나거나 귀를 아파할 때\",\"콧물이 열흘 넘게 이어지거나 한쪽 코에서만 냄새나는 콧물이 날 때 — 콧속에 뭔가 넣었는지도 함께 살펴봐요.\"],\"urgent\":[\"숨쉬기 힘들어하거나 입술·얼굴색이 변할 때\",\"콧구멍이 벌렁거리고 숨이 몹시 빠를 때\"],\"source\":\"대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-cough-wheeze\",\"title\":\"기침하고 숨소리가 거칠 때\",\"category\":\"fever\",\"ages\":[0,96],\"keywords\":[\"기침\",\"쌕쌕\",\"숨소리\",\"그렁그렁\",\"가래\",\"밤 기침\",\"모세기관지염\",\"숨차요\"],\"summary\":\"기침은 감기에서 흔하지만, 숨 쉬는 모양이 달라지면 서둘러야 해요. 기침 소리보다 숨 쉬는 모습을 먼저 봐요.\",\"home\":[\"아이 옷을 걷고 가슴과 배가 움직이는 모양을 한 번 봐 두어요.\",\"물을 조금씩 자주 먹여요.\",\"실내를 너무 건조하지 않게 하고, 집 안에서 담배 연기가 닿지 않게 해요.\",\"기침이 심한 시각, 소리, 숨소리를 짧은 영상으로 남겨 두면 진료 때 도움이 돼요.\"],\"avoid\":[\"기침약을 임의로 먹이는 것 — 어린아이에게는 약사·의사에게 먼저 확인하라고 안내돼요.\",\"12개월 미만 아기에게 꿀을 먹이는 것\"],\"see\":[\"생후 3개월 미만 아기가 기침할 때\",\"쌕쌕거리는 소리가 날 때\",\"기침과 함께 열이 나거나, 기침이 2~3주 넘게 이어질 때\",\"기침을 몰아서 하다가 숨을 들이쉬며 '흡' 소리가 날 때\",\"기침 때문에 잠을 못 자거나 먹은 것을 자주 토할 때\"],\"urgent\":[\"숨 쉴 때 갈비뼈 사이나 목 아래가 쑥쑥 들어갈 때\",\"입술·얼굴색이 파랗거나 잿빛으로 변할 때\",\"숨이 몹시 빠르거나, 숨이 차서 말이나 울음을 잇지 못할 때\",\"먹던 것을 삼킨 뒤 갑자기 기침이 시작되었을 때\"],\"source\":\"대한소아청소년과학회 · 질병관리청 · 미국소아과학회(AAP)\"},{\"id\":\"c-croup\",\"title\":\"개 짖는 듯한 기침\",\"category\":\"fever\",\"ages\":[6,72],\"keywords\":[\"크룹\",\"컹컹 기침\",\"개 짖는 기침\",\"쇳소리 기침\",\"목이 쉬었어요\",\"후두염\",\"밤에 기침\"],\"summary\":\"'컹컹' 하는 쇳소리 기침과 쉰 목소리는 크룹(후두염)에서 흔하다고 안내돼요. 대개 밤에 심해져요.\",\"home\":[\"아이를 안아 달래요. 울면 숨소리가 더 거칠어질 수 있어요.\",\"아이 곁에서 같이 잠을 자며 숨소리를 들어요.\",\"따뜻한 욕실의 수증기나 선선한 바깥 공기를 잠깐 쐬는 집이 많은데, 이것만으로 나아진다는 근거는 분명하지 않다고 안내돼요.\",\"물을 조금씩 먹여요.\"],\"avoid\":[\"숨소리가 거친데 아침까지 기다려 보는 것\",\"기침약을 임의로 먹이는 것 — 약사·의사에게 확인해요.\"],\"see\":[\"컹컹 기침이 처음 시작되었을 때\",\"열이 함께 나거나 사흘 넘게 이어질 때\",\"전에 크룹을 앓았는데 다시 시작되었을 때\"],\"urgent\":[\"가만히 있을 때도 숨을 들이쉬며 '히익' 하는 높은 소리가 날 때\",\"숨 쉴 때 갈비뼈 사이나 목 아래가 쑥쑥 들어갈 때\",\"침을 흘리며 삼키지 못하거나 입술색이 변할 때\",\"축 늘어지거나 숨이 차서 울지도 못할 때\"],\"source\":\"대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-ear-pain\",\"title\":\"귀를 아파할 때\",\"category\":\"face\",\"ages\":[3,96],\"keywords\":[\"귀 아파요\",\"중이염\",\"귀 통증\",\"귀를 만져요\",\"귀고름\",\"귀에서 진물\",\"귀를 잡아당겨요\"],\"summary\":\"감기 끝에 귀를 아파하거나 자꾸 만지고 밤에 깨서 울면 중이염일 수 있다고 안내돼요. 귓속은 집에서 볼 수 없어서 진료로 확인해요.\",\"home\":[\"아파하는 쪽, 시작된 때, 열과 콧물이 함께 있는지 적어 두어요.\",\"누우면 더 아파하는 아이는 안아서 달래는 분이 많아요.\",\"아파서 잠을 못 자면 진통·해열제를 쓸 수 있는지 약사·의사에게 확인해요.\",\"눕혀서 젖병을 물리지 않고, 안아서 먹이는 집이 많아요.\"],\"avoid\":[\"면봉이나 귀이개를 귓속 깊이 넣는 것\",\"기름·모유처럼 민간요법으로 쓰는 것을 귀에 넣는 것\",\"진료에서 받은 약을 나아 보인다고 일찍 끊는 것 — 끊을 때는 의사와 상의해요.\"],\"see\":[\"귀를 아파하거나 자꾸 만지며 보챌 때\",\"귀에서 고름이나 진물이 나올 때\",\"열과 함께 귀를 아파할 때\",\"잘 못 듣는 것 같거나 불러도 반응이 늦을 때\"],\"urgent\":[\"귀 뒤가 붉게 붓고 귀가 앞으로 밀려 나와 보일 때\",\"심한 두통·목 뻣뻣함과 함께 처질 때\",\"귓속에 단추형 건전지 같은 것을 넣었을 수 있을 때\"],\"source\":\"대한소아청소년과학회 · 대한이비인후과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-eye-discharge\",\"title\":\"눈곱이 끼고 눈이 빨갈 때\",\"category\":\"face\",\"ages\":[0,96],\"keywords\":[\"눈곱\",\"눈 충혈\",\"결막염\",\"눈물\",\"눈이 빨개요\",\"눈 비벼요\",\"눈물길\",\"눈꺼풀 부음\"],\"summary\":\"신생아는 눈물길이 덜 열려 한쪽 눈에 눈물과 눈곱이 자주 끼는 경우가 있어요. 큰 아이는 결막염으로 눈이 빨개지기도 해요.\",\"home\":[\"손을 씻고, 깨끗한 거즈나 솜을 미지근한 물에 적셔 눈머리에서 눈꼬리 쪽으로 닦아요. 한 번 쓴 면은 다시 쓰지 않아요.\",\"양쪽 눈을 닦을 때는 거즈를 따로 써요.\",\"결막염이 돌 때는 수건과 베개를 따로 쓰고 손을 자주 씻어요.\",\"눈물길 마사지는 진료에서 배운 방법대로 해요.\"],\"avoid\":[\"모유나 민간요법으로 쓰는 것을 눈에 넣는 것\",\"집에 있던 안약을 임의로 넣는 것 — 약사·의사에게 확인해요.\",\"아이가 눈을 계속 비비게 두는 것\"],\"see\":[\"생후 한 달 안의 아기 눈에 고름 같은 눈곱이 낄 때\",\"누렇거나 초록빛 눈곱이 계속 끼고 눈이 빨갈 때\",\"눈물·눈곱이 몇 달째 이어질 때\",\"빛을 몹시 눈부셔하거나 눈을 잘 못 뜰 때\",\"눈동자가 뿌옇거나 하얗게 보일 때\"],\"urgent\":[\"눈을 다쳤거나 눈에 약품이 들어갔을 때 — 흐르는 물로 씻으며 119에 연락해요.\",\"눈꺼풀과 눈 주위가 붉게 부어오르며 열이 날 때\",\"갑자기 잘 보이지 않는다고 할 때\"],\"source\":\"대한소아청소년과학회 · 대한안과학회 · 질병관리청\"},{\"id\":\"c-constipation\",\"title\":\"변을 잘 못 볼 때\",\"category\":\"poop\",\"ages\":[0,96],\"keywords\":[\"변비\",\"똥을 안 싸요\",\"딱딱한 똥\",\"토끼똥\",\"변 볼 때 울어요\",\"응가 힘들어요\",\"관장\",\"배변 훈련 변비\"],\"summary\":\"변 보는 횟수는 아이마다 크게 달라요. 횟수보다 변이 딱딱한지, 볼 때 아파하는지를 살펴요. 변비는 이유식을 시작하거나 배변 훈련을 할 때 자주 생겨요.\",\"home\":[\"이유식을 하는 아이는 물과 채소·과일·통곡물을 조금씩 늘려 보는 분이 많아요.\",\"6개월 미만 아기에게 물이나 주스를 따로 먹일지는 의사와 먼저 상의해요.\",\"배변 훈련 중이면 밥 먹고 난 뒤 변기에 잠깐 앉아 보는 시간을 정해 두어요. 다그치지 않아요.\",\"몸을 많이 움직이게 하고, 변을 참지 않게 해요.\",\"변 본 날, 모양, 피가 묻었는지를 적어 두어요.\"],\"avoid\":[\"면봉이나 체온계로 항문을 습관처럼 자극하는 것\",\"관장약·변비약을 임의로 쓰는 것 — 약사·의사에게 확인해요.\",\"변을 못 본다고 혼내거나 억지로 오래 앉혀 두는 것\"],\"see\":[\"신생아가 태어나 이틀이 지나도 태변을 보지 않았을 때\",\"변에 피가 묻거나 항문이 찢어진 것 같을 때\",\"변 보기를 무서워해 계속 참거나, 팬티에 변이 자꾸 조금씩 묻어 나올 때\",\"몇 주 넘게 이어지거나 집에서 해 본 것으로 달라지지 않을 때\"],\"urgent\":[\"배가 불룩하게 부풀고 토하기를 되풀이할 때\",\"초록색 물을 토할 때\",\"배를 몹시 아파하며 다리를 웅크리고 우는 것이 되풀이될 때\"],\"source\":\"대한소아소화기영양학회 · 대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-diarrhea\",\"title\":\"설사할 때 탈수 살피기\",\"category\":\"poop\",\"ages\":[0,96],\"keywords\":[\"설사\",\"물똥\",\"장염\",\"탈수\",\"소변 줄었어요\",\"기저귀가 안 젖어요\",\"경구수액\",\"물설사\"],\"summary\":\"설사에서 가장 먼저 살피는 것은 몸의 물이 얼마나 빠졌는지예요. 소변 횟수와 눈물·입안을 함께 봐요.\",\"home\":[\"모유·분유는 먹던 대로 이어 가는 경우가 많아요.\",\"약국에서 파는 경구 수액(전해질 용액)을 조금씩 자주 먹여요. 먹일 양은 약사·의사에게 확인해요.\",\"기저귀가 몇 번 젖었는지, 설사와 토한 횟수를 적어 두어요.\",\"기저귀를 간 뒤에는 손을 꼼꼼히 씻고, 가족끼리 수건을 따로 써요.\",\"엉덩이가 헐지 않게 물로 씻고 잘 말려요.\"],\"avoid\":[\"장을 쉬게 한다며 오래 굶기는 것\",\"이온음료·주스·탄산음료를 수분 보충용으로 많이 먹이는 것\",\"지사제를 임의로 먹이는 것 — 약사·의사에게 확인해요.\"],\"see\":[\"생후 6개월 미만 아기가 설사할 때\",\"소변이 크게 줄었을 때 — 기저귀가 6~8시간 넘게 젖지 않거나, 큰 아이가 한나절 넘게 소변을 보지 않을 때\",\"울어도 눈물이 거의 나지 않거나 입술과 입안이 말라 있을 때\",\"설사에 피나 점액이 섞일 때\",\"열이 높거나 설사가 며칠 넘게 이어질 때\"],\"urgent\":[\"먹지 못하고 소변이 크게 줄었는데 축 늘어지거나 깨우기 어려울 때\",\"아기 정수리의 숨구멍이 쑥 꺼져 보이고 눈이 움푹 들어갈 때\",\"초록색 물을 토하거나 피가 섞인 변을 볼 때\"],\"source\":\"대한소아소화기영양학회 · 대한소아청소년과학회 · 질병관리청 · 미국소아과학회(AAP)\"},{\"id\":\"c-vomiting\",\"title\":\"토할 때\",\"category\":\"tummy\",\"ages\":[0,96],\"keywords\":[\"구토\",\"토해요\",\"게워요\",\"분수토\",\"토하고 열\",\"먹으면 토해요\",\"토한 뒤\"],\"summary\":\"아기가 먹고 조금 게우는 일은 흔해요. 토하는 양과 횟수, 토한 것의 색, 함께 나타나는 것을 살펴요.\",\"home\":[\"토하는 동안에는 고개를 옆으로 돌리거나 옆으로 눕혀 토한 것이 기도로 넘어가지 않게 해요.\",\"토한 뒤 바로 많이 먹이지 않고, 잠시 쉬었다가 경구 수액이나 물을 한 숟갈씩 자주 먹여요.\",\"토한 시각, 양, 색과 소변 횟수를 적어 두어요.\",\"토한 것을 치울 때는 장갑을 끼고, 치운 뒤 손을 씻어요. 장염을 옮기는 바이러스가 있을 수 있어요.\"],\"avoid\":[\"토한 직후에 물이나 우유를 한꺼번에 많이 먹이는 것\",\"구토를 멈추게 한다는 약을 임의로 먹이는 것 — 약사·의사에게 확인해요.\",\"토하는 아기를 바로 눕힌 채 두는 것\"],\"see\":[\"생후 몇 주 된 아기가 먹을 때마다 뿜듯이 세게 토할 때\",\"먹거나 마신 것을 계속 토해 아무것도 넘기지 못할 때\",\"소변이 크게 줄었을 때\",\"토하는 것이 하루 넘게 이어지거나 열·설사가 함께 있을 때\",\"체중이 늘지 않거나 줄어들 때\"],\"urgent\":[\"초록색 물이나 피, 커피 찌꺼기 같은 것을 토할 때\",\"머리를 부딪친 뒤 토할 때\",\"배를 몹시 아파하며 다리를 웅크리고 울기를 되풀이할 때\",\"축 늘어져 반응이 없거나 깨우기 어려울 때\"],\"source\":\"대한소아소화기영양학회 · 대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-after-gastroenteritis\",\"title\":\"장염 뒤 먹이기\",\"category\":\"tummy\",\"ages\":[6,96],\"keywords\":[\"장염\",\"장염 음식\",\"장염 식단\",\"죽\",\"장염 후 우유\",\"흰죽\",\"장염 이유식\"],\"summary\":\"토하는 것이 잦아들면 물부터 시작해 평소 먹던 것으로 천천히 돌아가는 경우가 많아요. 오래 굶기거나 흰죽만 고집하지 않도록 안내돼요.\",\"home\":[\"먼저 경구 수액이나 물을 조금씩 먹여 넘기는지 봐요.\",\"넘기면 죽·밥·바나나·감자처럼 소화가 쉬운 것부터 평소 먹던 양의 일부로 시작해요.\",\"모유는 계속 먹이고, 분유는 먹던 것을 이어 가는 경우가 많아요. 바꿀지는 의사와 상의해요.\",\"기름지거나 단 음식, 주스는 며칠 뒤로 미뤄요.\",\"식사 준비 전과 화장실에 다녀온 뒤에는 온 가족이 손을 씻어요.\"],\"avoid\":[\"며칠씩 흰죽이나 미음만 먹이는 것 — 오래 이어지면 먹는 양이 너무 적어질 수 있다고 안내돼요.\",\"단 음료나 주스로 수분을 채우는 것\"],\"see\":[\"먹이기 시작하면 다시 토하거나 설사가 심해질 때\",\"소변이 크게 줄었을 때\",\"설사가 일주일 넘게 이어지거나 체중이 줄었을 때\",\"변에 피가 섞일 때\"],\"urgent\":[\"먹지 못하고 소변이 크게 줄었는데 축 늘어질 때\",\"초록색 물을 토할 때\"],\"source\":\"대한소아소화기영양학회 · 대한소아청소년과학회 · 질병관리청\"},{\"id\":\"c-infant-colic\",\"title\":\"이유 없이 오래 울 때 (배앓이)\",\"category\":\"tummy\",\"ages\":[0,6],\"keywords\":[\"배앓이\",\"영아산통\",\"영아 산통\",\"저녁마다 울어요\",\"자지러지게 울어요\",\"달래도 울어요\",\"마녀시간\"],\"summary\":\"먹이고 기저귀를 갈아도 저녁마다 몇 시간씩 우는 시기가 생후 몇 주에서 3~4개월 무렵에 흔하다고 안내돼요. 우는 아기 곁의 부모도 함께 지쳐요.\",\"home\":[\"배고픔, 기저귀, 덥거나 추운지, 옷이 조이는지를 먼저 살펴요.\",\"안아서 천천히 걷기, 일정한 백색 소음 들려주기, 품에 꼭 안기, 살살 흔들기를 하는 분이 많아요.\",\"수유 중간과 끝에 트림을 시켜요.\",\"우는 시각과 시간을 적어 두면 진료 때 도움이 돼요.\",\"너무 힘들면 아기를 안전한 침대에 눕혀 두고 몇 분 다른 방에서 숨을 돌려도 돼요. 가족에게 교대를 부탁해요.\"],\"avoid\":[\"아기를 세게 흔드는 것 — 흔들린 아기 증후군으로 크게 다칠 수 있어요.\",\"아기에게 민간요법 차나 약을 임의로 먹이는 것\",\"분유를 자꾸 바꾸는 것 — 바꿀지는 의사와 상의해요.\"],\"see\":[\"생후 3개월 미만인데 38도 이상 열이 날 때 — 바로 진료를 받아요.\",\"우는 것과 함께 자주 토하거나, 잘 먹지 못하거나, 체중이 늘지 않을 때\",\"우는 모양이 평소와 다르거나 아파하는 듯한 울음이 이어질 때\",\"부모가 너무 지쳐 아기에게 화가 나거나 겁이 날 때 — 이것도 진료에서 말해도 되는 일이에요.\"],\"urgent\":[\"축 늘어져 반응이 없거나 깨우기 어려울 때\",\"초록색 물을 토하거나 피가 섞인 변을 볼 때\",\"아기 정수리의 숨구멍이 불룩하게 솟았을 때\",\"숨쉬기 힘들어하거나 입술·얼굴색이 변할 때\"],\"source\":\"대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-belly-pain\",\"title\":\"배가 아프다고 할 때\",\"category\":\"tummy\",\"ages\":[3,96],\"keywords\":[\"배 아파요\",\"복통\",\"배가 아프대요\",\"장중첩\",\"맹장\",\"충수염\",\"배를 움켜쥐어요\",\"배꼽 주변 통증\"],\"summary\":\"아이의 배 아픔은 변비·장염처럼 흔한 일부터 서둘러야 하는 일까지 폭이 넓어요. 아픈 자리, 이어지는 시간, 함께 나타나는 것을 살펴요.\",\"home\":[\"어디가 아픈지 손가락으로 짚어 보게 하고, 언제부터인지 적어 두어요.\",\"변을 언제 봤는지, 토했는지, 열이 있는지 함께 살펴요.\",\"편한 자세로 쉬게 하고 물을 조금씩 먹여요.\",\"아이가 아픈 것을 금세 잊고 뛰어노는지, 계속 아파하는지를 지켜봐요.\"],\"avoid\":[\"원인을 모른 채 진통제를 먼저 먹이는 것 — 약사·의사에게 확인해요.\",\"배를 세게 문지르거나 누르는 것\"],\"see\":[\"배 아픔이 몇 시간 넘게 이어지거나 점점 심해질 때\",\"열·구토·설사가 함께 있을 때\",\"소변볼 때 아파하거나 자주 화장실에 갈 때\",\"자꾸 되풀이되어 잠을 깨거나 일상생활을 못 할 때\"],\"urgent\":[\"갑자기 자지러지게 울다 멎기를 되풀이하고 젤리 같은 붉은 변을 볼 때\",\"오른쪽 아랫배를 몹시 아파하며 걷지 못하거나 몸을 펴지 못할 때\",\"초록색 물이나 피를 토할 때\",\"사타구니나 고환이 갑자기 부어 아파할 때\",\"배를 부딪친 뒤 아파할 때\"],\"source\":\"대한소아청소년과학회 · 대한소아소화기영양학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-diaper-urine\",\"title\":\"기저귀 소변 횟수와 색\",\"category\":\"poop\",\"ages\":[0,24],\"keywords\":[\"소변색\",\"기저귀 횟수\",\"소변 횟수\",\"주황색 소변\",\"벽돌색 소변\",\"진한 소변\",\"기저귀 안 젖어요\",\"젖은 기저귀\"],\"summary\":\"젖은 기저귀 수는 아기가 먹는 양을 짐작하는 데 흔히 쓰여요. 태어난 뒤 며칠은 하루하루 늘어나고, 그 뒤로는 하루 여러 장이 젖는 경우가 많아요.\",\"home\":[\"하루에 젖은 기저귀 수를 대강 세어 두어요. 기저귀가 잘 흡수해 헷갈리면 휴지를 한 장 대 보는 분도 있어요.\",\"생후 첫 며칠에는 기저귀에 주황빛 벽돌가루 같은 얼룩이 보이기도 한다고 안내돼요. 이어지면 진료에서 물어봐요.\",\"생후 첫 주의 여자 아기 기저귀에 분홍빛이나 피 같은 얼룩이 묻는 경우도 있다고 안내돼요. 사진을 찍어 진료 때 보여요.\",\"더운 날이나 열이 날 때는 먹는 양과 기저귀 수를 함께 봐요.\"],\"avoid\":[\"소변이 줄었는데 물만 따로 많이 먹이는 것 — 6개월 미만 아기는 모유·분유로 먹여요.\"],\"see\":[\"생후 며칠이 지났는데 하루 젖은 기저귀가 몇 장 되지 않을 때\",\"주황빛 얼룩이 생후 첫 주가 지나서도 이어질 때\",\"소변이 진한 갈색이거나 붉을 때\",\"소변에서 냄새가 심하게 나고 열이 날 때\"],\"urgent\":[\"먹지 못하고 소변이 크게 줄었는데 축 늘어지거나 깨우기 어려울 때\",\"아기 정수리의 숨구멍이 쑥 꺼져 보이고 입안이 말라 있을 때\"],\"source\":\"대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-painful-urination\",\"title\":\"소변보며 아파할 때\",\"category\":\"poop\",\"ages\":[0,96],\"keywords\":[\"소변 아파요\",\"쉬할 때 아파요\",\"요로감염\",\"방광염\",\"오줌 자주\",\"소변 냄새\",\"고추가 아파요\",\"쉬할 때 울어요\"],\"summary\":\"소변볼 때 아파하거나 자주 마려워하면 요로감염일 수 있다고 안내돼요. 아기는 다른 증상 없이 열만 나는 경우도 있어요.\",\"home\":[\"물을 조금씩 자주 먹여요.\",\"변을 본 뒤에는 앞에서 뒤로 닦아요.\",\"꽉 끼는 옷을 피하고, 소변을 오래 참지 않게 해요.\",\"소변 횟수, 냄새, 색, 열을 적어 두어요.\"],\"avoid\":[\"거품 목욕제를 푼 물에 오래 앉아 있게 하는 것\",\"집에 있던 항생제를 먹이는 것\"],\"see\":[\"소변보며 아파하거나 울 때\",\"다른 감기 증상 없이 열이 날 때 — 특히 아기일 때\",\"소변을 자주 보거나, 가리던 아이가 다시 실수할 때\",\"소변이 붉거나 냄새가 몹시 심할 때\",\"생식기가 붓거나 빨갛게 될 때\"],\"urgent\":[\"고열과 함께 옆구리나 등을 아파하며 계속 토할 때\",\"사타구니나 고환이 갑자기 부어 아파할 때\",\"축 늘어져 반응이 없거나 깨우기 어려울 때\"],\"source\":\"대한소아청소년과학회 · 대한소아신장학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-thrush\",\"title\":\"입안에 하얀 막이 보일 때\",\"category\":\"face\",\"ages\":[0,12],\"keywords\":[\"아구창\",\"입안 하얀 것\",\"혓바닥 하얀\",\"백태\",\"입안 곰팡이\",\"젖병 소독\",\"볼 안쪽 하얀\"],\"summary\":\"볼 안쪽·잇몸·혀에 닦아도 잘 지워지지 않는 하얀 막이 생기면 아구창일 수 있다고 안내돼요. 젖 찌꺼기는 살살 닦으면 지워지는 경우가 많아요.\",\"home\":[\"젖병 꼭지와 쪽쪽이를 매일 씻고 소독해요.\",\"모유 수유 중이면 수유하는 사람의 젖꼭지가 아프거나 빨개지는지도 살펴요. 함께 진료를 받는 경우가 있어요.\",\"아기가 먹는 양이 줄었는지 봐요.\"],\"avoid\":[\"하얀 막을 거즈로 세게 문질러 벗겨 내는 것\",\"민간요법으로 쓰는 것을 입안에 바르는 것\"],\"see\":[\"닦아도 지워지지 않는 하얀 막이 보일 때\",\"아파서 잘 빨지 못하거나 먹는 양이 줄었을 때\",\"기저귀 발진이 함께 생기고 잘 낫지 않을 때\",\"진료를 받았는데도 되풀이될 때\"],\"urgent\":[\"먹지 못하고 소변이 크게 줄었을 때\"],\"source\":\"대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-teething\",\"title\":\"이가 날 때\",\"category\":\"face\",\"ages\":[4,36],\"keywords\":[\"이앓이\",\"이 날 때\",\"첫니\",\"침흘림\",\"잇몸 부음\",\"치발기\",\"이 나는 시기\",\"잇몸 간지러움\",\"이가 났\",\"이가 나\",\"이 나는\"],\"summary\":\"첫니는 생후 6개월 무렵에 나는 경우가 많지만 아이마다 차이가 커요. 이가 날 때 침이 늘고 잇몸을 물고 싶어 하는 경우가 많아요.\",\"home\":[\"깨끗한 손가락이나 젖은 거즈로 잇몸을 살살 문질러 줘요.\",\"냉장고에 넣어 시원하게 한 치발기를 쥐여 줘요.\",\"침으로 턱과 목이 헐지 않게 자주 닦아 주고 말려요.\",\"첫니가 보이면 양치를 시작해요.\"],\"avoid\":[\"호박 목걸이 같은 이앓이 목걸이·팔찌 — 목 졸림과 질식 위험이 있어 쓰지 말라고 안내돼요.\",\"잇몸에 바르는 마취 젤을 어린 아기에게 쓰는 것 — 약사·의사에게 확인해요.\",\"꽁꽁 얼린 치발기 — 잇몸이 다칠 수 있다고 안내돼요.\"],\"see\":[\"열이 높거나 설사가 이어질 때 — 이가 나서 그렇다고 넘기지 않고 진료를 받아요.\",\"잇몸이 많이 붓거나 고름이 보일 때\",\"18개월이 지나도 이가 하나도 나지 않았을 때\"],\"urgent\":[\"치발기나 작은 물건이 목에 걸려 기침도 울음도 어떤 소리도 나지 않을 때\"],\"source\":\"대한소아치과학회 · 대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-toothbrushing\",\"title\":\"양치 시작과 불소치약 양\",\"category\":\"face\",\"ages\":[4,96],\"keywords\":[\"양치\",\"불소치약\",\"치약 양\",\"아기 양치\",\"충치\",\"젖병충치\",\"첫 치과\",\"칫솔질\"],\"summary\":\"첫니가 나면 양치를 시작해요. 불소치약은 3세 미만은 쌀알만큼, 3~6세는 완두콩만큼 쓰도록 안내돼요.\",\"home\":[\"첫니가 나면 부드러운 아기 칫솔로 하루 두 번 닦아요. 자기 전 양치는 꼭 챙겨요.\",\"불소치약은 3세 미만은 쌀알만큼, 3~6세는 완두콩만큼 짜요.\",\"아이가 스스로 닦은 뒤에도 초등 저학년까지는 어른이 한 번 더 닦아 주는 경우가 많아요.\",\"첫 치과 검진은 첫니가 난 뒤 돌 무렵에 받아 보라고 안내돼요. 영유아 구강검진도 함께 챙겨요.\",\"단 음료와 간식은 정해진 때에 먹여요.\"],\"avoid\":[\"젖병이나 컵을 물린 채 재우는 것 — 우유·주스가 이에 오래 닿아 충치가 생기기 쉬워요.\",\"어른이 쓰던 숟가락으로 먹이거나 음식을 씹어 먹이는 것\",\"치약을 칫솔 가득 짜는 것\"],\"see\":[\"이에 하얀색이나 갈색 얼룩, 파인 곳이 보일 때\",\"이를 아파하거나 찬 것·단 것에 시려 할 때\",\"잇몸이 붓거나 고름이 보일 때\"],\"urgent\":[\"얼굴이 붓고 열이 날 때\",\"넘어져 이가 빠졌을 때 — 빠진 이를 우유에 담가 바로 치과나 응급실로 가요.\"],\"source\":\"미국소아치과학회(AAPD) · 보건복지부 영유아 구강검진\"},{\"id\":\"c-mouth-sores\",\"title\":\"입안이 헐어 먹기 힘들 때\",\"category\":\"face\",\"ages\":[6,96],\"keywords\":[\"구내염\",\"수족구\",\"헤르판지나\",\"헤르팡지나\",\"입병\",\"입안 물집\",\"입안 헐었어요\",\"침 삼키기 힘들어요\",\"손발 물집\"],\"summary\":\"수족구·헤르판지나 같은 바이러스 질환으로 입안에 물집과 궤양이 생기면 아파서 먹고 마시기를 거부하는 경우가 많아요. 이때는 물을 얼마나 마시는지가 가장 중요해요.\",\"home\":[\"차갑고 부드러운 음식과 물을 조금씩 자주 먹여요.\",\"짜고 시고 매운 음식, 딱딱한 음식은 피해요.\",\"빨대나 숟가락으로 먹일 때 덜 아파하면 그것으로 먹여요.\",\"소변 횟수를 세어 두어요.\",\"손 씻기와 장난감 닦기를 자주 하고, 등원은 어린이집·의사와 상의해요.\"],\"avoid\":[\"아파한다고 물까지 쉬게 하는 것 — 물은 조금씩이라도 챙겨요.\",\"입안에 바르는 약을 임의로 쓰는 것 — 약사·의사에게 확인해요.\"],\"see\":[\"물도 거의 마시지 않거나 소변이 크게 줄었을 때\",\"열이 이틀 넘게 이어질 때\",\"입안의 상처가 열흘 넘게 낫지 않을 때\",\"잇몸이 붓고 피가 나며 입술에 물집이 퍼질 때\"],\"urgent\":[\"경련을 일으켰을 때\",\"자다가 깜짝깜짝 놀라거나 팔다리가 떨리고 비틀거릴 때\",\"계속 토하고 축 늘어지거나 깨우기 어려울 때\",\"숨이 빠르고 숨쉬기 힘들어할 때\"],\"source\":\"질병관리청 · 대한소아청소년과학회\"},{\"id\":\"c-nosebleed\",\"title\":\"코피가 날 때\",\"category\":\"face\",\"ages\":[12,96],\"keywords\":[\"코피\",\"코피가 안 멈춰요\",\"자주 코피\",\"코를 후벼요\",\"코피 멈추는 법\",\"자다가 코피\"],\"summary\":\"아이 코피는 코 앞쪽의 가는 혈관에서 나는 경우가 많아요. 건조한 계절이나 코를 후빈 뒤에 자주 생겨요.\",\"home\":[\"아이를 앉히고 고개를 살짝 앞으로 숙이게 해요.\",\"콧방울(코의 부드러운 부분)을 엄지와 검지로 꽉 잡고 10분쯤 그대로 눌러요. 중간에 떼어 보지 않아요.\",\"흘러나온 피는 입으로 뱉게 해요.\",\"멎은 뒤 하루쯤은 코를 세게 풀거나 후비지 않게 해요. 실내가 건조하면 습도를 맞춰요.\"],\"avoid\":[\"고개를 뒤로 젖히는 것 — 피가 목으로 넘어가 토할 수 있어요.\",\"눕히는 것\",\"휴지를 콧속 깊이 밀어 넣는 것\"],\"see\":[\"10분씩 두 번 눌러도 멈추지 않을 때\",\"코피가 자주 나거나 한쪽에서만 되풀이될 때\",\"멍이 잘 들거나 잇몸에서도 피가 날 때\",\"한쪽 코에서 냄새나는 콧물과 피가 섞여 나올 때\"],\"urgent\":[\"머리나 얼굴을 세게 부딪친 뒤 코피가 날 때\",\"피가 많이 나서 어지러워하거나 얼굴이 창백해질 때\",\"20분 넘게 눌러도 계속 흐를 때\"],\"source\":\"대한소아청소년과학회 · 대한이비인후과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-burp-hiccup\",\"title\":\"트림과 딸꾹질\",\"category\":\"tummy\",\"ages\":[0,12],\"keywords\":[\"트림\",\"딸꾹질\",\"트림 안 해요\",\"게워요\",\"역류\",\"수유 후 토함\",\"트림 시키는 법\"],\"summary\":\"어린 아기는 먹으면서 공기를 함께 삼켜 트림을 시켜 주는 경우가 많아요. 딸꾹질도 자주 하지만 대개 저절로 멎는다고 안내돼요.\",\"home\":[\"수유 중간과 끝에 아기를 어깨에 기대 세우거나 무릎에 앉혀 등을 살살 쓸거나 토닥여요.\",\"트림이 몇 분 안에 나오지 않으면 잠시 쉬었다가 다시 해 봐요.\",\"먹은 뒤 20~30분쯤은 바로 눕히지 않고 안아 두는 분이 많아요. 잘 때는 평평한 바닥에 똑바로 눕혀요.\",\"딸꾹질을 하면 잠깐 젖이나 쪽쪽이를 물려 보거나 기다리는 분이 많아요.\"],\"avoid\":[\"딸꾹질을 멈추게 하려고 아기를 놀라게 하는 것\",\"혀를 잡아당기거나 눈을 누르는 것\",\"역류한다고 아기를 비스듬한 쿠션에 눕히거나 엎드린 자세로 재우는 것\"],\"see\":[\"먹을 때마다 많이 토하거나 뿜듯이 토할 때\",\"체중이 늘지 않거나 먹기를 자주 거부할 때\",\"먹을 때마다 몸을 뒤로 젖히며 몹시 괴로워할 때\",\"딸꾹질이 하루 넘게 이어지거나 먹고 자는 것을 방해할 때\"],\"urgent\":[\"초록색 물이나 피를 토할 때\",\"먹다가 숨이 막히거나 입술·얼굴색이 변할 때\"],\"source\":\"대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-mosquito-bite\",\"title\":\"모기에 물렸을 때\",\"category\":\"skin\",\"ages\":[0,96],\"keywords\":[\"모기\",\"모기물림\",\"모기 물림\",\"벌레 물림\",\"벌레물림\",\"부어올라요\",\"가려워요\",\"모기 기피제\",\"모기약\"],\"summary\":\"아이는 어른보다 모기 물린 자리가 크게 붓고 오래가는 일이 흔하다고 알려져 있어요. 가려움을 덜고 긁어서 덧나지 않게 살피는 것이 집에서 하는 일의 중심이에요.\",\"home\":[\"물린 자리를 비누와 흐르는 물로 씻고, 찬 물수건이나 수건에 싼 얼음팩을 잠깐씩 대 줘요.\",\"손톱을 짧게 잘라 두고, 긁으려 하면 손을 잡아 주거나 다른 놀이로 돌려요. 아기는 얇은 면장갑을 끼우는 집도 있어요.\",\"가려움을 덜어 주는 바르는 약이나 먹는 약은 나이에 맞는지 약사·의사에게 확인해요.\",\"모기 기피제는 제품마다 쓸 수 있는 나이와 횟수가 적혀 있어요. 6개월 미만 아기에게는 디에틸톨루아마이드(DEET)·이카리딘 성분 기피제를 쓰지 않는다고 안내돼요.\",\"기피제는 어른 손에 덜어 아이 옷 밖으로 드러난 피부에 얇게 발라 주고, 아이 손·눈·입 둘레와 상처에는 바르지 않아요. 집에 돌아오면 씻어 내요.\",\"어린 아기는 모기장, 긴소매·긴 바지처럼 물리지 않게 막는 방법을 먼저 쓰는 분이 많아요.\"],\"avoid\":[\"침 바르기 — 입속 세균이 상처로 들어갈 수 있다고 안내돼요.\",\"손톱으로 십자 모양 누르기 — 피부가 벗겨져 덧날 수 있어요.\",\"어른용 연고나 물파스를 나이 확인 없이 바르기\"],\"see\":[\"물린 자리가 손바닥만큼 넓게 붓거나 며칠이 지나도 부기가 더 커질 때\",\"물린 자리가 뜨겁고 붉은 기운이 퍼지거나 고름·진물이 날 때\",\"물집이 크게 잡히거나 긁어서 상처가 깊어졌을 때\",\"물린 뒤 열이 나거나 아이가 처질 때\"],\"urgent\":[\"숨쉬기 힘들어하거나 숨소리가 쌕쌕거릴 때\",\"입술·눈두덩·얼굴이 갑자기 붓거나 온몸에 두드러기가 번질 때\",\"토하거나 축 늘어지고 반응이 떨어질 때\"],\"source\":\"질병관리청 · 식품의약품안전처 · 대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-bee-sting\",\"title\":\"벌에 쏘였을 때\",\"category\":\"skin\",\"ages\":[0,96],\"keywords\":[\"벌\",\"벌 쏘임\",\"벌에 쏘였어요\",\"벌침\",\"말벌\",\"꿀벌\",\"쏘였어요\",\"벌레 물림\"],\"summary\":\"아이가 울면서 달려오면 마음이 먼저 철렁하시죠. 쏘인 자리를 살피는 것과 함께, 몸 전체에 알레르기 반응이 오는지를 지켜보는 것이 중요하다고 안내돼요.\",\"home\":[\"아이를 벌이 있는 곳에서 먼저 떨어뜨려요.\",\"침이 보이면 신용카드 같은 납작한 것의 모서리로 피부를 밀어 긁어내요.\",\"쏘인 자리를 비누와 물로 씻고, 수건에 싼 얼음팩을 10분쯤 대 줘요.\",\"쏘인 곳이 팔다리라면 조금 높게 올려 두는 분이 많아요.\",\"가려움·통증에 쓰는 약은 나이에 맞는지 약사·의사에게 확인해요.\",\"쏘인 뒤 몇 시간은 숨소리·얼굴·피부를 곁에서 지켜봐요.\"],\"avoid\":[\"손가락이나 핀셋으로 침을 꽉 집어 짜기 — 침 끝의 독주머니가 눌릴 수 있다고 안내돼요.\",\"된장·침·소주 바르기\",\"쏘인 자리를 긁거나 문지르기\"],\"see\":[\"쏘인 자리 부기가 하루가 지나도 커지거나 팔다리 전체로 번질 때\",\"붉은 기운이 퍼지고 뜨겁거나 고름이 날 때\",\"예전에 벌에 쏘여 크게 부었던 적이 있을 때 — 다음에 대비해 미리 물어봐요.\"],\"urgent\":[\"숨이 차거나 쌕쌕거리고, 목이 조인다고 하거나 삼키기 힘들어할 때\",\"입술·혀·얼굴이 붓거나 쏘인 곳과 먼 데까지 두드러기가 번질 때\",\"어지러워하거나 토하고 축 늘어질 때\",\"입안·목을 쏘였거나 여러 군데를 한꺼번에 쏘였을 때\"],\"source\":\"소방청 · 질병관리청 · 미국소아과학회(AAP)\"},{\"id\":\"c-tick-bite\",\"title\":\"진드기에 물렸을 때\",\"category\":\"skin\",\"ages\":[0,96],\"keywords\":[\"진드기\",\"진드기 물림\",\"진드기 떼는 법\",\"풀밭\",\"캠핑\",\"야외 활동\",\"중증열성혈소판감소증후군\",\"SFTS\",\"쯔쯔가무시\"],\"summary\":\"풀밭·숲에서 놀고 온 날 몸에 붙은 진드기를 보면 당황스러우시죠. 진드기는 피부에 머리를 박고 붙어 있어 떼는 방법과 그 뒤 2주쯤 지켜보는 것이 함께 안내돼요.\",\"home\":[\"진드기가 붙은 것을 보면 무리하게 떼지 말고 의료기관에서 떼는 것이 먼저라고 안내돼요.\",\"바로 갈 수 없을 때는 끝이 가는 핀셋으로 피부에 최대한 가깝게 잡고 비틀지 말고 천천히 곧게 당겨 빼는 방법이 안내돼요.\",\"뗀 뒤에는 물린 자리를 비누와 물로 씻고, 물린 날짜와 장소를 적어 둬요.\",\"야외에 나갈 때는 긴소매·긴 바지를 입히고 돗자리를 깔고 앉아요. 돌아오면 바로 씻기고 옷은 털어 세탁해요.\",\"씻길 때 귀 뒤, 머리카락 속, 겨드랑이, 무릎 뒤, 허리 둘레를 살펴봐요.\"],\"avoid\":[\"손으로 비틀거나 짓눌러 떼기\",\"불로 지지거나 기름·알코올을 부어 떼기\"],\"see\":[\"진드기 머리가 피부에 남은 것 같을 때\",\"물리고 2주쯤 안에 열이 나거나 토하고 설사할 때 — 진드기에 물린 적이 있다고 꼭 말해요.\",\"물린 자리에 검은 딱지가 생기거나 붉은 기운이 둥글게 퍼질 때\",\"몸에 발진이 돋거나 아이가 평소보다 처질 때\"],\"urgent\":[\"열과 함께 축 늘어지거나 깨우기 어려울 때\",\"경련을 일으켰을 때\",\"숨쉬기 힘들어하거나 얼굴·입술이 부을 때\"],\"source\":\"질병관리청 · 미국소아과학회(AAP)\"},{\"id\":\"c-diaper-rash\",\"title\":\"기저귀 발진\",\"category\":\"skin\",\"ages\":[0,36],\"keywords\":[\"기저귀 발진\",\"기저귀발진\",\"엉덩이 빨개요\",\"엉덩이 발진\",\"짓물러요\",\"기저귀 짓무름\",\"엉덩이 헐었어요\",\"발진 크림\"],\"summary\":\"기저귀 갈 때마다 빨간 엉덩이를 보면 마음이 쓰이시죠. 기저귀 안이 축축하고 쓸리는 것이 가장 흔한 까닭으로 알려져 있어, 보송하게 지키는 것이 집에서 하는 일의 중심이에요.\",\"home\":[\"기저귀를 자주 갈고, 변을 보면 바로 갈아 줘요.\",\"미지근한 물로 씻기거나 부드러운 천으로 톡톡 두드려 닦고, 완전히 말린 뒤 기저귀를 채워요.\",\"하루 몇 번은 기저귀를 벗겨 엉덩이를 공기에 말려 줘요.\",\"산화아연 같은 성분의 보호 크림을 얇게 막을 씌우듯 발라 주는 분이 많아요. 약 성분이 든 연고는 나이에 맞는지 약사·의사에게 확인해요.\",\"기저귀는 너무 꽉 조이지 않게 채워요.\"],\"avoid\":[\"알코올·향이 든 물티슈로 세게 문질러 닦기\",\"베이비파우더를 듬뿍 뿌리기 — 아기가 가루를 들이마실 수 있다고 안내돼요.\",\"어른용·처방받지 않은 스테로이드 연고 바르기\"],\"see\":[\"2~3일 집에서 돌봐도 더 넓어지거나 붉은 기운이 짙어질 때\",\"물집·고름·진물이 나거나 피부가 벗겨져 피가 날 때\",\"붉은 가장자리 바깥에 작은 붉은 점들이 흩어져 있을 때\",\"주름 속까지 빨갛게 번지거나 기저귀 바깥으로 퍼질 때\",\"발진과 함께 열이 나거나 잘 먹지 않을 때\"],\"urgent\":[\"생후 3개월 미만인데 38도 이상 열이 날 때\",\"축 늘어져 반응이 떨어지거나 먹지 못하고 소변이 크게 줄었을 때\"],\"source\":\"대한소아청소년과학회 · 대한피부과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-heat-rash\",\"title\":\"땀띠\",\"category\":\"skin\",\"ages\":[0,96],\"keywords\":[\"땀띠\",\"땀 발진\",\"목 접히는 곳\",\"오돌토돌\",\"좁쌀 같은\",\"여름 발진\",\"등에 뭐가 났어요\",\"열꽃\"],\"summary\":\"땀이 빠져나가지 못해 목·겨드랑이·등에 좁쌀 같은 것이 돋는 일이 흔하다고 알려져 있어요. 덥게 입히지 않고 땀을 식혀 주는 것이 집에서 하는 일의 중심이에요.\",\"home\":[\"방을 시원하게 하고 옷을 한 겹 덜어 줘요. 땀을 잘 빨아들이는 헐렁한 면옷이 흔히 권해져요.\",\"미지근한 물로 땀을 씻어 내고 톡톡 두드려 말려 줘요.\",\"목·겨드랑이처럼 접히는 곳은 자주 펴서 말려 줘요.\",\"가려워하면 손톱을 짧게 깎아 두고, 바르는 약은 나이에 맞는지 약사·의사에게 확인해요.\"],\"avoid\":[\"두꺼운 연고나 기름진 크림을 덧바르기 — 땀구멍을 더 막을 수 있다고 안내돼요.\",\"베이비파우더를 뿌리기\",\"아기가 춥지 않을까 싶어 이불을 두껍게 덮기\"],\"see\":[\"시원하게 해 줘도 2~3일 넘게 그대로이거나 더 퍼질 때\",\"오돌토돌한 것에 고름이 잡히거나 붉게 부어오를 때\",\"몹시 가려워 잠을 못 자거나 긁어서 상처가 났을 때\",\"발진과 함께 열이 날 때\"],\"urgent\":[\"열과 함께 눌러도 색이 사라지지 않는 붉은 점이 생겼을 때\",\"생후 3개월 미만인데 38도 이상 열이 날 때\"],\"source\":\"대한소아청소년과학회 · 대한피부과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-dry-skin-eczema\",\"title\":\"건조한 피부와 습진\",\"category\":\"skin\",\"ages\":[0,96],\"keywords\":[\"태열\",\"영아 습진\",\"아토피\",\"아토피 피부염\",\"건조한 피부\",\"피부가 거칠어요\",\"보습\",\"로션\",\"볼이 빨개요\",\"가려워해요\"],\"summary\":\"볼이 빨갛고 거칠어지거나 팔다리 접히는 곳을 긁는 아이를 보면 무엇을 바꿔야 할지 막막하시죠. 피부를 촉촉하게 지키고 가려움을 부르는 것을 줄이는 생활 관리가 공통으로 안내돼요.\",\"home\":[\"목욕은 미지근한 물로 10분 안팎 짧게 하고, 자극이 적은 세정제를 조금만 써요.\",\"목욕 뒤 물기를 톡톡 두드려 닦고, 3분쯤 안에 보습제를 넉넉히 발라 주는 방법이 흔히 안내돼요.\",\"하루에도 여러 번, 건조해 보일 때마다 보습제를 덧발라요.\",\"손톱을 짧게 깎아 두고, 피부에 닿는 옷은 부드러운 면으로 입혀요. 덥게 입히면 가려움이 심해질 수 있어요.\",\"처방받은 연고가 있다면 바르는 양과 기간은 의사·약사 안내를 따라요.\"],\"avoid\":[\"뜨거운 물로 오래 씻기거나 때를 밀기\",\"검증되지 않은 민간요법(식초·소금물·한약재 물 등)을 피부에 바르기\",\"처방받은 연고를 마음대로 끊거나 어른 것을 나눠 쓰기\",\"의사와 상의 없이 먹는 음식을 여러 가지 한꺼번에 끊기\"],\"see\":[\"보습을 꾸준히 해도 붉고 가려운 곳이 넓어질 때\",\"가려움 때문에 밤잠을 자주 깰 때\",\"진물·노란 딱지·고름이 생기거나 피부가 뜨겁게 부을 때\",\"작은 물집이 무리 지어 생기고 아이가 아파할 때\",\"특정 음식을 먹은 뒤 피부가 눈에 띄게 나빠지는 것 같을 때\"],\"urgent\":[\"음식을 먹은 뒤 입술·얼굴이 붓거나 숨쉬기 힘들어할 때\",\"물집이 갑자기 넓게 번지면서 열이 나고 아이가 처질 때\"],\"source\":\"대한소아청소년과학회 · 대한피부과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-hives\",\"title\":\"두드러기가 올라왔을 때\",\"category\":\"skin\",\"ages\":[0,96],\"keywords\":[\"두드러기\",\"부풀어 올라요\",\"모기 물린 것처럼\",\"온몸에 발진\",\"가려워요\",\"음식 알레르기\",\"알레르기\"],\"summary\":\"모기 물린 것처럼 부푼 자국이 갑자기 여기저기 돋으면 놀라시죠. 두드러기는 자리를 옮겨 다니며 생겼다 사라지는 일이 많다고 알려져 있고, 숨쉬기나 얼굴에 함께 나타나는 신호를 살피는 것이 가장 먼저예요.\",\"home\":[\"먼저 숨쉬기·입술·얼굴을 살펴요. 아래 '바로 119'에 해당하는지가 가장 먼저예요.\",\"돋기 전 몇 시간 동안 먹은 것, 새로 쓴 약·세제·로션, 벌레 물림이 있었는지 적어 두면 진료 때 도움이 돼요.\",\"시원한 물수건을 대 주고, 헐렁하고 시원한 옷을 입혀요.\",\"사진을 찍어 두면 사라진 뒤에도 의사에게 보여 줄 수 있어요.\",\"알레르기를 가라앉히는 약(항히스타민제)은 나이에 맞는지 약사·의사에게 확인해요.\"],\"avoid\":[\"뜨거운 물로 씻기\",\"의심되는 음식을 다시 먹여 보며 확인하기\"],\"see\":[\"처음 두드러기가 났을 때, 특히 어떤 음식이나 약을 먹은 뒤일 때\",\"며칠이 지나도 계속 새로 돋을 때\",\"열이 함께 나거나 관절이 붓고 아파할 때\",\"가려움 때문에 잠을 못 잘 때\"],\"urgent\":[\"숨쉬기 힘들어하거나 쌕쌕거리고, 목소리가 쉬거나 기침이 계속될 때\",\"입술·혀·눈두덩·얼굴이 붓거나 삼키기 힘들어할 때\",\"토하거나 배를 몹시 아파하며, 창백해지고 축 늘어질 때\",\"의사에게 받아 둔 응급 주사(에피네프린 자가 주사기)가 있다면 안내받은 대로 쓰고 119에 연락해요.\"],\"source\":\"대한소아청소년과학회 · 대한피부과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-sunburn\",\"title\":\"햇볕에 탔을 때와 자외선 가리기\",\"category\":\"skin\",\"ages\":[0,96],\"keywords\":[\"햇볕 화상\",\"일광화상\",\"햇볕에 탔어요\",\"선크림\",\"자외선 차단제\",\"썬크림 몇 개월\",\"피부가 빨개요\",\"바닷가\",\"물놀이\"],\"summary\":\"물놀이 다녀온 저녁 아이 어깨가 벌겋게 달아 있으면 미안한 마음이 드시죠. 탄 피부를 식히는 방법과, 나이에 따라 햇볕을 가리는 방법이 함께 안내돼요.\",\"home\":[\"탄 자리는 시원한 물로 씻기거나 찬 물수건을 대 식혀 줘요.\",\"식힌 뒤 순한 보습제를 발라 주고, 물을 자주 마시게 해요.\",\"다 나을 때까지 햇볕을 피하고 헐렁한 옷을 입혀요.\",\"6개월 미만 아기는 그늘·모자·얇은 긴 옷으로 햇볕을 가리는 것이 먼저라고 안내돼요. 선크림은 가릴 수 없는 작은 부위에만 조금 쓴다는 안내가 있어요.\",\"6개월부터는 자외선 차단 지수(SPF) 15 이상, 되도록 30 이상의 선크림을 나가기 15~30분 전에 바르고, 2시간마다, 그리고 물놀이 뒤에 덧바르는 방법이 흔히 안내돼요.\",\"햇볕이 가장 센 낮 시간(대략 오전 10시~오후 4시)에는 그늘에서 놀게 하는 분이 많아요.\"],\"avoid\":[\"물집 터뜨리기\",\"얼음을 피부에 바로 대기\",\"오이·감자 같은 것을 갈아 붙이거나 기름을 바르기\"],\"see\":[\"물집이 넓게 생겼을 때\",\"한 살이 안 된 아기가 햇볕에 탔을 때\",\"아파서 잠을 못 자거나 며칠이 지나도 붉은 기운이 가라앉지 않을 때\",\"탄 뒤 열이 나거나 오한이 들 때\"],\"urgent\":[\"햇볕에 오래 있은 뒤 처지거나 헛소리를 하고 깨우기 어려울 때\",\"토하고 물도 넘기지 못하며 소변이 크게 줄었을 때\"],\"source\":\"대한피부과학회 · 미국소아과학회(AAP) · 질병관리청\"},{\"id\":\"c-head-lice\",\"title\":\"머릿니\",\"category\":\"skin\",\"ages\":[24,96],\"keywords\":[\"머릿니\",\"서캐\",\"머리 가려워요\",\"머리를 긁어요\",\"참빗\",\"어린이집 머릿니\",\"유치원 머릿니\"],\"summary\":\"어린이집에서 머릿니 안내문을 받으면 당황스럽고 민망하기도 하시죠. 머릿니는 깨끗하지 않아서가 아니라 머리를 맞대고 노는 아이들 사이에서 잘 옮는다고 알려져 있어요.\",\"home\":[\"밝은 곳에서 머리카락을 갈라 귀 뒤·뒷머리 쪽을 살펴요. 머리카락에 단단히 붙은 작은 알(서캐)이 보이는지 봐요.\",\"머리를 적시고 컨디셔너를 바른 뒤 촘촘한 빗(참빗)으로 두피 쪽에서 머리카락 끝까지 조금씩 빗어 내는 방법이 안내돼요. 며칠 간격으로 2주쯤 되풀이해요.\",\"머릿니 약(샴푸·로션)은 나이 제한이 있어 약사·의사에게 확인하고, 쓰는 방법과 다시 쓰는 날을 그대로 따라요.\",\"같이 사는 가족 머리도 함께 살펴봐요.\",\"최근 쓴 베갯잇·모자·수건은 뜨거운 물로 빨고 뜨겁게 말리거나, 빨 수 없는 것은 비닐봉지에 2주쯤 묶어 두는 방법이 안내돼요.\",\"다니는 기관에 알리고, 등원은 기관 안내를 따라요.\"],\"avoid\":[\"등유·석유·살충제를 머리에 바르기 — 화상·중독 위험이 있다고 안내돼요.\",\"어른용 약을 줄여서 쓰거나 정해진 횟수보다 자주 쓰기\",\"빗·모자·머리끈을 같이 쓰기\"],\"see\":[\"두 살 미만 아기에게서 머릿니가 보일 때\",\"약을 정해진 대로 썼는데도 살아 있는 이가 계속 보일 때\",\"긁은 두피에 진물·고름이 생기거나 목 뒤 멍울이 만져질 때\",\"눈썹·속눈썹에 이나 알이 보일 때\"],\"source\":\"질병관리청 · 미국소아과학회(AAP)\"},{\"id\":\"c-hfmd-blisters\",\"title\":\"손발에 물집이 잡혔을 때\",\"category\":\"skin\",\"ages\":[0,96],\"keywords\":[\"수족구\",\"수족구 물집\",\"손발 물집\",\"손바닥 물집\",\"발바닥 물집\",\"입안 물집\",\"물집\",\"엉덩이 물집\"],\"summary\":\"손바닥·발바닥·입안에 작은 물집이 잡히면 수족구가 아닐까 걱정되시죠. 물집이 잡히는 병은 여러 가지라 집에서 가려내기는 어렵고, 피부를 깨끗하게 지키며 몸 상태를 함께 살피는 것이 안내돼요.\",\"home\":[\"물집은 그대로 두고, 미지근한 물로 살살 씻긴 뒤 톡톡 두드려 말려요.\",\"입안이 아파 잘 못 먹으면 차갑고 부드러운 음식과 물을 조금씩 자주 줘요.\",\"기저귀를 갈거나 화장실에 다녀온 뒤에는 비누로 손을 꼼꼼히 씻어요. 물집 진물과 침·변으로 옮을 수 있다고 안내돼요.\",\"수건·컵·식기는 따로 쓰고, 장난감은 씻어 말려요.\",\"등원은 의사와 다니는 기관의 안내를 따라요.\"],\"avoid\":[\"물집을 바늘로 터뜨리기\",\"나이 확인 없이 연고나 소독약을 바르기\"],\"see\":[\"물집이 처음 보였을 때 — 어떤 병인지는 진료로 확인해요.\",\"입안이 아파 물도 잘 안 마시려 할 때\",\"물집 둘레가 붉게 붓고 고름이 생길 때\",\"열이 이틀 넘게 이어지거나 아이가 평소보다 처질 때\"],\"urgent\":[\"먹지 못하고 소변이 크게 줄었을 때\",\"계속 토하거나 축 늘어져 깨우기 어려울 때\",\"경련을 일으키거나, 깜짝깜짝 놀라며 팔다리를 떠는 일이 잦을 때\",\"숨쉬기 힘들어할 때\"],\"source\":\"질병관리청 · 대한소아청소년과학회\"},{\"id\":\"c-head-bump\",\"title\":\"머리를 부딪쳤을 때\",\"category\":\"injury\",\"ages\":[0,96],\"keywords\":[\"머리 부딪힘\",\"머리를 부딪혔어요\",\"머리 박았어요\",\"침대에서 떨어졌어요\",\"낙상\",\"혹이 났어요\",\"머리 다침\",\"뇌진탕\"],\"summary\":\"쿵 소리에 심장이 내려앉으셨죠. 부딪친 뒤 한동안 아이가 평소와 같은지 지켜보는 것이 가장 중요하다고 안내돼요.\",\"home\":[\"먼저 아이가 울고, 눈을 맞추고, 팔다리를 움직이는지 봐요.\",\"부어오른 혹에는 수건에 싼 얼음팩을 10~20분 대 줘요.\",\"부딪친 뒤 24시간쯤은 곁에서 지켜봐요. 낮잠은 재워도 되지만, 자는 동안에도 숨쉬기와 얼굴색을 살피고 깨웠을 때 평소처럼 반응하는지 봐요.\",\"언제, 어디서, 얼마나 높은 곳에서 떨어졌는지 적어 두면 진료 때 도움이 돼요.\",\"그날은 뛰거나 부딪힐 수 있는 놀이 대신 조용히 쉬게 해요.\"],\"avoid\":[\"아이를 세게 흔들어 깨우기\",\"목이나 등을 다친 것 같은데 억지로 일으켜 세우기\"],\"see\":[\"돌 전 아기가 머리를 부딪쳤을 때, 특히 혹이 머리 옆이나 뒤에 크게 생겼을 때\",\"높은 곳(아이 키보다 높은 곳·계단)에서 떨어졌을 때\",\"머리가 아프다고 계속 말하거나 한 번 토했을 때\",\"평소보다 보채거나 잘 먹지 않을 때\",\"상처가 벌어져 있거나 피가 멈추지 않을 때\"],\"urgent\":[\"잠깐이라도 의식을 잃었거나, 처지고 깨우기 어려울 때\",\"여러 번 토하거나 경련을 일으켰을 때\",\"코·귀에서 맑은 물이나 피가 흐르거나, 눈동자 크기가 다르거나, 한쪽 팔다리에 힘이 없을 때\",\"말이 어눌해지거나 걸음이 비틀거릴 때, 아기 정수리 숨구멍이 불룩 솟았을 때\"],\"source\":\"대한소아청소년과학회 · 소방청 · 미국소아과학회(AAP)\"},{\"id\":\"c-cuts-scrapes\",\"title\":\"긁히고 베였을 때\",\"category\":\"injury\",\"ages\":[0,96],\"keywords\":[\"상처\",\"까졌어요\",\"무릎 까짐\",\"베였어요\",\"피가 나요\",\"찰과상\",\"넘어졌어요\",\"밴드\",\"소독\"],\"summary\":\"넘어져 무릎이 까지는 건 아이가 크며 자주 겪는 일이에요. 깨끗이 씻고 피를 멈추고 덮어 주는 것, 그리고 덧나는 신호를 살피는 것이 공통으로 안내돼요.\",\"home\":[\"손을 씻은 뒤, 상처를 흐르는 물로 충분히 씻어 흙·모래를 흘려보내요.\",\"피가 나면 깨끗한 거즈나 천으로 10분쯤 꾹 누르고, 중간에 들춰 보지 않아요.\",\"피가 멈추면 상처를 덮어 깨끗하게 지켜요. 덮개가 젖거나 더러워지면 갈아 줘요.\",\"바르는 약은 나이에 맞는지 약사·의사에게 확인해요.\",\"아이의 예방접종 기록에서 파상풍 접종을 제때 맞았는지 확인해 두면 진료 때 도움이 돼요.\"],\"avoid\":[\"된장·흙·침 바르기\",\"상처에 솜을 직접 대기 — 솜털이 상처에 붙을 수 있어요.\",\"딱지를 억지로 뜯기\"],\"see\":[\"상처가 벌어져 있거나 깊어 속살이 보일 때\",\"얼굴이 베였거나 입술 가장자리를 넘어 찢어졌을 때\",\"유리·나무 조각·흙이 박혀 씻어도 빠지지 않을 때\",\"녹슨 것에 찔렸거나 동물·사람에게 물렸을 때\",\"며칠 뒤 상처가 뜨겁게 붓고 붉은 기운이 퍼지거나 고름·열이 날 때\"],\"urgent\":[\"10분 넘게 꾹 눌러도 피가 멈추지 않거나 피가 솟구칠 때\",\"깊이 찔렸거나 눈을 다쳤을 때\",\"다친 뒤 창백해지고 처질 때\"],\"source\":\"소방청 · 대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-burns\",\"title\":\"데었을 때\",\"category\":\"injury\",\"ages\":[0,96],\"keywords\":[\"화상\",\"데었어요\",\"뜨거운 물\",\"국에 데었어요\",\"다리미\",\"밥솥 수증기\",\"물집\",\"화상 응급처치\"],\"summary\":\"순식간에 일어난 일에 자책이 먼저 드실 수 있어요. 데었을 때는 흐르는 물로 오래 식히는 것이 가장 먼저라고 안내돼요.\",\"home\":[\"곧바로 흐르는 시원한 수돗물에 10~20분쯤 대 열기를 빼요. 아이가 춥지 않게 다른 곳은 덮어 줘요.\",\"넓게 데었을 때는 오래 식히면 체온이 떨어질 수 있어요. 식히면서 바로 119에 전화해요.\",\"덴 곳의 옷·반지·팔찌는 붓기 전에 벗겨요. 피부에 달라붙은 옷은 떼지 말고 그 위로 식혀요.\",\"식힌 뒤에는 깨끗한 랩이나 거즈로 느슨하게 덮어요.\",\"뜨거운 국·커피·전기포트·밥솥은 아이 손이 닿지 않는 곳에 두고, 식탁보는 걷어 두는 집이 많아요.\"],\"avoid\":[\"된장·치약·소주·간장·버터·기름 바르기\",\"얼음을 바로 대거나 얼음물에 담그기\",\"물집 터뜨리기\",\"솜이나 털이 날리는 천으로 덮기\"],\"see\":[\"물집이 생겼을 때\",\"돌 전 아기가 데었을 때 — 작아 보여도 진료로 확인해요.\",\"덴 곳이 아이 손바닥보다 넓을 때\",\"관절 위나 손가락 사이를 데었을 때\",\"며칠 뒤 붉은 기운이 퍼지고 고름·열이 날 때\"],\"urgent\":[\"화상 부위가 넓거나 얼굴·손·발·생식기에 화상을 입었을 때\",\"피부가 하얗게 또는 검게 변하고 오히려 아파하지 않을 때\",\"전기·화학물질에 데었거나, 연기를 마셔 기침·쉰 목소리가 날 때\"],\"source\":\"소방청 · 대한화상학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-swallowed-object\",\"title\":\"무언가를 삼켰을 때\",\"category\":\"injury\",\"ages\":[6,96],\"keywords\":[\"삼켰어요\",\"건전지 삼킴\",\"단추형 건전지\",\"동전 삼킴\",\"자석 삼킴\",\"약 먹었어요\",\"세제 먹었어요\",\"이물질 삼킴\",\"장난감 삼킴\"],\"summary\":\"무엇을 삼켰는지 모를 때가 가장 막막하시죠. 삼킨 것이 무엇인지에 따라 지금 바로 119가 필요한 경우가 있어, 그것부터 확인하는 것이 안내돼요.\",\"home\":[\"먼저 숨을 쉬는지 봐요. 기침도 울음도 어떤 소리도 나지 않으면 바로 119에 연락해요.\",\"삼킨 것으로 보이는 물건·약통·세제 통을 챙겨 가요. 남은 개수를 세어 두면 도움이 돼요.\",\"숨을 잘 쉬고 평소와 같아도, 무엇을 삼켰는지 확인되면 아래 기준대로 진료로 넘겨요.\",\"단추형 건전지·자석·약·세제는 아이 눈에 띄지 않고 잠글 수 있는 곳에 두는 집이 많아요. 리모컨·체중계의 건전지 덮개가 잘 닫히는지도 봐요.\"],\"avoid\":[\"손가락을 넣어 억지로 토하게 하기\",\"약이나 세제를 삼켰을 때 소금물·우유를 먹여 토하게 하기\",\"괜히 물이나 음식을 먹여 내려보내기\"],\"see\":[\"동전처럼 작고 매끈한 것을 삼켰을 때 — 숨쉬기와 먹기가 평소와 같아도 진료로 위치를 확인하는 경우가 많아요.\",\"삼킨 뒤 침을 흘리거나, 삼키기 아파하거나, 먹기를 거부할 때\",\"삼킨 뒤 기침이 계속되거나 숨소리가 거칠어질 때\"],\"urgent\":[\"단추형 건전지를 삼켰거나 삼켰을 수 있을 때 — 증상이 없어도 바로 응급실로 가요.\",\"자석을 삼켰을 때, 특히 두 개 넘게 삼켰을 때\",\"약·세제·담배·기름 같은 것을 먹었거나 먹었을 수 있을 때 — 119에 연락해 안내를 받아요.\",\"기침도 울음도 어떤 소리도 나지 않거나 숨쉬기 힘들어하고 입술색이 변할 때\"],\"source\":\"소방청 · 한국소비자원 · 대한소아청소년과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-nose-ear-object\",\"title\":\"코나 귀에 무언가를 넣었을 때\",\"category\":\"injury\",\"ages\":[12,96],\"keywords\":[\"코에 넣었어요\",\"콧구멍 이물질\",\"귀에 넣었어요\",\"귓구멍 이물질\",\"비비탄\",\"콩 넣었어요\",\"구슬\",\"귀에 벌레\"],\"summary\":\"아이가 콧구멍에 구슬을 넣었다고 하면 어떻게 빼야 할지 손부터 나가시죠. 집에서 빼려다 더 깊이 들어가는 일이 많아, 할 수 있는 것과 하지 않을 것을 나눠 두는 것이 좋다고 안내돼요.\",\"home\":[\"아이를 달래 코로 세게 들이마시지 않게 하고 입으로 숨 쉬게 해요.\",\"코를 풀 줄 아는 아이라면 다른 쪽 콧구멍을 눌러 막고 '흥' 하고 풀게 해 봐요.\",\"눈에 보이고 손으로 쉽게 잡히는 것만 조심히 빼고, 보이지 않으면 그대로 진료로 넘겨요.\",\"귀에 벌레가 들어가 움직이면 어두운 곳에서 귀에 빛을 비춰 나오게 해 보는 방법이 안내돼요.\"],\"avoid\":[\"핀셋·면봉·귀이개를 깊숙이 넣어 빼기\",\"콩·씨앗처럼 물에 붇는 것이 들어갔을 때 물을 넣어 씻어 내기\",\"아이를 억지로 붙잡고 여러 번 시도하기\"],\"see\":[\"집에서 빠지지 않았을 때 — 소아청소년과나 이비인후과로 가요.\",\"한쪽 콧구멍에서만 냄새나는 콧물이나 피가 계속 날 때\",\"귀가 아프다고 하거나 귀에서 진물·피가 날 때\",\"넣었는지 확실하지 않아도 아이가 넣었다고 말할 때\"],\"urgent\":[\"단추형 건전지·자석이 코나 귀에 들어갔을 때\",\"숨쉬기 힘들어하거나 넣은 것을 들이마신 것 같을 때\",\"피가 10분 넘게 멈추지 않을 때\"],\"source\":\"대한소아청소년과학회 · 대한이비인후과학회 · 소방청\"},{\"id\":\"c-finger-pinch\",\"title\":\"손가락이 문틈에 끼었을 때\",\"category\":\"injury\",\"ages\":[6,96],\"keywords\":[\"손가락 끼임\",\"문틈\",\"문에 끼었어요\",\"손가락 다침\",\"손톱 멍\",\"손톱이 까매요\",\"현관문\",\"서랍\"],\"summary\":\"문이 닫히는 순간 아이 울음이 터지면 가슴이 철렁하시죠. 부기를 줄이며 뼈·손톱 밑이 다쳤을 신호를 살피는 것이 안내돼요.\",\"home\":[\"흐르는 시원한 물에 대거나 수건에 싼 얼음팩을 10~20분 대 줘요.\",\"손을 심장보다 조금 높게 올려 두면 부기가 덜하다고 안내돼요.\",\"피가 나면 깨끗한 거즈로 꾹 눌러 멈추고 덮어 줘요.\",\"문 가장자리에 끼임 방지 장치를 달고, 문이 바람에 닫히지 않게 고정하는 집이 많아요.\"],\"avoid\":[\"손가락을 잡아당기거나 세게 주무르기\",\"손톱 밑에 고인 피를 바늘로 빼기\"],\"see\":[\"손가락이 휘어 보이거나 구부리고 펴지 못할 때\",\"부기와 통증이 몇 시간이 지나도 줄지 않을 때\",\"손톱 밑에 피가 고여 까맣게 되고 몹시 아파할 때\",\"손톱이 들리거나 빠졌을 때, 또는 살이 벌어졌을 때\"],\"urgent\":[\"손가락 끝이 잘렸을 때 — 잘린 조각을 젖은 거즈에 싸서 비닐에 넣고, 그 비닐을 얼음물에 담가 함께 가져가요. 조각이 얼음에 바로 닿지 않게 해요.\",\"10분 넘게 눌러도 피가 멈추지 않을 때\"],\"source\":\"소방청 · 한국소비자원 · 미국소아과학회(AAP)\"},{\"id\":\"c-tooth-injury\",\"title\":\"이가 부딪혔을 때\",\"category\":\"injury\",\"ages\":[6,96],\"keywords\":[\"이 빠짐\",\"이가 빠졌어요\",\"앞니 다침\",\"이 부러짐\",\"이가 흔들려요\",\"입술 터짐\",\"치아 외상\",\"넘어져 이\"],\"summary\":\"넘어져 입에서 피가 나면 이가 어떻게 됐는지부터 걱정되시죠. 젖니인지 영구치인지에 따라 하는 일이 달라, 빠진 이를 어떻게 챙기는지가 함께 안내돼요.\",\"home\":[\"입안을 물로 헹구고, 피가 나는 곳은 깨끗한 거즈로 꾹 눌러요.\",\"입술·볼이 부으면 바깥에서 찬 물수건을 대 줘요.\",\"빠진 이는 뿌리를 만지지 말고 머리 쪽을 잡아 주워요. 흙이 묻었으면 우유나 생리식염수로 살짝 헹궈요.\",\"빠진 이는 우유나 생리식염수에 담가 가져가요. 둘 다 없으면 아이 침에 담그는 방법도 안내되지만, 어린아이 입에 물려 두지는 않아요.\",\"영구치가 빠졌다면 30분~1시간 안에 치과에 도착하는 것이 중요하다고 안내돼요.\"],\"avoid\":[\"빠진 이를 문질러 씻거나 휴지로 싸서 말리기\",\"빠진 이를 맹물에 담가 두기\",\"빠진 젖니를 집에서 다시 끼워 넣기\"],\"see\":[\"이가 빠졌거나 부러졌을 때 — 젖니든 영구치든 치과로 가요.\",\"이가 흔들리거나 밀려 들어가 보이거나, 위치가 달라졌을 때\",\"며칠 뒤 이 색이 회색이나 검은색으로 변하거나 잇몸이 붓고 고름이 날 때\",\"입술·혀가 깊게 찢어졌을 때\"],\"urgent\":[\"부딪친 뒤 의식을 잃었거나 여러 번 토할 때\",\"10분 넘게 눌러도 입안 피가 멈추지 않을 때\",\"턱이 벌어지지 않거나 이가 맞물리지 않을 때\"],\"source\":\"대한소아치과학회 · 대한치과의사협회 · 미국소아과학회(AAP)\"},{\"id\":\"c-nail-trimming\",\"title\":\"손발톱 깎기\",\"category\":\"daily\",\"ages\":[0,96],\"keywords\":[\"손톱 깎기\",\"발톱 깎기\",\"신생아 손톱\",\"아기 손톱\",\"얼굴 긁어요\",\"손톱 가위\",\"내성 발톱\",\"손톱 피\"],\"summary\":\"작은 손가락에 손톱깎이를 대는 게 겁나시죠. 아기 손톱은 빨리 자라고 얇아, 깎는 때와 도구를 고르면 한결 수월하다고 안내돼요.\",\"home\":[\"목욕 뒤 손톱이 부드러울 때나 깊이 잠들었을 때 깎는 분이 많아요.\",\"신생아는 끝이 둥근 아기용 손톱 가위나 손톱 줄로 다듬는 방법이 흔히 안내돼요.\",\"손가락 끝살을 아래로 살짝 눌러 손톱과 떨어뜨린 뒤 깎아요.\",\"손톱은 손가락 모양을 따라 둥글게, 발톱은 일자로 깎고 모서리를 너무 깊이 파지 않아요.\",\"깎다 피가 나면 깨끗한 거즈로 꾹 눌러 멈추고, 밴드는 아기가 입에 넣을 수 있어 조심해요.\"],\"avoid\":[\"입으로 물어 끊기 — 입속 세균이 들어가 덧날 수 있다고 안내돼요.\",\"발톱 양쪽 모서리를 깊게 파서 깎기\",\"거스러미를 손으로 잡아 뜯기\"],\"see\":[\"손발톱 둘레가 붉게 붓고 아파하거나 고름이 잡힐 때\",\"발톱이 살을 파고들어 걸을 때 아파할 때\",\"손발톱 색이나 모양이 눈에 띄게 달라졌을 때\"],\"source\":\"대한소아청소년과학회 · 대한피부과학회 · 미국소아과학회(AAP)\"},{\"id\":\"c-bath-water\",\"title\":\"목욕물 온도와 목욕 안전\",\"category\":\"daily\",\"ages\":[0,96],\"keywords\":[\"목욕물 온도\",\"목욕 온도\",\"신생아 목욕\",\"아기 목욕\",\"욕조\",\"목욕 몇 도\",\"물놀이 욕조\",\"익수\"],\"summary\":\"물이 너무 뜨겁지는 않을까, 미끄러지지는 않을까 목욕 시간마다 마음이 쓰이시죠. 물 온도와 함께, 잠깐이라도 아이 곁을 떠나지 않는 것이 공통으로 안내돼요.\",\"home\":[\"목욕물은 38도 안팎으로 맞추라는 안내가 많아요. 온도계가 없으면 팔꿈치 안쪽을 담가 따뜻하다고 느낄 정도로 맞춰요.\",\"찬물을 먼저 받고 뜨거운 물을 섞은 뒤 손으로 저어 고르게 해요.\",\"필요한 것(수건·옷·기저귀)을 미리 곁에 두고 시작해요.\",\"아기는 물이 몇 센티미터만 있어도 빠질 수 있다고 안내돼요. 전화·초인종이 울려도 아이를 데리고 나가요.\",\"목욕을 마치면 바로 물을 빼고, 온수기 온도를 너무 높게 두지 않아요.\",\"신생아는 배꼽이 떨어질 때까지 물에 담그지 않고 닦아 주는 방법도 안내돼요.\"],\"avoid\":[\"형제자매에게 잠깐 맡기고 자리를 비우기\",\"아기 목욕 의자·튜브에 앉혀 두고 곁을 떠나기\",\"아이가 욕조에 있을 때 뜨거운 물을 바로 틀기\"],\"see\":[\"목욕 뒤 피부가 붉게 일어나거나 가려움이 계속될 때\",\"목욕을 몹시 무서워해 매번 심하게 울 때 — 방법을 함께 물어봐도 좋아요.\"],\"urgent\":[\"물에 빠졌다가 나온 뒤 기침이 계속되거나 숨쉬기 힘들어할 때 — 깨어 있어도 119에 연락해요.\",\"물에 빠져 반응이 없거나 숨을 쉬지 않을 때\",\"뜨거운 물에 데었을 때 — 흐르는 시원한 물로 식히며 '데었을 때'를 함께 봐요.\"],\"source\":\"대한소아청소년과학회 · 소방청 · 미국소아과학회(AAP)\"},{\"id\":\"c-umbilical-cord\",\"title\":\"신생아 배꼽 관리\",\"category\":\"daily\",\"ages\":[0,2],\"keywords\":[\"배꼽\",\"신생아 배꼽\",\"탯줄\",\"배꼽 소독\",\"배꼽이 안 떨어져요\",\"배꼽 진물\",\"배꼽 냄새\",\"배꼽 피\"],\"summary\":\"탯줄이 남은 배꼽을 만지기가 조심스러우시죠. 깨끗하고 마르게 두면 대개 1~2주 사이에 저절로 떨어진다고 알려져 있어요.\",\"home\":[\"배꼽은 깨끗하고 마르게 두는 것이 공통으로 안내돼요. 소독 방법은 출산한 병원·의사의 안내를 따라요.\",\"기저귀는 배꼽 아래로 접어 채워 공기가 통하게 해요.\",\"더러워지면 물로 살살 닦고 잘 말려 줘요.\",\"떨어질 무렵 피가 몇 방울 묻어나는 일도 있어요. 깨끗한 거즈로 살짝 눌러 줘요.\"],\"avoid\":[\"덜 떨어진 탯줄을 잡아당겨 떼기\",\"배꼽 위를 꽉 덮거나 파우더를 뿌리기\",\"동전·반창고로 배꼽을 눌러 두기\"],\"see\":[\"배꼽 둘레가 붉게 부어오르거나 붉은 기운이 퍼질 때\",\"고름이나 노란 진물이 나고 냄새가 날 때\",\"눌러도 피가 계속 배어 나올 때\",\"3주가 지나도 떨어지지 않거나, 떨어진 뒤 촉촉한 살덩이가 남아 있을 때\"],\"urgent\":[\"38도 이상 열이 날 때 — 생후 3개월 미만은 바로 진료가 필요하다고 안내돼요.\",\"배꼽 둘레 붉은 기운이 빠르게 번지면서 아기가 처지고 잘 먹지 않을 때\"],\"source\":\"대한소아청소년과학회 · 세계보건기구(WHO) · 미국소아과학회(AAP)\"},{\"id\":\"c-hot-weather\",\"title\":\"더운 날 살필 것\",\"category\":\"daily\",\"ages\":[0,96],\"keywords\":[\"더위\",\"폭염\",\"열사병\",\"일사병\",\"온열질환\",\"더위 먹었어요\",\"차 안\",\"여름 외출\",\"탈수\"],\"summary\":\"아이는 어른보다 더위에 빨리 지친다고 알려져 있어요. 물을 자주 주고 한낮 햇볕을 피하는 것, 그리고 차 안에 잠깐이라도 혼자 두지 않는 것이 공통으로 안내돼요.\",\"home\":[\"목마르다고 하기 전에 물을 자주 줘요. 6개월 미만 아기는 맹물 대신 평소보다 자주 모유·분유를 먹여요.\",\"가장 더운 한낮(대략 낮 12시~오후 5시)에는 바깥 놀이를 줄이고 그늘에서 쉬게 해요.\",\"헐렁하고 밝은 색의 얇은 옷을 입히고 챙 넓은 모자를 씌워요.\",\"유모차를 담요로 꽁꽁 덮으면 안이 뜨거워질 수 있다고 안내돼요.\",\"차에서 내릴 때는 뒷좌석을 꼭 확인해요. 잠깐이라도 아이를 차 안에 혼자 두지 않아요.\",\"얼굴이 붉고 땀을 많이 흘리며 지쳐 보이면 시원한 곳으로 옮겨 옷을 느슨하게 하고 물을 마시게 해요.\"],\"avoid\":[\"잠든 아이를 차 안에 두고 잠깐 볼일 보기\",\"더울 때 얼음물에 갑자기 몸을 담그기\",\"어지러워하는 아이에게 억지로 물을 먹이기 — 삼킬 수 있을 때만 줘요.\"],\"see\":[\"시원한 곳에서 쉬어도 두통·어지럼·메스꺼움이 이어질 때\",\"소변이 눈에 띄게 줄거나 색이 짙어졌을 때\",\"땀띠·햇볕 화상이 넓게 생겼을 때\"],\"urgent\":[\"몸이 뜨거운데 땀이 나지 않고, 헛소리를 하거나 깨우기 어려울 때\",\"경련을 일으키거나 의식을 잃었을 때\",\"차 안에 혼자 있던 아이를 발견했을 때 — 바로 119에 연락해요.\",\"계속 토해 물을 넘기지 못하고 축 늘어질 때\"],\"source\":\"질병관리청 · 소방청 · 미국소아과학회(AAP)\"},{\"id\":\"c-cold-weather\",\"title\":\"추운 날 옷과 실내\",\"category\":\"daily\",\"ages\":[0,96],\"keywords\":[\"추운 날\",\"겨울 옷\",\"옷 몇 겹\",\"동상\",\"실내 습도\",\"실내 온도\",\"가습기\",\"겨울 외출\",\"카시트 패딩\"],\"summary\":\"얼마나 입혀야 할지, 방은 몇 도로 맞춰야 할지 겨울이면 늘 헷갈리시죠. 얇은 옷을 여러 겹 입히고, 덥게 하지도 춥게 하지도 않게 살피는 것이 안내돼요.\",\"home\":[\"아기는 어른이 입은 것보다 한 겹 더 입히는 기준이 흔히 안내돼요. 목덜미·등을 만져 땀이 나면 한 겹 덜어요.\",\"두꺼운 옷 한 벌보다 얇은 옷 여러 겹이 체온 맞추기에 쉬워요. 모자·장갑·양말로 머리와 손발을 감싸요.\",\"실내는 너무 덥지도 건조하지도 않게 맞추라는 안내가 많아요.\",\"가습기는 매일 물을 갈고 자주 씻어 말려요. 아이 손이 닿지 않는 곳에 둬요.\",\"카시트에 태울 때는 두꺼운 패딩을 벗기고 안전띠를 맞춘 뒤 그 위에 담요를 덮어 줘요.\",\"잠잘 때 아기에게 모자를 씌우거나 두꺼운 이불을 덮지 않아요. 지나치게 덥게 재우지 않는 것이 안내돼요.\"],\"avoid\":[\"언 손발을 눈으로 문지르거나 세게 비비기\",\"언 손발을 난로·뜨거운 물·드라이어로 바로 녹이기\",\"가습기 물에 살균제나 첨가제를 넣기\"],\"see\":[\"손발·귀·볼이 하얗게 또는 회색으로 변하고 따뜻하게 해도 감각이 돌아오지 않을 때\",\"녹인 뒤 물집이 생기거나 몹시 아파할 때\",\"건조한 날 피부가 갈라져 피가 나거나 가려움이 심할 때\"],\"urgent\":[\"몸이 차갑고, 떨다가 오히려 떨림이 멈추며, 처지거나 말이 어눌해질 때\",\"피부가 단단하고 검게 변했을 때\",\"깨우기 어렵거나 숨이 느려질 때\"],\"source\":\"질병관리청 · 대한소아청소년과학회 · 미국소아과학회(AAP)\"}]}]}],null],null],null]},[null,[\"$\",\"$L6\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"care\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L7\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/ff1e72f94608fc83.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"ko\",\"children\":[[\"$\",\"head\",null,{\"children\":[\"$\",\"script\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\"(function(){try{\\nvar c=localStorage.getItem('parentway.theme.v1');\\nvar d=c==='dark'||((!c||c==='system')\u0026\u00
