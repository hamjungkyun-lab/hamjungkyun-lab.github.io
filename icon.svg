<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="참교육">
  <!--
    참교육 마크 — 펼친 교과서.

    ★ 글자를 넣지 않았다.
      "참" 을 그리면 한글 글꼴이 없는 기기에서 네모(두부)로 나온다.
      파비콘은 어디서 열릴지 모르는 그림이라 도형으로만 만든다.

    ★ 16px 에서도 읽혀야 한다.
      획을 두 장의 면과 가운데 홈, 셋으로만 두었다.
  -->
  <rect width="32" height="32" rx="8.5" fill="#6B5BFF" />

  <!-- 왼쪽 면 -->
  <path
    d="M6.2 9.6c3.1-1.35 6.05-1.3 8.85.35v12.6c-2.8-1.65-5.75-1.7-8.85-.35z"
    fill="#fff"
    fill-opacity=".88"
  />
  <!-- 오른쪽 면 -->
  <path
    d="M25.8 9.6c-3.1-1.35-6.05-1.3-8.85.35v12.6c2.8-1.65 5.75-1.7 8.85-.35z"
    fill="#fff"
  />
  <!-- 가운데 홈 — 펼쳐져 있다는 것이 여기서 읽힌다 -->
  <rect x="15.25" y="9.6" width="1.5" height="12.95" rx=".75" fill="#6B5BFF" fill-opacity=".55" />
</svg>
